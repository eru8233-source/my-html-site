NV(6058, "集合", "つぎの説明を読んで，各問いに答えなさい。\n\nある中学校では，生徒が体育系，文化系のクラブにそれぞれ1つずつまで所属することができる。この学校で，生徒90人にクラブ活動に関する調査を行ったところ，つぎのことがわかった。\n\nI）文化系のクラブに所属している生徒のうち，40%の生徒が体育系のクラブにも所属している\nII）体育系のクラブのみに所属している生徒は42人である\n\nIII）いずれのクラブにも所属していない生徒は3人いる\n\nIV）体育系のクラブに所属している生徒のうち，20%の生徒が球技のクラブに所属している\n\n球技のクラブに所属している生徒のうち2/3の生徒が文化系のクラブにも所属している。体育系のクラブのみに所属している生徒の中で，球技以外のクラブに所属している生徒は何人か。", ["8人", "10人", "12人", "18人", "27人", "30人", "38人", "42人", "48人", "AからIのいずれでもない"], "single", 6, "1. 体育系クラブ全体の人数：\n\n体育系のみ（42人）＋ 両方所属（0.40 × 45 ＝ 18人）＝ 60人。\n\n2. 球技クラブ所属の人数（条件IV）：\n\n60人 × 0.20 ＝ 12人。\n\n3. この12人のうち 2/3（12 × 2/3 ＝\n8人）が文化系にも所属（両方所属かつ球技）。\n\n4. したがって、球技クラブで「体育系のみ」に所属している人数：\n\n12人 － 8人 ＝ 4人。\n\n5. 体育系のみ（42人）の中で「球技以外」の人数：\n\n42人 － 4人 ＝ 38人 となります。", 5, "NV_SET_6057", 2, 3, [null, null, null, null, null, null, null, "ステップ途中の人数（8人や12人など）を答えた誤りです。\n\n【外部情報使用：なし】\n\n---", null, null], "113"),
NV(6059, "集合", "つぎの説明を読んで，各問いに答えなさい。\n\nある中学校では，生徒が体育系，文化系のクラブにそれぞれ1つずつまで所属することができる。この学校で，生徒90人にクラブ活動に関する調査を行ったところ，つぎのことがわかった。\n\nI）文化系のクラブに所属している生徒のうち，40%の生徒が体育系のクラブにも所属している\nII）体育系のクラブのみに所属している生徒は42人である\n\nIII）いずれのクラブにも所属していない生徒は3人いる\n\nIV）体育系のクラブに所属している生徒のうち，20%の生徒が球技のクラブに所属している\n\n文化系クラブと，体育系で球技以外のクラブの両方に所属している生徒は，体育系クラブに所属している生徒の何%を占めるか(必要なときは，最後に小数点以下第1位を四捨五入すること)。", ["4%", "7%", "9%", "11%", "13%", "17%", "20%", "42%", "63%", "AからIのいずれでもない"], "single", 5, "1. 両方所属している全体人数：18人。\n\n2. 問題62より、両方所属かつ球技の人数は 8人。\n\n3. したがって、両方所属かつ球技以外の人数：\n\n18人 － 8人 ＝ 10人。\n\n4. 体育系クラブ全体（60人）に占める割合：\n\n(10 ÷ 60) × 100 ＝ 16.666...%\n\n5. 小数点以下第1位を四捨五入して 17% となります。", 5, "NV_SET_6057", 3, 3, [null, null, null, null, null, null, null, null, "分母を全生徒90人にして計算したミス等の不適切値です。\n\n【外部情報使用：なし】\n\n---", null], "115"),
NV(6060, "損益算", "つぎの説明を読んで，各問いに答えなさい。\n\n商品Pを400個仕入れ，1個300円ですべて売ったところ，総額で18000円の利益を得た。商品Pの1個あたりの仕入れ値はいくらか。", ["240円", "245円", "250円", "255円", "260円", "265円", "270円", "275円", "280円", "AからIのいずれでもない"], "single", 3, "1. 売上総額：400個 × 300円 ＝ 120,000円\n\n2. 仕入れ総額：120,000円 － 18,000円（利益）＝ 102,000円\n\n3. 1個あたりの仕入れ値：102,000円 ÷ 400個 ＝ 255円 となります。", 4, "NV_SET_6060", 1, 2, [null, null, null, null, null, null, null, null, "1個あたりの利益（45円）の引き算ミスによる不適切な数値です。\n\n【外部情報使用：なし】\n\n---", null], "117"),
NV(6061, "損益算", "つぎの説明を読んで，各問いに答えなさい。\n\n1個あたりの仕入れ値が500円の商品Qを300個仕入れた。そのうち100個を定価の1割引きで，200個を定価の2割引きで売ったときの利益が総額で12500円となるようにしたい。商品Qの定価をいくらにすればよいか。", ["525円", "550円", "575円", "600円", "625円", "650円", "675円", "700円", "725円", "AからIのいずれでもない"], "single", 5, "!テキスト AI\nによって生成されたコンテンツは間違っている可能性があります。](media/image12.png){width=\"5.905555555555556in\"\nheight=\"1.4006944444444445in\"}", 4, "NV_SET_6060", 2, 2, [null, null, null, null, null, null, null, null, "割引率（1割引き・2割引き）の適用計算ミスによる誤りです。\n\n【外部情報使用：なし】\n\n---", null], "119"),
NV(6062, "順列・組み合わせ", "つぎの説明を読んで，各問いに答えなさい。\n\nP，Q，R，S，Tの5人の生徒が教室を清掃する。\n\n5人それぞれが音楽室，美術室のどちらかを担当して2つの教室を清掃する。このとき，だれがどの教室を担当するか，その組み合わせは何通りか。", ["5通り", "10通り", "15通り", "20通り", "25通り", "30通り", "35通り", "40通り", "45通り", "AからIのいずれでもない"], "single", 9, "!テキスト, 手紙 AI\nによって生成されたコンテンツは間違っている可能性があります。](media/image13.png){width=\"5.905555555555556in\"\nheight=\"0.7861111111111111in\"}", 4, "NV_SET_6062", 1, 2, [null, null, null, null, null, null, null, null, "選択肢に正解である32通りが存在しないため不適切です。\n\n【外部情報使用：なし】\n\n---", null], "121"),
NV(6063, "順列・組み合わせ", "つぎの説明を読んで，各問いに答えなさい。\n\nP，Q，R，S，Tの5人の生徒が教室を清掃する。\n\n5人それぞれが音楽室，美術室，調理室のうちの1つを担当して3つの教室を清掃する。このとき，だれがどの教室を担当するか，その組み合わせは何通りか。", ["20通り", "30通り", "50通り", "60通り", "90通り", "100通り", "120通り", "130通り", "150通り", "AからIのいずれでもない"], "single", 9, "!](media/image14.png){width=\"5.905555555555556in\"\nheight=\"0.7201388888888889in\"}", 4, "NV_SET_6062", 2, 2, [null, null, null, null, null, null, null, null, "誤った順列・組合せ計算による不適切選択肢です。\n\n【外部情報使用：なし】\n\n---", null], "123"),
NV(6064, "推論", "つぎの説明を読んで，各問いに答えなさい。\n\nある劇団が100人まで入れるホールで公演を3回行った。このときの観客数について，以下のことがわかっている。\n\nI）観客数は3回で合計231人だった\n\nII）2回目の観客数は60人だった\n\nつぎの推論ア，イについて，必ず正しいか，必ず誤りか，あるいはどちらともいえないかを考え，AからIまでの中から正しいものを1つ選びなさい。\n\nア 1回目の観客数が最も多い\n\nイ 3回目の観客数が最も少ない", ["アもイも正しい", "アは正しいが，イはどちらともいえない", "アは正しいが，イは誤り", "アはどちらともいえないが，イは正しい", "アもイもどちらともいえない", "アはどちらともいえないが，イは誤り", "アは誤りだが，イは正しい", "アは誤りだが，イはどちらともいえない", "アもイも誤り"], "single", 5, "1. 1回目と3回目の合計観客数：231人 － 60人 ＝ 171人。\n\n2. ホールの定員が100人なので、1回目も3回目も観客数は最大100人です。\n\nしたがって、1回目・3回目の観客数はどちらも 71人以上100人以下\nです。\n\n3. 推論の真偽評価：\n\n- 推論ア「1回目の観客数が最も多い」：(100人, 60人, 71人)\nなら1回目が最多ですが、(71人, 60人, 100人) なら3回目が最多です。よって\nどちらともいえない。\n\n-\n推論イ「3回目の観客数が最も少ない」：2回目の観客数は60人であり、3回目の観客数は最小でも71人であるため、必ず「2回目\n＜\n3回目」となります。3回目の観客数が最も少なくなることは絶対にありません。よって\n必ず誤り。\n\n以上より、F（アはどちらともいえないが，イは誤り） が正解です。", 4, "NV_SET_6064", 1, 2, [null, null, null, null, null, null, null, null, "推論ア・イの論理評価ミスによる誤りです。\n\n【外部情報使用：なし】\n\n---"], "125"),
NV(6065, "推論", "つぎの説明を読んで，各問いに答えなさい。\n\nある劇団が100人まで入れるホールで公演を3回行った。このときの観客数について，以下のことがわかっている。\n\nI）観客数は3回で合計231人だった\n\nII）2回目の観客数は60人だった\n\nつぎの推論カ，キについて，必ず正しいか，必ず誤りか，あるいはどちらともいえないかを考え，AからIまでの中から正しいものを1つ選びなさい。\n\nカ 1回目と2回目の観客数の差は10人より少ない\n\nキ 1回目と3回目の観客数の差は30人より少ない", ["カもキも正しい", "カは正しいが，キはどちらともいえない", "カは正しいが，キは誤り", "カはどちらともいえないが，キは正しい", "カもキもどちらともいえない", "カはどちらともいえないが，キは誤り", "カは誤りだが，キは正しい", "カは誤りだが，キはどちらともいえない", "カもキも誤り"], "single", 6, "1. 問題68より、1回目の観客数は 71人〜100人 です。\n\n-\n推論カ「1回目と2回目の差は10人より少ない」：1回目（71〜100人）と2回目（60人）の差は最小でも\n71 － 60 ＝ 11人 であり、常に10人以上です。したがって 必ず誤り。\n\n2. 1回目と3回目の合計は171人です。両者が最も離れるのは (100人, 71人)\nまたは (71人, 100人) のときで、差は最大でも 100 － 71 ＝ 29人\nです。\n\n-\n推論キ「1回目と3回目の差は30人より少ない」：最大差が29人であるため、常に30人未満となります。したがって\n必ず正しい。\n\n以上より、G（カは誤りだが，キは正しい） が正解です。", 4, "NV_SET_6064", 2, 2, [null, null, null, null, null, null, null, null, "不等式の境界値検証ミスによる不適切選択肢です。\n\n【外部情報使用：なし】\n\n---"], "127"),
NV(6066, "割引・料金", "つぎの説明を読んで，各問いに答えなさい。\n\n表はある高速バスチケットの一般料金を示したもので，学生料金は一般料金の20%引きになる。さらに，早期購入割引でチケットを購入する場合は，一般料金や学生料金の5%引きになる。\n\n  -----------------------------------------------------------------------\n  区間  一般料金\n  ------------------------------ ----------------------------------------\n  X  5000円\n\n  Y  8000円\n\n  Z  \n  -----------------------------------------------------------------------\n\n区間Xのチケットを早期購入割引で10人分購入したところ，合計金額は43700円だった。このとき，10人のうち学生は何人か。", ["1人", "2人", "3人", "4人", "5人", "6人", "7人", "8人", "9人", "AからIのいずれでもない"], "single", 3, "区間X（一般5000円）の各早期割引料金を求めます：\n\n- 一般（早期割引）：5000円 × 0.95 ＝ 4750円\n\n- 学生（早期割引）：5000円 × 0.80 × 0.95 ＝ 3800円\n\n学生の人数を (s)\n人とするとつるかめ算（一次方程式）が成立します：\n\n3800s ＋ 4750(10 － s) ＝ 43700\n\n47500 － 950s ＝ 43700 implies 950s ＝ 3800 implies s ＝\nmathbf{4人}。", 5, "NV_SET_6066", 1, 2, [null, null, null, null, null, null, null, null, "割引の重複計算ミス等による誤りです。\n\n【外部情報使用：なし】\n\n---", null], "129"),
NV(6067, "割引・料金", "つぎの説明を読んで，各問いに答えなさい。\n\n表はある高速バスチケットの一般料金を示したもので，学生料金は一般料金の20%引きになる。さらに，早期購入割引でチケットを購入する場合は，一般料金や学生料金の5%引きになる。\n\n（※問題70と同表）\n\n  -----------------------------------------------------------------------\n  区間  一般料金\n  ------------------------------ ----------------------------------------\n  X  5000円\n\n  Y  8000円\n\n  Z  \n  -----------------------------------------------------------------------\n\n学生7人が区間Zのチケットを早期購入割引で購入したがキャンセルし，区間Yのチケットを当日に購入し直したところ，支払い額が11060円安くなった。このとき，表中の空欄［　］はい巡らか。ただし，キャンセル料はかからなかったものとする。", ["8400円", "9000円", "9600円", "10000円", "10500円", "11000円", "11200円", "12000円", "12500円", "AからIのいずれでもない"], "single", 4, "!テキスト, 手紙 AI\nによって生成されたコンテンツは間違っている可能性があります。](media/image15.png){width=\"5.905555555555556in\"\nheight=\"2.015972222222222in\"}", 5, "NV_SET_6066", 2, 2, [null, null, null, null, null, null, null, null, "当日割引の有無の取り違えによる計算誤りです。\n\n【外部情報使用：なし】\n\n---", null], "131"),
NV(6068, "推論（曜日）", "つぎの説明を読んで，各問いに答えなさい。\n\nP，Q，R，Sの4人は，それぞれ毎週1回決まった曜日に運動することにしている。4人の運動する日について，つぎのことがわかっている。\n\nI）Pが運動した4日後にRが運動する\n\nII）Sは水曜日に運動する\n\nIII）4人は別の曜日に運動する\n\n仮にQはPが運動した翌日に運動したとする。このとき，Pが運動する日として考えられるのは何曜日か。あてはまるものをすべて選びなさい。", ["日曜日", "月曜日", "火曜日", "水曜日", "木曜日", "金曜日", "土曜日"], "multi", [0, 1, 4, 5], "各人の曜日の関係：Q ＝ P ＋ 1日、R ＝ P ＋ 4日、S ＝\n水曜日。\n\nPの曜日をそれぞれ仮定し、重複がないか検証します：\n\n- P ＝ 日曜日 のとき：Q ＝ 月曜日, R ＝ 木曜日, S ＝\n水曜日（重複なし・可能）。\n\n- P ＝ 月曜日 のとき：Q ＝ 火曜日, R ＝ 金曜日, S ＝\n水曜日（重複なし・可能）。\n\n- P ＝ 火曜日 のとき：Q ＝ 水曜日 となり\nS（水曜日）と衝突（不可）。\n\n- P ＝ 水曜日 のとき：S（水曜日）と衝突（不可）。\n\n- P ＝ 木曜日 のとき：Q ＝ 金曜日, R ＝ 月曜日, S ＝\n水曜日（重複なし・可能）。\n\n- P ＝ 金曜日 のとき：Q ＝ 土曜日, R ＝ 火曜日, S ＝\n水曜日（重複なし・可能）。\n\n- P ＝ 土曜日 のとき：Q ＝ 日曜日, R ＝ 水曜日 となり\nS（水曜日）と衝突（不可）。\n\nしたがって、Pの曜日として考えられるのは 日曜日, 月曜日, 木曜日,\n金曜日 です。", 5, "NV_SET_6068", 1, 2, null, "133"),
NV(6069, "推論（曜日）", "つぎの説明を読んで，各問いに答えなさい。\n\nP，Q，R，Sの4人は，それぞれ毎週1回決まった曜日に運動することにしている。4人の運動する日について，つぎのことがわかっている。\n\nI）Pが運動した4日後にRが運動する\n\nII）Sは水曜日に運動する\n\nIII）4人は別の曜日に運動する\n\n仮にQはRが運動した2日後に運動したとする。このとき，Rが運動する日として考えられるのは何曜日か。あてはまるものをすべて選びなさい。", ["日曜日", "月曜日", "火曜日", "水曜日", "木曜日", "金曜日", "土曜日"], "multi", [2, 4, 5, 6], "各人の曜日の関係：Q ＝ R ＋ 2日、P ＝ R － 4日（＝ R ＋\n3日）、S ＝ 水曜日。\n\nRの曜日を検証します：\n\n- R ＝ 日曜日：P ＝ 水曜日 となり Sと衝突（不可）。\n\n- R ＝ 月曜日：Q ＝ 水曜日 となり Sと衝突（不可）。\n\n- R ＝ 火曜日：Q ＝ 木曜日, P ＝ 金曜日, S ＝\n水曜日（可能）。\n\n- R ＝ 水曜日：Sと衝突（不可）。\n\n- R ＝ 木曜日：Q ＝ 土曜日, P ＝ 日曜日, S ＝\n水曜日（可能）。\n\n- R ＝ 金曜日：Q ＝ 日曜日, P ＝ 月曜日, S ＝\n水曜日（可能）。\n\n- R ＝ 土曜日：Q ＝ 月曜日, P ＝ 火曜日, S ＝\n水曜日（可能）。\n\nしたがって、Rの曜日として考えられるのは 火曜日, 木曜日, 金曜日,\n土曜日 です。", 5, "NV_SET_6068", 2, 2, null, "135"),
NV(6070, "推論（曜日）", "つぎの説明を読んで，各問いに答えなさい。\n\n月曜日から土曜日までの6日間のイベントで，A，B，C，D，E，Fの6人が1日ずつゲストとして出演することになった。だれがどの日に出演するかについて，つぎのことがわかっている。\n\nI）AはBのつぎの日に出演する\n\nII）CはDのつぎの日に出演する\n\nIII）水曜日に出演するゲストはEでもFでもない\n\nEが土曜日に出演する場合，Fが出演する日として考えられるのはいつか。あてはまるものをすべて選びなさい。", ["月曜日", "火曜日", "水曜日", "木曜日", "金曜日", "土曜日"], "multi", [0, 4], "月〜土を 1〜6（1:月, 2:火, 3:水, 4:木, 5:金, 6:土）で表します。\n\n1. 「土曜日＝E（6）」が確定。\n\n2. 連番ペア「(B,A)」と「(D,C)」がそれぞれ連続2日間を占めます。\n\n3. 水曜日（3）は E, F 不可のため、(B,A) または (D,C)\nのいずれかが水曜日をまたぐ形（2-3 または 3-4）で入ります。\n\n4. 残る1日（Fの場所）を検証：\n\n- パターン1：1-2に(B,A)、3-4に(D,C) を配置すると、余る\n5（金曜日）がF になります（水曜日はAで条件合致）。\n\n- パターン2：2-3に(B,A)、4-5に(D,C) を配置すると、余る\n1（月曜日）がF になります（水曜日はAで条件合致）。\n\nしたがって、Fが出演できる日は 月曜日, 金曜日 です。", 5, "NV_SET_6070", 1, 2, null, "137"),
NV(6071, "推論（曜日）", "つぎの説明を読んで，各問いに答えなさい。\n\n月曜日から土曜日までの6日間のイベントで，A，B，C，D，E，Fの6人が1日ずつゲストとして出演することになった。だれがどの日に出演するかについて，つぎのことがわかっている。\n\nI）AはBのつぎの日に出演する\n\nII）CはDのつぎの日に出演する\n\nIII）水曜日に出演するゲストはEでもFでもない\n\n土曜日に出演するゲストがEでもFでもない場合，火曜日に出演するゲストとして考えられるのはだれか。あてはまるものをすべて選びなさい。", ["B", "D", "F"], "single", 1, "水曜日（3）および土曜日（6）に E, F が入れない条件です。\n\n火曜日（2）に各人物が入れるか検証します：\n\n- 火曜日 ＝ B の場合：月:E, 火:B, 水:A, 木:F, 金:D, 土:C\nで全条件クリア（可能）。\n\n- 火曜日 ＝ D の場合：月:E, 火:D, 水:C, 木:F, 金:B, 土:A\nで全条件クリア（可能）。\n\n- 火曜日 ＝ E の場合：月:F, 火:E, 水:B, 木:A, 金:D, 土:C\nで全条件クリア（可能）。\n\n- 火曜日 ＝ F の場合：月:E, 火:F, 水:B, 木:A, 金:D, 土:C\nで全条件クリア（可能）。\n\n- 火曜日 ＝ A または\nC：A（またはC）が火曜日に入ると、直前の月曜日にB（またはD）が入ります。すると残りの連続2枠を配置した際、土曜日または水曜日に\nE や F が配置されてしまい不整合となります。\n\nしたがって、火曜日のゲストとして考えられるのは B, D, E, F です。", 4, "NV_SET_6070", 2, 2, [null, null, "連番配置上の制約により火曜日に入ることができません。\n\n【外部情報使用：なし】\n\n---"], "139"),
NV(6072, "その他", "つぎに示した表や資料を使って，各問いに答えなさい。\n\n表は，6種類のミネラルウォーターについて，100ml中に含まれる4つのミネラルの重量を示したものである。\n\n  ----------------------------------------------------------------------------\n  成分  P  Q  R  S  T  U\n  ---------------- --------- --------- --------- --------- --------- ---------\n  ナトリウム  3.0mg  0.8mg  0.1mg  1.2mg  0.7mg  12.0mg\n\n  カルシウム  0.7mg  9.4mg  54.0mg  15.0mg  4.8mg  35.0mg\n\n  マグネシウム  0.4mg  2.0mg  7.0mg  0.7mg  3.0mg  10.0mg\n\n  カリウム  0.1mg  0.5mg  0.2mg  0.1mg  0.1mg  1.5mg\n  ----------------------------------------------------------------------------\n\nあるボトルにミネラルウォーターTが入っている。このボトルに含まれるナトリウムの量が10.5mgだったとき，カルシウムの量は何mgか(必要なときは，最後に小数点以下第2位を四捨五入すること)。", ["0.3mg", "1.5mg", "2.5mg", "30.6mg", "45.0mg", "72.0mg", "84.0mg", "123.4mg", "131.3mg"], "single", 5, "ミネラルウォーターT（100mlあたり）：ナトリウム 0.7mg、カルシウム 4.8mg。\n\n1. ボトルに含まれる水量の計算：\n\n10.5mg ÷ 0.7mg/100ml ＝ 15（1500ml）\n\n2. カルシウムの重量計算：\n\n15 × 4.8mg ＝ 72.0mg と算出されます。", 7, "NV_SET_6072", 1, 3, [null, null, null, null, null, null, null, null, "計算誤りです。\n\n【外部情報使用：なし】\n\n---"], "141"),
NV(6073, "その他", "つぎに示した表や資料を使って，各問いに答えなさい。\n\n表は，6種類のミネラルウォーターについて，100ml中に含まれる4つのミネラルの重量を示したものである。\n\n（※問題76と同表）\n\n  ----------------------------------------------------------------------------\n  成分  P  Q  R  S  T  U\n  ---------------- --------- --------- --------- --------- --------- ---------\n  ナトリウム  3.0mg  0.8mg  0.1mg  1.2mg  0.7mg  12.0mg\n\n  カルシウム  0.7mg  9.4mg  54.0mg  15.0mg  4.8mg  35.0mg\n\n  マグネシウム  0.4mg  2.0mg  7.0mg  0.7mg  3.0mg  10.0mg\n\n  カリウム  0.1mg  0.5mg  0.2mg  0.1mg  0.1mg  1.5mg\n  ----------------------------------------------------------------------------\n\nあるボトルにPからUまでのいずれかの種類のミネラルウォーターが入っている。このボトルに含まれるマグネシウムの量が42.0mg，カリウムの量が6.3mgだったとき，ミネラルウォーターの種類は何で，量は何mlか(必要なときは，最後に小数点以下第1位を四捨五入すること)。", ["Rで420ml", "Rで600ml", "Rで630ml", "Sで420ml", "Sで600ml", "Sで630ml", "Uで420ml", "Uで600ml", "Uで630ml"], "single", 6, "1. マグネシウムとカリウムの比率を照合します：\n\nマグネシウム : カリウム ＝ 42.0 : 6.3 ＝ 20 : 3\n\n2. 各銘柄の100mlあたりの比（マグネシウム : カリウム）：\n\n- U：10.0mg : 1.5mg ＝ 20 : 3 （一致！）\n\n3. Uの量（水分の体積）：\n\n42.0mg ÷ 10.0mg/100ml ＝ 4.2 ＝ 420ml と求まります。", 7, "NV_SET_6072", 2, 3, [null, null, null, null, null, null, null, null, "他銘柄（RやS）との取り違えや計算間違いによる不適切選択肢です。\n\n【外部情報使用：なし】\n\n---"], "143"),
NV(6074, "割合", "つぎに示した表や資料を使って，各問いに答えなさい。\n\n表は，6種類のミネラルウォーターについて，100ml中に含まれる4つのミネラルの重量を示したものである。\n\n（※問題76と同表）\n\n  ----------------------------------------------------------------------------\n  成分  P  Q  R  S  T  U\n  ---------------- --------- --------- --------- --------- --------- ---------\n  ナトリウム  3.0mg  0.8mg  0.1mg  1.2mg  0.7mg  12.0mg\n\n  カルシウム  0.7mg  9.4mg  54.0mg  15.0mg  4.8mg  35.0mg\n\n  マグネシウム  0.4mg  2.0mg  7.0mg  0.7mg  3.0mg  10.0mg\n\n  カリウム  0.1mg  0.5mg  0.2mg  0.1mg  0.1mg  1.5mg\n  ----------------------------------------------------------------------------\n\n6種類のミネラルウォーターのうち，4つのミネラルに占めるカリウムの割合が最も多いものについて，その割合は何%か(必要なときは，最後に小数点以下第1位を四捨五入すること)。", ["1%", "2%", "3%", "4%", "5%", "6%", "7%", "8%", "9%"], "single", 3, "各銘柄の4成分合計重量に対するカリウムの割合を試算します：\n\n- P：0.1 / (3.0＋0.7＋0.4＋0.1) ＝ 0.1 / 4.2 ≒ 2.38%\n\n- Q：0.5 / (0.8＋9.4＋2.0＋0.5) ＝ 0.5 / 12.7 ≒ 3.937%\n\n- R：0.2 / 61.3 ≒ 0.32%\n\n- S：0.1 / 17.0 ≒ 0.58%\n\n- T：0.1 / 8.6 ≒ 1.16%\n\n- U：1.5 / 58.5 ≒ 2.56%\n\n最も割合が多いのは Q（約3.937%）\nであり、小数点以下第1位を四捨五入すると 4% となります。", 7, "NV_SET_6072", 3, 3, [null, null, null, null, null, null, null, null, "他銘柄の計算値や四捨五入の誤りです。\n\n【外部情報使用：なし】\n\n---"], "145"),
NV(6075, "割合", "つぎに示した表や資料を使って，各問いに答えなさい。\n\n表は，ある地域における酒の総消費金額の推移とその構成比である。\n\n  -------------------------------------------------------------------------\n  項目  1995年  2000年  2005年\n  ------------------------- --------------- --------------- ---------------\n  総消費金額  685億円  ( )  555億円\n\n  ビール・発泡酒  57%  55%  54%\n\n  清酒  18%  16%  14%\n\n  焼酎  6%  9%  13%\n\n  その他  19%  20%  19%\n\n  合計  100%  100%  100%\n  -------------------------------------------------------------------------\n\n1995年のビール・発泡酒の消費金額は何億円か(必要なときは，最後に千万円の位を四捨五入すること)。", ["123億円", "150億円", "178億円", "233億円", "265億円", "316億円", "343億円", "377億円", "390億円", "AからIのいずれでもない"], "single", 8, "1995年の総消費金額は 685億円、ビール・発泡酒の構成比は 57% です。\n\n685億円 × 0.57 ＝ 390.45億円\n\n千万円の位（小数点以下第1位）を四捨五入すると 390億円\nとなります。", 6, "NV_SET_6075", 1, 4, [null, null, null, null, null, null, null, "他項目（清酒の123億円など）との誤認や四捨五入ミスです。\n\n【外部情報使用：なし】\n\n---", null, null], "147"),
NV(6076, "割合", "つぎに示した表や資料を使って，各問いに答えなさい。\n\n表は，ある地域における酒の総消費金額の推移とその構成比である。\n\n（※問題79と同表）\n\n  -------------------------------------------------------------------------\n  項目  1995年  2000年  2005年\n  ------------------------- --------------- --------------- ---------------\n  総消費金額  685億円  ( )  555億円\n\n  ビール・発泡酒  57%  55%  54%\n\n  清酒  18%  16%  14%\n\n  焼酎  6%  9%  13%\n\n  その他  19%  20%  19%\n\n  合計  100%  100%  100%\n  -------------------------------------------------------------------------\n\n2005年の総消費金額は1995年に対して何%減少しているか(必要なときは，最後に小数点以下第1位を四捨五入すること)。", ["18%", "19%", "20%", "21%", "22%", "23%", "24%", "25%", "26%", "AからIのいずれでもない"], "single", 1, "1. 減少額：685億円 － 555億円 ＝ 130億円\n\n2. 減少率：(130 ÷ 685) × 100 ≒ 18.977...%\n\n3. 小数点以下第1位を四捨五入して 19% となります。", 6, "NV_SET_6075", 2, 4, ["切り捨てミスです。\n\nC〜", null, null, null, null, null, null, null, null, "基準値の誤り（555億円で割ってしまい 23.4%\nになるなど）による計算ミスです。\n\n【外部情報使用：なし】\n\n---"], "149"),
NV(6077, "割合", "つぎに示した表や資料を使って，各問いに答えなさい。\n\n表は，ある地域における酒の総消費金額の推移とその構成比である。\n\n（※問題79と同表）\n\n  -------------------------------------------------------------------------\n  項目  1995年  2000年  2005年\n  ------------------------- --------------- --------------- ---------------\n  総消費金額  685億円  ( )  555億円\n\n  ビール・発泡酒  57%  55%  54%\n\n  清酒  18%  16%  14%\n\n  焼酎  6%  9%  13%\n\n  その他  19%  20%  19%\n\n  合計  100%  100%  100%\n  -------------------------------------------------------------------------\n\n2000年の清酒の消費金額は101億円である。2000年の総消費金額は何億円か(必要なときは，最後に千万円の位を四捨五入すること)。", ["184億円", "505億円", "561億円", "620億円", "631億円", "721億円", "873億円", "954億円", "1010億円", "AからIのいずれでもない"], "single", 4, "2000年の清酒の構成比は 16% です。\n\n総消費金額 ＝ 101億円 ÷ 0.16 ＝ 631.25億円\n\n千万円の位を四捨五入すると 631億円 となります。", 6, "NV_SET_6075", 3, 4, [null, null, null, null, null, null, null, null, null, "計算誤りです。\n\n【外部情報使用：なし】\n\n---"], "151"),
NV(6078, "割合", "つぎに示した表や資料を使って，各問いに答えなさい。\n\n表は，ある地域における酒の総消費金額の推移とその構成比である。\n\n（※問題79と同表）\n\n  -------------------------------------------------------------------------\n  項目  1995年  2000年  2005年\n  ------------------------- --------------- --------------- ---------------\n  総消費金額  685億円  ( )  555億円\n\n  ビール・発泡酒  57%  55%  54%\n\n  清酒  18%  16%  14%\n\n  焼酎  6%  9%  13%\n\n  その他  19%  20%  19%\n\n  合計  100%  100%  100%\n  -------------------------------------------------------------------------\n\n焼酎の消費金額は1995年から2005年にかけて何%増加したか(必要なときは，最後に小数点以下第1位を四捨五入すること)。", ["7%", "17%", "19%", "27%", "31%", "43%", "52%", "67%", "76%", "80%"], "single", 8, "1. 1995年の焼酎消費金額：685億円 × 0.06 ＝ 41.1億円\n\n2. 2005年の焼酎消費金額：555億円 × 0.13 ＝ 72.15億円\n\n3. 増加額：72.15億円 － 41.1億円 ＝ 31.05億円\n\n4. 増加率：(31.05 ÷ 41.1) × 100 ≒ 75.547...%\n\n5. 小数点以下第1位を四捨五入すると 76% となります。", 6, "NV_SET_6075", 4, 4, ["構成比の差（13% - 6% = 7%）をそのまま答えた誤りです。\n\nB〜H,", null, null, null, null, null, null, null, null, "分母の設定ミスによる誤りです。\n\n【外部情報使用：なし】\n\n---"], "153"),
NV(6079, "その他", "つぎの説明を読んで，各問いに答えなさい。\n\n1から9までの数字が1つずつ書かれた9枚のカードがある。この中から同時に3枚を引いたところ，数字の合計は21だった。これについて，つぎのような3通りの報告がなされた。\n\nP：3枚とも奇数だった\n\nQ：3枚の中に5のカードがあった\n\nR：3枚の中に7のカードがあった\n\n以上の報告は，必ずしもすべてが信頼できるとはいえない。そこで，種々の場合を想定して推論がなされた。\n\nつぎの推論ア，イ，ウのうち，正しいものはどれか。AからHまでの中から1つ選びなさい。\n\nア Pが正しければQも必ず正しい\n\nイ Qが正しければRも必ず正しい\n\nウ Rが正しければPも必ず正しい", ["アだけ", "イだけ", "ウだけ", "アとイの両方", "アとウの両方", "イとウの両方", "アとイとウのすべて", "正しい推論はない"], "single", 3, "1〜9の中から相異なる3数の和が21になる組み合わせは以下の3パターンのみです：\n\n- パターン1：(4, 8, 9)\n\n- パターン2：(5, 7, 9)\n\n- パターン3：(6, 7, 8)\n\n各報告が真となるパターン：\n\n- P（すべて奇数）：パターン2 のみ\n\n- Q（5を含む）：パターン2 のみ\n\n- R（7を含む）：パターン2，パターン3\n\n推論の判定：\n\n-\nア「Pが正しければQも必ず正しい」：Pが真ならパターン2で決定し、Qも真となるため\n正しい。\n\n-\nイ「Qが正しければRも必ず正しい」：Qが真ならパターン2で決定し、7を含むためRも真となり\n正しい。\n\n-\nウ「Rが正しければPも必ず正しい」：Rが真のときパターン3(6,7,8)の可能性があり、このときPは偽。したがって\n誤り。\n\n以上より、D（アとイの両方） が正解です。", 4, "NV_SET_6079", 1, 2, [null, null, null, null, null, null, null, "ア・イ・ウの判定ミスによる不適切選択肢です。\n\n【外部情報使用：なし】\n\n---"], "155"),
NV(6080, "その他", "つぎの説明を読んで，各問いに答えなさい。\n\n1から9までの数字が1つずつ書かれた9枚のカードがある。この中から同時に3枚を引いたところ，数字の合計は21だった。これについて，つぎのような3通りの報告がなされた。\n\nP：3枚とも奇数だった\n\nQ：3枚の中に5のカードがあった\n\nR：3枚の中に7のカードがあった\n\n以上の報告は，必ずしもすべてが信頼できるとはいえない。そこで，種々の場合を想定して推論がなされた。\n\nつぎの推論カ，キ，クのうち，正しいものはどれか。AからHまでの中から1つ選びなさい。\n\nカ Pが正しければRも必ず正しい\n\nキ Qが正しければPも必ず正しい\n\nク Rが正しければQも必ず正しい", ["カだけ", "キだけ", "クだけ", "カとキの両方", "カとクの両方", "キとクの両方", "カとキとクのすべて", "正しい推論はない"], "single", 3, "問題83の分析より：\n\n-\n推論カ「Pが正しければRも必ず正しい」：Pが真ならパターン2(5,7,9)に確定し、7を含むためRも真となり\n正しい。\n\n-\n推論キ「Qが正しければPも必ず正しい」：Qが真ならパターン2(5,7,9)に確定し、すべて奇数なのでPも真となり\n正しい。\n\n-\n推論ク「Rが正しければQも必ず正しい」：Rが真のときパターン3(6,7,8)の可能性があり、5を含まないためQは偽。したがって\n誤り。\n\n以上より、D（カとキの両方） が正解です。", 4, "NV_SET_6079", 2, 2, [null, null, null, null, null, null, null, "推論の判定誤りです。\n\n【外部情報使用：なし】\n\n---"], "157"),
NV(6081, "その他", "つぎの説明を読んで，各問いに答えなさい。\n\n100人を対象にピアノ，ギター，ドラムの3つの楽器の演奏経験について調査を行ったところ，つぎのことがわかった。\n\nピアノを演奏したことがある　48人\n\nギターを演奏したことがある　42人\n\nドラムを演奏したことがある　26人\n\nピアノとギターの両方を演奏したことがある人は16人いた。\n\nピアノまたはギターのうち少なくとも一方を演奏したことがある人は何人か。", ["26人", "32人", "48人", "52人", "58人", "60人", "66人", "74人", "90人", "AからIのいずれでもない"], "single", 7, "!](media/image16.png){width=\"5.905555555555556in\"\nheight=\"0.7138888888888889in\"}", 5, "NV_SET_6081", 1, 3, [null, null, null, null, null, null, null, null, "重複部分（16人）の引き忘れ（90人）や引き算ミスによる不適切選択肢です。\n\n【外部情報使用：なし】\n\n---", null], "159"),
NV(6082, "その他", "つぎの説明を読んで，各問いに答えなさい。\n\n100人を対象にピアノ，ギター，ドラムの3つの楽器の演奏経験について調査を行ったところ，つぎのことがわかった。\n\nピアノを演奏したことがある　48人\n\nギターを演奏したことがある　42人\n\nドラムを演奏したことがある　26人\n\nピアノとギターの両方を演奏したことがある人は16人いた。\n\nギターまたはドラムのうち少なくとも一方を演奏したことがある人は56人いた。\n\nギターとドラムの両方を演奏したことがある人は何人か。", ["6人", "8人", "12人", "14人", "18人", "26人", "30人", "34人", "44人", "AからIのいずれでもない"], "single", 2, "和集合の公式を適用します：\n\n!テキスト, 手紙 AI\nによって生成されたコンテンツは間違っている可能性があります。](media/image17.png){width=\"5.905555555555556in\"\nheight=\"0.9166666666666666in\"}", 5, "NV_SET_6081", 2, 3, [null, null, null, null, null, null, null, null, null, "公式の項の移行ミスや計算間違いです。\n\n【外部情報使用：なし】\n\n---"], "160"),
NV(6083, "その他", "つぎの説明を読んで，各問いに答えなさい。\n\n100人を対象にピアノ，ギター，ドラムの3つの楽器の演奏経験について調査を行ったところ，つぎのことがわかった。\n\nピアノを演奏したことがある　48人\n\nギターを演奏したことがある　42人\n\nドラムを演奏したことがある　26人\n\nピアノとギターの両方を演奏したことがある人は16人いた。\n\nピアノとドラムの両方を演奏したことがある人は14人いた。\n\nまた，ピアノだけを演奏したことがある人は22人いた。\n\n3つの楽器すべてを演奏したことがある人は何人か。", ["0人", "1人", "2人", "3人", "4人", "5人", "6人", "7人", "8人", "AからIのいずれでもない"], "single", 4, "ピアノの集合（48人）に注目し、ベン図の重なりを解析します：\n\n1. 「ピアノのみ」の人数：22人\n\n2. 「ピアノとギター」：16人、「ピアノとドラム」：14人\n\n3. 3つすべて演奏経験のある人数を x 人とすると：\n\n- ピアノとギターのみ ＝ 16 － x\n\n- ピアノとドラムのみ ＝ 14 － x\n\n4. ピアノ全体の合計人数方程式：\n\n22 ＋ (16 － x) ＋ (14 － x) ＋ x ＝ 48\n\n52 － x ＝ 48 implies x ＝ mathbf{4人} と求まります。", 5, "NV_SET_6081", 3, 3, [null, null, null, null, null, null, null, null, "ベン図の領域重複のカウントミスです。\n\n【外部情報使用：なし】\n\n---", null], "161"),
NV(6084, "割合", "つぎの説明を読んで，各問いに答えなさい。\n\n結婚披露パーティの案内状を新郎側は60人に，新婦側は50人に送付した。\n\n2週間後，新郎側は55.0%の人から，新婦側は66.0%の人から返信が来た。合計すると，案内状を送付した人のうち何%の人から返信が来たか(必要なときは，最後に小数点以下第2位を四捨五入すること)。", ["60.0%", "60.1%", "60.2%", "60.4%", "60.5%", "60.6%", "60.8%", "60.9%", "61.0%", "AからIのいずれでもない"], "single", 0, "1. 返信人数の計算：\n\n- 新郎側：60人 × 0.55 ＝ 33人\n\n- 新婦側：50人 × 0.66 ＝ 33人\n\n- 合計返信人数：33人 ＋ 33人 ＝ 66人\n\n2. 全体人数：60人 ＋ 50人 ＝ 110人\n\n3. 全体返信率：(66 ÷ 110) × 100 ＝ 60.0% と定まります。", 4, "NV_SET_6084", 1, 2, [null, null, null, null, null, null, null, null, "55.0% と 66.0% の単純な平均値（60.5% →\nE）を計算してしまう誤りなどです。\n\n【外部情報使用：なし】\n\n---", null], "163"),
NV(6085, "割合", "つぎの説明を読んで，各問いに答えなさい。\n\n結婚披露パーティの案内状を新郎側は60人に，新婦側は50人に送付した。\n\n最終的には新婦側は96.0%の人から，新郎側と合計すると90.0%の人から出席の返答を得た。新郎側は，案内状を送付した人のうち何%の人から出席の返答を得たか(必要なときは，最後に小数点以下第2位を四捨五入すること)。", ["82.8%", "83.0%", "83.5%", "83.8%", "84.0%", "84.5%", "84.8%", "85.0%", "85.5%", "AからIのいずれでもない"], "single", 7, "1. 全体（110人）の出席人数：110人 × 0.90 ＝ 99人\n\n2. 新婦側（50人）の出席人数：50人 × 0.96 ＝ 48人\n\n3. 新郎側の出席人数：99人 － 48人 ＝ 51人\n\n4. 新郎側の出席率：(51 ÷ 60) × 100 ＝ 85.0% となります。", 4, "NV_SET_6084", 2, 2, [null, null, null, null, null, null, null, null, "分母を全体（110人）にしてしまう（51/110 ≒\n46.4%）などの計算不整合です。\n\n【外部情報使用：なし】\n\n---", null], "164"),
NV(6086, "その他", "つぎの説明を読んで，各問いに答えなさい。\n\n10リットルの水が入った水槽がある。A，B，C，D，Eの5人は1人ずつ順不同でこの水槽に水を出し入れした。5人が出し入れした水の量について，つぎのことがわかっている。\n\nI）Aは2リットル，Cは3リットルの水を水槽から出した\n\nII）Bは2リットル，DとEはそれぞれ1リットルの水を水槽に入れた\n\n4番目の人が終わった時点で，水槽の水の量として考えられるのは何リットルか。あてはまるものをすべて選びなさい。", ["6リットル以下", "7リットル", "8リットル", "9リットル", "10リットル", "11リットル", "12リットル", "13リットル", "14リットル", "15リットル以上"], "multi", [1, 2, 5, 6], "各人の水量の変化：A: －2L, B: ＋2L, C: －3L, D: ＋1L, E: ＋1L。\n\n5人全員が終わった最終水量は 10 － 2 ＋ 2 － 3 ＋ 1 ＋ 1 ＝ 9L\nです。\n\n4番目の人が終わった時点の水量は、「最終水量（9L）から5番目の人の操作を取り消した量」となります：\n\n- 5番目が A(－2L) の場合：9 － (－2) ＝ 11L\n\n- 5番目が B(＋2L) の場合：9 － (＋2) ＝ 7L\n\n- 5番目が C(－3L) の場合：9 － (－3) ＝ 12L\n\n- 5番目が DまたはE(＋1L) の場合：9 － (＋1) ＝ 8L\n\nしたがって、考えられる水量は 7リットル, 8リットル, 11リットル,\n12リットル です。", 5, "NV_SET_6086", 1, 2, null, "166"),
NV(6087, "その他", "つぎの説明を読んで，各問いに答えなさい。\n\n10リットルの水が入った水槽がある。A，B，C，D，Eの5人は1人ずつ順不同でこの水槽に水を出し入れした。5人が出し入れした水の量について，つぎのことがわかっている。\n\nI）Aは2リットル，Cは3リットルの水を水槽から出した\n\nII）Bは2リットル，DとEはそれぞれ1リットルの水を水槽に入れた\n\n水槽に水を出し入れした順番は，Bが2番目で，CはDより後だった。\n\nこのとき，3番目の人が終わった時点で，水槽の水の量として考えられるのは何リットルか。あてはまるものをすべて選びなさい。", ["6リットル以下", "7リットル", "8リットル", "9リットル", "10リットル", "11リットル", "12リットル", "13リットル", "14リットル", "15リットル以上"], "multi", [4, 5, 8], "条件「2番目はB(＋2L)」「CはDより後」を満たす順番のパターンにおいて、3番目終了時点の水量を検証します：\n\n- パターン1（1番目:A, 2番目:B, 3番目:D）：10 － 2 ＋ 2 ＋ 1 ＝\n11L\n\n- パターン2（1番目:D, 2番目:B, 3番目:E）：10 ＋ 1 ＋ 2 ＋ 1 ＝\n14L\n\n- パターン3（1番目:D, 2番目:B, 3番目:C）：10 ＋ 1 ＋ 2 － 3 ＝\n10L\n\nしたがって、3番目終了時点の水量として考えられるのは 10リットル,\n11リットル, 14リットル です。", 5, "NV_SET_6086", 2, 2, null, "167"),
NV(6088, "その他", "つぎの説明を読んで，各問いに答えなさい。\n\nW，X，Y，Zの4人が将棋で1回ずつの総あたり戦を行った。いま，すべての対戦終了後の結果について，つぎのことがわかっている。ただし，引き分けはなかったものとする。\n\nI）Wは2勝1敗であった\n\nII）XはYに勝った\n\nIII）YはZに負けた\n\nIV）ZはWに勝った\n\nI）からIV）までの情報だけで，対戦結果がすべてわかるのは，4人のうちだれか。", ["Wだけ", "Xだけ", "WとXの両方", "WとYの両方", "WとZの両方", "XとYの両方", "XとZの両方", "AからGのいずれでもない"], "single", 3, "全6試合のうち判明している対戦結果を整理します：\n\n- 条件IV：Z ＞ W\n\n- 条件II：X ＞ Y\n\n- 条件III：Z ＞ Y\n\n- 条件IよりWは2勝1敗でZに負けているため、残り2試合（W vs X，W vs Y）は\nW ＞ X，W ＞ Y に確定します。\n\nこの時点で：\n\n- Wの全3試合の結果：vs Z（負け），vs X（勝ち），vs Y（勝ち） ⇒\nすべて確定。\n\n- Yの全3試合の結果：vs X（負け），vs Z（負け），vs W（負け） ⇒\nすべて確定（3敗）。\n\n- 一方、X vs Z\nの対戦結果のみ判明していないため、XとZの全対戦結果は一意に決まりません。\n\nしたがって、対戦結果がすべてわかるのは WとYの両方（D） です。", 4, "NV_SET_6088", 1, 2, [null, null, null, null, null, null, null, "全結果確定の対象者を誤っているため不適切です。\n\n【外部情報使用：なし】\n\n---"], "170"),
NV(6089, "その他", "つぎの説明を読んで，各問いに答えなさい。\n\nW，X，Y，Zの4人が将棋で1回ずつの総あたり戦を行った。いま，すべての対戦終了後の結果について，つぎのことがわかっている。ただし，引き分けはなかったものとする。\n\nI）Wは2勝1敗であった\n\nII）XはYに勝った\n\nIII）YはZに負けた\n\nIV）ZはWに勝った\n\nI）からIV）までの情報のほかに，つぎのア，イ，ウのうち少なくとも一つの情報が加われば，4人の対戦結果がすべてわかるか。AからHまでの中から1つ選びなさい。\n\nア YはWに負けた\n\nイ 3戦全敗の人がいた\n\nウ 3戦全勝の人はいなかった", ["アだけ", "イだけ", "ウだけ", "アとイの両方", "アとウの両方", "イとウの両方", "アとイとウのすべて", "ア，イ，ウのすべてが加わってもわからない"], "single", 2, "問題93時点で未確定なのは「X vs Z」の1試合のみです。\n\n- もし X ＞ Z ならば、勝ち数は W:2勝, X:2勝, Z:2勝, Y:0勝\nとなり、「3戦全勝の人はいない」状態になります。\n\n- もし Z ＞ X ならば、勝ち数は Z:3勝, W:2勝, X:1勝, Y:0勝\nとなり、Zが「3戦全勝」になります。\n\n各追記事項を検証します：\n\n- ア「YはWに負けた」：問題93時点で既に決定している情報であり、X\nvs Z の結果を絞り込めません。\n\n-\nイ「3戦全敗の人がいた」：どちらのケースでもYが3戦全敗であるため、X\nvs Z を絞り込めません。\n\n-\nウ「3戦全勝の人はいなかった」：Zが全勝するケースが排除され、X\n＞ Z に確定します。これにより4人全6試合の結果が完全に決定します。\n\nしたがって、C（ウだけ） が正解です。", 4, "NV_SET_6088", 2, 2, [null, null, null, null, null, null, null, "不要な情報ア・イの選択やウの決定力を見落とした不適切選択肢です。\n\n【外部情報使用：なし】\n\n---"], "171"),
NV(6090, "確率", "つぎの説明を読んで，各問いに答えなさい。\n\n甲と乙の2人が同時に1個ずつのサイコロをふって，出た目の大きいほうを勝ちとする。ただし，2人の出た目が等しいときは引き分けとする。\n\n甲が勝つ確率はいくらか。", ["1/36", "1/6", "1/4", "1/3", "5/12", "4/9", "17/36", "1/2", "2/3", "AからIのいずれでもない"], "single", 4, "1. サイコロ2個の全出目の数：6 × 6 ＝ 36通り。\n\n2. 甲と乙の目が等しい（引き分け）場合：(1,1), (2,2), ..., (6,6) の\n6通り。\n\n3. 勝敗が決まるのは 36 － 6 ＝ 30通り\nであり、対称性より甲が勝つ場合と乙が勝つ場合は等しく各 15通り\nです。\n\n4. 求める確率：15 / 36 ＝ 5/12 となります。", 5, "NV_SET_6090", 1, 3, [null, null, null, null, null, null, null, null, null, "引き分け（6通り）を除外し忘れて 18/36＝1/2 (H)\nと計算してしまうなどの過小・過大値です。\n\n【外部情報使用：なし】\n\n---"], "173"),
NV(6091, "確率", "つぎの説明を読んで，各問いに答えなさい。\n\n甲と乙の2人が同時に1個ずつのサイコロをふって，出た目の大きいほうを勝ちとする。ただし，2人の出た目が等しいときは引き分けとする。\n\n甲が4以上の目を出し乙に負ける確率はいくらか。", ["1/18", "1/12", "1/6", "1/4", "1/3", "5/12", "1/2", "5/6", "11/12", "AからIのいずれでもない"], "single", 1, "甲の出目が4以上（4, 5, 6）で、乙の出目の方が大きくなる組み合わせ（甲,\n乙）を列挙します：\n\n- 甲 ＝ 4 のとき：乙 ＝ 5, 6（2通り）\n\n- 甲 ＝ 5 のとき：乙 ＝ 6（1通り）\n\n- 甲 ＝ 6\nのとき：乙が6より大きい目を出すことはできない（0通り）\n\n適合する組み合わせの総数 ＝ 2 ＋ 1 ＋ 0 ＝ 3通り。\n\n求める確率 ＝ 3 / 36 ＝ 1/12 となります。", 5, "NV_SET_6090", 2, 3, [null, null, null, null, null, null, null, null, null, "条件漏れによる不適切な確率計算です。\n\n【外部情報使用：なし】\n\n---"], "174"),
NV(6092, "確率", "つぎの説明を読んで，各問いに答えなさい。\n\n甲と乙の2人が同時に1個ずつのサイコロをふって，出た目の大きいほうを勝ちとする。ただし，2人の出た目が等しいときは引き分けとする。\n\n目の差が3以上で甲が勝つ確率はいくらか。", ["1/36", "1/18", "1/12", "1/9", "1/6", "1/4", "1/3", "1/2", "2/3", "AからIのいずれでもない"], "single", 4, "甲の出目が乙の出目より3以上大きくなるペア（甲, 乙）を列挙します：\n\n- 甲 ＝ 4 のとき：乙 ＝ 1（1通り）\n\n- 甲 ＝ 5 のとき：乙 ＝ 1, 2（2通り）\n\n- 甲 ＝ 6 のとき：乙 ＝ 1, 2, 3（3通り）\n\n適合する組み合わせの総数 ＝ 1 ＋ 2 ＋ 3 ＝ 6通り。\n\n求める確率 ＝ 6 / 36 ＝ 1/6 となります。", 5, "NV_SET_6090", 3, 3, [null, null, null, null, null, null, null, null, null, "組み合わせの数え漏れ等の誤りです。\n\n【外部情報使用：なし】\n\n---"], "175"),
NV(6093, "損益算", "つぎの説明を読んで，各問いに答えなさい。\n\nある品物を定価の10%引きで売って，1個あたりの利益が原価の8%になるようにしたい。\n\n定価180円となるのは，原価がいからの品物の場合か(必要なときは，最後に小数点以下第1位を四捨五入すること)。", ["144円", "147円", "149円", "150円", "152円", "158円", "165円", "167円", "175円", "AからIのいずれでもない"], "single", 3, "原価を (C) 円とします。\n\n1. 売価（定価の1割引き）：180円 × 0.90 ＝ 162円。\n\n2. 売価は原価の 8%増し（1.08倍）なので：\n\n1.08C ＝ 162\n\nC ＝ 162 ÷ 1.08 ＝ 150円 と定まります。", 4, "NV_SET_6093", 1, 2, [null, null, null, null, null, null, null, null, null, "定価から18%引きしてしまうなどの計算ミスです。\n\n【外部情報使用：なし】\n\n---"], "176"),
NV(6094, "損益算", "つぎの説明を読んで，各問いに答えなさい。\n\nある品物を定価の10%引きで売って，1個あたりの利益が原価の8%になるようにしたい。\n\n定価1260円となるのは，原価がいからの品物の場合か(必要なときは，最後に小数点以下第1位を四捨五入すること)。", ["1008円", "1043円", "1050円", "1134円", "1145円", "1155円", "1167円", "1180円", "1224円", "AからIのいずれでもない"], "single", 2, "問題98の比例関係（原価 ＝ 定価 × 5/6）を用います：\n\n1. 売価 ＝ 1260円 × 0.90 ＝ 1134円。\n\n2. 原価 (C) ＝ 1134 ÷ 1.08 ＝ 1050円 と定まります。", 4, "NV_SET_6093", 2, 2, [null, null, null, null, null, null, null, null, null, "売価（1134円 → D）をそのまま選択するなどの誤りです。\n\n【外部情報使用：なし】\n\n---"], "177"),
NV(6095, "年齢算", "つぎの説明を読んで，各問いに答えなさい。\n\n春枝と夏夫の年齢を加えると秋子の年齢になる。夏夫は冬彦よりも年上である。\n\nつぎの推論ア，イ，ウのうち，必ず正しいといえるものはどれか。AからHまでの中から1つ選びなさい。\n\nア 秋子は冬彦よりも年上である\n\nイ 春枝は冬彦よりも年上である\n\nウ 夏夫は秋子よりも年上である", ["アだけ", "イだけ", "ウだけ", "アとイの両方", "アとウの両方", "イとウの両方", "アとイとウのすべて", "ア，イ，ウのいずれも必ず正しいとはいえない"], "single", 0, "各人の年齢（正の整数）の関係式：\n\n- 秋子 ＝ 春枝 ＋ 夏夫 （したがって 秋子 ＞ 夏夫，秋子 ＞\n春枝）\n\n- 夏夫 ＞ 冬彦\n\n各推論の真偽を検証します：\n\n- 推論ア「秋子は冬彦よりも年上である」：\n\n秋子 ＞ 夏夫 ＞ 冬彦 より、三段論法から常に 秋子 ＞ 冬彦\nが成り立ちます（必ず正しい）。\n\n- 推論イ「春枝は冬彦よりも年上である」：\n\n春枝と冬彦の年齢の大小関係は与えられた条件からは定まりません（例:\n春枝2歳、夏夫10歳、冬彦5歳\nのとき春枝＜冬彦となり不成立）。（必ずしも正しいとはいえない）\n\n- 推論ウ「夏夫は秋子よりも年上である」：\n\n秋子 ＝ 夏夫 ＋ 春枝（春枝＞0）より常に 秋子 ＞ 夏夫\nとなるため、夏夫が秋子より年上になることはあり得ません。（必ず誤り）\n\nしたがって、必ず正しいといえるのは アだけ（A） です。", 4, null, null, null, [null, null, null, null, null, null, null, "アの確定的な正しさやイ・ウの不適切さの判定誤りです。\n\n【外部情報使用：なし】\n\n---"], "178"),
NV(6096, "その他", "つぎに示した表や資料を使って，各問いに答えなさい。\n\nあるツアーでは，3日目と4日目にそれぞれP，Q，Rのいずれかのテーマパークに入園できる（入園しなくてもよい）。表は，このツアーの参加者150人が，どのテーマパークに入園したかをまとめたものである。たとえば，表中の網掛け部分は3日目にテーマパークPに行き，4日目はテーマパークに入園しなかった人が4人いたことを表している。\n\n＜表＞ 　　　　　　\n\n  ----------------------------------------------------------------------------\n  3日目 ＼  P  Q  R  入園せず  合計\n  4日目  \n  ----------------- ---------- ---------- ---------- -------------- ----------\n  P  12人  11人  10人  4人  37人\n\n  Q  16人  ( )  11人  4人  ( )\n\n  R  18人  18人  (ア)  7人  ( )\n\n  入園せず  4人  5人  3人  0人  12人\n\n  合計  50人  ( )  ( )  15人  150人\n  ----------------------------------------------------------------------------\n\n3日目と4日目で2つの異なるテーマパークに入園した人は何人か。", ["32人", "52人", "55人", "66人", "73人", "84人", "96人", "111人", "123人", "AからIのいずれでもない"], "single", 5, "3日目と4日目で「異なるテーマパーク」に入園した組み合わせの人数を合計します：\n\n- 3日目P → 4日目Q（11人）、4日目R（10人） ＝ 21人\n\n- 3日目Q → 4日目P（16人）、4日目R（11人） ＝ 27人\n\n- 3日目R → 4日目P（18人）、4日目Q（18人） ＝ 36人\n\n合計：21 ＋ 27 ＋ 36 ＝ 84人 と定まります。", 6, "NV_SET_6096", 1, 4, [null, null, null, null, null, null, null, null, "どちらか一方に入園しなかった人（12人）を含めてしまったり、同パーク入園者を含めるなどの計算ミスです。\n\n【外部情報使用：なし】\n\n---", null], "179"),
NV(6097, "割合", "つぎに示した表や資料を使って，各問いに答えなさい。\n\nあるツアーでは，3日目と4日目にそれぞれP，Q，Rのいずれかのテーマパークに入園できる（入園しなくてもよい）。表は，このツアーの参加者150人が，どのテーマパークに入園したかをまとめたものである。たとえば，表中の網掛け部分は3日目にテーマパークPに行き，4日目はテーマパークに入園しなかった人が4人いたことを表している。\n\n（※問題101と同表）\n\n  ----------------------------------------------------------------------------\n  3日目 ＼  P  Q  R  入園せず  合計\n  4日目  \n  ----------------- ---------- ---------- ---------- -------------- ----------\n  P  12人  11人  10人  4人  37人\n\n  Q  16人  ( )  11人  4人  ( )\n\n  R  18人  18人  (ア)  7人  ( )\n\n  入園せず  4人  5人  3人  0人  12人\n\n  合計  50人  ( )  ( )  15人  150人\n  ----------------------------------------------------------------------------\n\nどちらか1日しかテーマパークに入園しなかった人は，参加者全体の何%か(必要なときは，最後に小数点以下第1位を四捨五入すること)。", ["8%", "10%", "12%", "14%", "16%", "18%", "20%", "22%", "24%", "AからIのいずれでもない"], "single", 5, "1. 「3日目に入園し4日目は入園せず」（4 ＋ 4 ＋ 7 ＝ 15人）\n\n2. 「3日目は入園せず4日目に入園」（4 ＋ 5 ＋ 3 ＝ 12人）\n\n3. 合計人数：15 ＋ 12 ＝ 27人\n\n4. 全体150人に占める割合：(27 ÷ 150) × 100 ＝ 18.0%\nとなります。", 7, "NV_SET_6096", 2, 4, [null, null, null, null, null, null, null, null, null, "分子をどちらか片方のみ（15人や12人）で計算してしまった誤りです。\n\n【外部情報使用：なし】\n\n---"], "181"),
NV(6098, "割合", "つぎに示した表や資料を使って，各問いに答えなさい。\n\nあるツアーでは，3日目と4日目にそれぞれP，Q，Rのいずれかのテーマパークに入園できる（入園しなくてもよい）。表は，このツアーの参加者150人が，どのテーマパークに入園したかをまとめたものである。たとえば，表中の網掛け部分は3日目にテーマパークPに行き，4日目はテーマパークに入園しなかった人が4人いたことを表している。\n\n（※問題101と同表）\n\n  ----------------------------------------------------------------------------\n  3日目 ＼  P  Q  R  入園せず  合計\n  4日目  \n  ----------------- ---------- ---------- ---------- -------------- ----------\n  P  12人  11人  10人  4人  37人\n\n  Q  16人  ( )  11人  4人  ( )\n\n  R  18人  18人  (ア)  7人  ( )\n\n  入園せず  4人  5人  3人  0人  12人\n\n  合計  50人  ( )  ( )  15人  150人\n  ----------------------------------------------------------------------------\n\nテーマパークPに入園した人のうち，2日ともテーマパークPに入園した人は何%か(必要なときは，最後に小数点以下第1位を四捨五入すること)。", ["12%", "14%", "16%", "18%", "20%", "22%", "24%", "28%", "32%", "AからIのいずれでもない"], "single", 2, "1. 3日目または4日目の少なくとも1日にテーマパークPに入園した合計人数：\n\n- 3日目にPに入園：37人\n\n- 4日目にPに入園：50人\n\n- 両日ともPに入園（重複）：12人\n\n- 合計人数：37 ＋ 50 － 12 ＝ 75人\n\n2. このうち「2日ともPに入園した人」は 12人 です。\n\n3. 求める割合：(12 ÷ 75) × 100 ＝ 16.0% と定まります。", 7, "NV_SET_6096", 3, 4, [null, null, null, null, null, null, null, null, null, "分母を全体150人に設定して 12/150 = 8%\nと誤認するなどの不適切計算です。\n\n【外部情報使用：なし】\n\n---"], "183"),
NV(6099, "その他", "つぎに示した表や資料を使って，各問いに答えなさい。\n\nあるツアーでは，3日目と4日目にそれぞれP，Q，Rのいずれかのテーマパークに入園できる（入園しなくてもよい）。表は，このツアーの参加者150人が，どのテーマパークに入園したかをまとめたものである。たとえば，表中の網掛け部分は3日目にテーマパークPに行き，4日目はテーマパークに入園しなかった人が4人いたことを表している。\n\n（※問題101と同表）\n\n  ----------------------------------------------------------------------------\n  3日目 ＼  P  Q  R  入園せず  合計\n  4日目  \n  ----------------- ---------- ---------- ---------- -------------- ----------\n  P  12人  11人  10人  4人  37人\n\n  Q  16人  ( )  11人  4人  ( )\n\n  R  18人  18人  (ア)  7人  ( )\n\n  入園せず  4人  5人  3人  0人  12人\n\n  合計  50人  ( )  ( )  15人  150人\n  ----------------------------------------------------------------------------\n\n3日目にテーマパークRに入園した人数は，4日目にテーマパークRに入園した人数の1.5倍だった。表中の空欄（ア）は何人か。", ["7人", "8人", "9人", "10人", "11人", "12人", "13人", "14人", "15人", "AからIのいずれでもない"], "single", 7, "空欄（ア）を (x) とおいて関係式を立てます：\n\n- 3日目にテーマパークRに入園した総数：18 ＋ 18 ＋ x ＋ 7 ＝ 43 ＋\nx\n\n- 4日目にテーマパークRに入園した総数：10 ＋ 11 ＋ x ＋ 3 ＝ 24 ＋\nx\n\n条件より「3日目Rの人数 ＝ 1.5 × 4日目Rの人数」なので：\n\n43 ＋ x ＝ 1.5 × (24 ＋ x)\n\n43 ＋ x ＝ 36 ＋ 1.5x\n\n0.5x ＝ 7 implies x ＝ mathbf{14人} と算出されます。", 7, "NV_SET_6096", 4, 4, [null, null, null, null, null, null, null, null, "倍率の掛け算・方程式の展開ミスによる誤りです。\n\n【外部情報使用：なし】\n\n---", null], "185"),
NV(6100, "推論", "つぎの説明を読んで，各問いに答えなさい。\n\nP，Q，R，Sの4人が駅で午前10時に待ち合わせをした。このときの状況についてつぎのことがわかっている。\n\nI）同時に着いた人はいなかった\n\nII）待ち合わせ時刻に遅れて来た人が2人いた\n\nIII）Pはちょうど午前10時に来た\n\nIV）Qが来たときSはまだ来ていなかった\n\nつぎの推論ア，イについて，必ず正しいか，必ず誤りか，あるいはどちらともいえないかを考え，AからIまでの中から正しいものを1つ選びなさい。\n\nア Qは1番目に来た\n\nイ Pは2番目に来た", ["アもイも正しい", "アは正しいが，イはどちらともいえない", "アは正しいが，イは誤り", "アはどちらともいえないが，イは正しい", "アもイもどちらともいえない", "アはどちらともいえないが，イは誤り", "アは誤りだが，イは正しい", "アは誤りだが，イはどちらともいえない", "アもイも誤り"], "single", 3, "1. II）より、遅れて来た（10時より後に来た）人は2人。III）よりPはちょうど10時なので「遅れ」でも「早め」でもありません。\n\n2. 残るQ・R・Sのうち、Pより前（10時より前）に来た人が1人、Pより後（遅れ）の人が2人という内訳になります。\n\n3. IV）よりQはSより前に来ています。もしSが最も早く来た人だとするとQより前になり、IV）に反するため、Sが「Pより前」に来ることはありません。したがって「Pより前」の1人はQかRのどちらかです。\n\n4. 起こりうる順番は次の3通りです：\n　①Q→P→R→S　②Q→P→S→R　③R→P→Q→S\n（どの場合もIV「Q＜S」を満たしています）\n\n5. 推論アについて：①②ではQが1番目ですが、③ではRが1番目なので、Qが1番目とは限りません。→ア「どちらともいえない」\n\n6. 推論イについて：①②③のすべてでPは2番目です。→イ「必ず正しい」\n\nしたがって、D（アはどちらともいえないが，イは正しい） が正解です。", 6, "NV_SET_6100", 1, 2, [null, null, null, "上記3通りの検証により正解。", null, null, null, null, null], "187"),
NV(6101, "その他", "つぎの説明を読んで，各問いに答えなさい。\n\nP，Q，R，Sの4人が駅で午前10時に待ち合わせをした。このときの状況についてつぎのことがわかっている。\n\nI）同時に着いた人はいなかった\n\nII）待ち合わせ時刻に遅れて来た人が2人いた\n\nIII）Pはちょうど午前10時に来た\n\nIV）Qが来たときSはまだ来ていなかった\n\n最も少ない情報で4人が来た順番がすべてわかるためには，I）からIV）までの情報のほかに，つぎのカ，キ，クのうちどれが加わればよいか。AからHまでの中から正しいものを1つ選びなさい。\n\nカ Pが来たときRはまだ来ていなかった\n\nキ Qが来たときRはまだ来ていなかった\n\nク Sが来たときRはまだ来ていなかった", ["カだけ", "キだけ", "クだけ", "カとキの両方", "カとクの両方", "キとクの両方", "カとキとクのすべて", "カ，キ，クのすべてが加わってもわからない"], "single", 2, "1. I〜IVの条件だけでは、順番として次の3通りが考えられます：\n　①Q→P→R→S　②Q→P→S→R　③R→P→Q→S\n\n2. カ「Pが来たときRはまだ来ていない（P＜R）」は①②で成り立ち、③では成り立ちません（③はR＜P）。つまりカが加わっても①と②のどちらなのかは区別できません。\n\n3. キ「Qが来たときRはまだ来ていない（Q＜R）」も①②で成り立ち、③では成り立ちません。カと同じく①と②の区別には使えません。\n\n4. ク「Sが来たときRはまだ来ていない（S＜R）」を確認すると、①はR＜Sなので不成立、②はS＜Rなので成立、③はR＜Sなので不成立です。つまりクが成り立つのは②の場合だけなので、クが加わると①②③の中から②だけに1通りに絞り込めます。\n\n5. カ・キはどちらも①と②の区別に役立たず、単独で加えても順番は決まりません。\n\nしたがって、ク単独で順番が完全に確定するため、C（クだけ） が正解です。", 6, "NV_SET_6100", 2, 2, null, "189"),
NV(6102, "その他", "つぎの説明を読んで，各問いに答えなさい。\n\nV，W，X，Y，Zの5人が縦1列に並ぶ。\n\n前から3番目にVが並び，Wのすぐ後ろにはXが並ばない場合，並び方は何通りあるか。", ["4通り", "6通り", "10通り", "12通り", "16通り", "18通り", "20通り", "22通り", "24通り", "AからIのいずれでもない"], "single", 6, "1. Vが3番目に固定されているため、残り4位置（1, 2, 4,\n5番目）に4人を並べる全並び方は 4! ＝ 24通り です。\n\n2. このうち「Wの直後にXが並ぶ（W-X）」禁止パターンをカウントします：\n\n- 1, 2番目が (W, X) の場合：2通り（4, 5番目の配置）\n\n- 4, 5番目が (W, X) の場合：2通り（1, 2番目の配置）\n\n- ※3番目がVのため、2-3間や3-4間をまたぐW-X配置は不可能です。\n\n- 禁止パターンの合計：2 ＋ 2 ＝ 4通り。\n\n3. 条件を満たす並び方：24 － 4 ＝ 20通り となります。", 4, "NV_SET_6102", 1, 2, [null, null, null, null, null, null, null, null, null, "禁止パターンの重複・過剰差し引きによる誤りです。\n\n【外部情報使用：なし】\n\n---"], "191"),
NV(6103, "その他", "つぎの説明を読んで，各問いに答えなさい。\n\nV，W，X，Y，Zの5人が縦1列に並ぶ。\n\nYより前にXが並び，かつYより後ろにZが並ぶ場合，並び方は何通りあるか。", ["4通り", "6通り", "10通り", "12通り", "16通り", "18通り", "20通り", "22通り", "24通り", "AからIのいずれでもない"], "single", 6, "5人の順列総数は 5! ＝ 120通り です。\n\nこのうち X, Y, Z の3人の相対順序は 3! ＝ 6通り\n存在し、どれも同じ確率（対称性）で出現します。\n\n条件「X ＜ Y ＜\nZ（XがYより前、ZがYより後ろ）」を満たすのはこの6通りのうち\nちょうど1通り です。\n\nしたがって、適合する並び方は：\n\n120 ÷ 6 ＝ 20通り と求まります。", 4, "NV_SET_6102", 2, 2, [null, null, null, null, null, null, null, null, null, "相対順列の計算ミスによる誤りです。\n\n【外部情報使用：なし】\n\n---"], "193"),
NV(6104, "損益算", "つぎの説明を読んで，各問いに答えなさい。\n\nある店では，定価で売ると仕入れ値の2割の利益が上がるような価格設定をしている。\n\nこの店で商品Pの1個あたりの利益は240円である。商品Pの定価はいくらか。", ["960円", "1000円", "1120円", "1200円", "1280円", "1400円", "1440円", "1600円", "1680円", "AからIのいずれでもない"], "single", 6, "1. 利益 ＝ 仕入れ値 × 0.20 ＝ 240円 より：\n\n仕入れ値 ＝ 240 ÷ 0.20 ＝ 1200円\n\n2. 定価 ＝ 仕入れ値 ＋ 利益 ＝ 1200 ＋ 240 ＝ 1440円\nと定まります。", 4, "NV_SET_6103", 2, 2, [null, null, null, null, null, null, null, null, "仕入れ値（1200円 → D）をそのまま答えるなどの誤りです。\n\n【外部情報使用：なし】\n\n---", null], "195"),
NV(6105, "損益算", "つぎの説明を読んで，各問いに答えなさい。\n\nある店では，定価で売ると仕入れ値の2割の利益が上がるような価格設定をしている。\n\nある日，この店が商品Qを1個500円で80個仕入れた。夕方までに定価で50個を売ったが，売れ残りそうだったので定価の1割引きにしたところ，閉店までにすべて売れた。この日の商品Qによる利益の総額はいくらか。", ["3200円", "4000円", "4400円", "5000円", "5400円", "6000円", "6200円", "7200円", "8000円", "AからIのいずれでもない"], "single", 6, "1. 商品Qの仕入れ値: 500円、定価: 500 × 1.2 ＝\n600円（定価時の利益: 100円/個）。\n\n2. 定価の1割引きの売価: 600 × 0.9 ＝ 540円（値引き後の利益:\n40円/個）。\n\n3. 利益総額の計算：\n\n- 定価販売（50個）：50個 × 100円 ＝ 5000円\n\n- 値引き販売（30個）：30個 × 40円 ＝ 1200円\n\n- 合計利益：5000 ＋ 1200 ＝ 6200円 となります。", 4, "NV_SET_6105", 1, 2, [null, null, null, null, null, null, null, null, "値引き後の売価損失計算の錯綜による不適切値です。\n\n【外部情報使用：なし】\n\n---", null], "197"),
NV(6106, "その他", "つぎの説明を読んで，各問いに答えなさい。\n\n赤のボールペンが4本，黒と青のボールペンが3本ずつあり，P，Q，R，S，Tの5人で2本ずつ分けた。この5人がもらったボールペンの色について，つぎのことがわかっている。\n\nI）PとQがもらったボールペンの色の組み合わせは同じだった\n\nII）Rは赤のボールペンをもらわなかった\n\n仮に，Sは赤のボールペンを2本もらったとする。このとき，Tがもらったボールペンの色の組み合わせとして考えられるものはどれか。あてはまるものをすべて選びなさい。", ["赤2本", "黒2本", "青2本", "赤と黒1本ずつ", "赤と青1本ずつ", "黒と青1本ずつ"], "multi", [0, 1, 2, 5], "ボールペン総数：赤4、黒3、青3。Sが赤2本を使用。残り：赤2、黒3、青3。\n\nPとQは同じ組み合わせ（P＝Q）であり、Rは赤0本です。\n\n1. P＝Q＝(赤,黒) のとき：使用 赤2, 黒2。残り 赤0, 黒1,\n青3。Rが(青,青)をとると Tは(黒,青)。\n\n2. P＝Q＝(赤,青) のとき：使用 赤2, 青2。残り 赤0, 黒3,\n青1。Rが(黒,黒)をとると Tは(黒,青)。\n\n3. P＝Q＝(黒,青) のとき：使用 黒2, 青2。残り 赤2, 黒1,\n青1。Rが(黒,青)をとると Tは(赤2本)。\n\n4. P＝Q＝(黒,黒) のとき：不可能（黒は3本しかないため）。\n\n5. P＝Q＝(赤,赤) のとき：使用 赤2。残り 赤0, 黒3,\n青3。P=Qが(赤,赤)で赤4本全消費。残り黒3青3。Rが(黒,青)をとると、Tは(黒2本)\nまたは (青2本) が可能。\n\nしたがって、Tの組み合わせとして考えられるのは 赤2本, 黒2本, 青2本,\n黒と青1本ずつ です。", 5, "NV_SET_6105", 2, 2, null, "199"),
NV(6107, "その他", "つぎの説明を読んで，各問いに答えなさい。\n\n赤のボールペンが4本，黒と青のボールペンが3本ずつあり，P，Q，R，S，Tの5人で2本ずつ分けた。この5人がもらったボールペンの色について，つぎのことがわかっている。\n\nI）PとQがもらったボールペンの色の組み合わせは同じだった\n\nII）Rは赤のボールペンをもらわなかった\n\n仮に，2本とも同じ色のボールペンをもらった人は4人だったとする。このとき，Tがもらったボールペンの色の組み合わせとして考えられるものはどれか。あてはまるものをすべて選びなさい。", ["赤2本", "黒2本", "青2本", "赤と黒1本ずつ", "赤と青1本ずつ", "黒と青1本ずつ"], "multi", [1, 2, 5], "同色2本を持つ人が4人（単色ペア4組＋異色ペア1組）存在するケースを検証します：\n\n- 赤4本（(赤,赤)が2組）、黒2本((黒,黒)1組)、青2本((青,青)1組)\nの計4組が同色ペアとなる配置が成り立ちます。\n\n-\nこのとき、P＝Q＝(赤,赤)、R＝(黒,黒)または(黒,青)などと分けた際、異色ペアを持つ最後の1人がT（またはS）となります。\n\n- Tが同色ペアを持つ場合は 黒2本 または\n青2本、異色ペアを持つ場合は 黒と青1本ずつ となります。\n\nしたがって、Tとして考えられるのは 黒2本, 青2本, 黒と青1本ずつ\nです。", 4, null, null, null, null, "201"),
NV(6108, "集合", "つぎの説明を読んで，各問いに答えなさい。\n\nP，Q，R，S，Tの5人は，ある地域で行われた運動会の綱引き，玉入れ，大縄跳びのうち少なくとも1種目に参加した。5人が参加した種目について，つぎのことがわかっている。\n\nI）綱引きには3人，玉入れには4人，大縄跳びには2人が参加した\n\nII）2種目に参加したのは2人だった\n\nIII）Qが参加したのは大縄跳びだけだった\n\nIV）Rは綱引きには参加しなかった\n\nI）からIV）までの情報から判断して，つぎの推論ア，イ，ウのうち，必ずしも誤りとはいえないものはどれか。AからHまでの中から1つ選びなさい。\n\nア Pは2種目に参加した\n\nイ Rは2種目に参加した\n\nウ Tは2種目に参加した", ["アだけ", "イだけ", "ウだけ", "アとイの両方", "アとウの両方", "イとウの両方", "アとイとウのすべて", "ア，イ，ウのいずれも誤り"], "single", 4, "全参加延べ人数は 3 ＋ 4 ＋ 2 ＝ 9人分 です。\n\n条件IIより「2種目参加が2人（4人分）」、残り5人分を3人で分けるため「3種目参加が1人（3人分）」「1種目参加が2人（2人分）」に確定します。\n\nQは大縄跳び1種目のみ（条件III）、Rは綱引き不参加（条件IV）で玉入れ1種目のみとなります。\n\n成り立ち得るパターンを検証すると：\n\n-\nPが2種目、Tが2種目（Sが3種目）のケースが存在（ア・ウは可能）。\n\n- Rは常に1種目参加（玉入れのみ）に確定（イは必ず誤り）。\n\nしたがって、必ずしも誤りとはいえないのは アとウの両方（E）\nです。", 3, null, null, null, [null, null, "単独選択のため不十分です。\n\nB, D, F,", null, null, null, "必ず誤りである「イ」を含んでいるため不適切です。\n\n【外部情報使用：なし】\n\n---", null], "207"),
NV(6109, "集合", "つぎの説明を読んで，各問いに答えなさい。\n\nP，Q，R，S，Tの5人は，ある地域で行われた運動会の綱引き，玉入れ，大縄跳びのうち少なくとも1種目に参加した。5人が参加した種目について，つぎのことがわかっている。\n\nI）綱引きには3人，玉入れには4人，大縄跳びには2人が参加した\n\nII）2種目に参加したのは2人だった\n\nIII）Qが参加したのは大縄跳びだけだった\n\nIV）Rは綱引きには参加しなかった\n\n最も少ない情報で5人の参加した種目がすべてわかるためには，I）からIV）までの情報のほかに，つぎのカ，キ，クのうちどれが加わればよいか。AからHまでの中から1つ選びなさい。\n\nカ Pは大縄跳びには参加しなかった\n\nキ SはPよりも多くの種目に参加した\n\nク TはRよりも1種目多く参加した", ["カだけ", "キだけ", "クだけ", "カとキの両方", "カとクの両方", "キとクの両方", "カとキとクのすべて", "カ，キ，クのすべてが加わってもわからない"], "single", 1, "「キ（SはPより多くの種目に参加した）」が加わると、Sが唯一の「3種目参加者」に確定します。\n\nすると自ずと\nPとTが「2種目参加者（綱引き＋玉入れ）」に決定し、Q（大縄跳び）とR（玉入れ）の1種目参加者を含めて、5人全員の参加種目が一意に定まります。\n\n「カ」「ク」では複数の組み合わせパターンが残ってしまいます。\n\nしたがって、B（キだけ） が正解です。", 4, "NV_SET_6109", 1, 2, [null, null, null, null, null, null, null, "一意に特定できないため不適切です。\n\n【外部情報使用：なし】\n\n---"], "209"),
NV(6110, "推論", "つぎの説明を読んで，各問いに答えなさい。\n\nV，W，X，Y，Zの5社に工事の見積を依頼したところ，最高額の1100万円を提示したのはX社だけで，最も安かった会社の見積金額との差は300万円だった。各社の見積金額についてつぎのことがわかっている。\n\nI）V社とW社との差は200万円だった\n\nII）W社とZ社との差は100万円だった\n\nIII）Y社とZ社との差は100万円だった\n\nI）からIII）までの情報から判断して，つぎの推論ア，イについて，必ず正しいか，必ず誤りか，あるいはどちらともいえないかを考え，AからIまでの中から正しいものを1つ選びなさい。\n\nア W社の見積金額は800万円だった\n\nイ Z社の見積金額は900万円だった", ["アもイも正しい", "アは正しいが，イはどちらともいえない", "アは正しいが，イは誤り", "アはどちらともいえないが，イは正しい", "アもイもどちらともいえない", "アはどちらともいえないが，イは誤り", "アは誤りだが，イは正しい", "アは誤りだが，イはどちらともいえない", "アもイも誤り"], "single", 3, "最高額 X ＝ 1100万円、最安値 ＝ 800万円（差300万円）。\n\nW, Z, Y, V の見積金額（100万単位）の組み合わせを検証すると：\n\n- Zは常に 900万円 に確定します（推論イは必ず正しい）。\n\n- Wは 800万円 または 1000万円\nのどちらも成り立ちます（推論アはどちらともいえない）。\n\n以上より、D（アはどちらともいえないが，イは正しい） が正解です。", 4, "NV_SET_6109", 2, 2, [null, null, null, null, null, null, null, null, "推論ア・イの真偽判定誤りです。\n\n【外部情報使用：なし】\n\n---"], "211"),
NV(6111, "その他", "つぎの説明を読んで，各問いに答えなさい。\n\nV，W，X，Y，Zの5社に工事の見積を依頼したところ，最高額の1100万円を提示したのはX社だけで，最も安かった会社の見積金額との差は300万円だった。各社の見積金額についてつぎのことがわかっている。\n\nI）V社とW社との差は200万円だった\n\nII）W社とZ社との差は100万円だった\n\nIII）Y社とZ社との差は100万円だった\n\n最も少ない情報で4社の見積金額がすべてわかるためには，I）からIII）までの情報のほかに，つぎのカ，キ，クのうちどれが加わればよいか。AからHまでの中から1つ選びなさい。\n\nカ Y社の見積金額はV社より高かった\n\nキ Y社の見積金額はW社と同額だった\n\nク Y社の見積金額はZ社より高かった", ["カだけ", "キだけ", "クだけ", "カとキの両方", "カとクの両方", "キとクの両方", "カとキとクのすべて", "カ，キ，クのすべてが加わってもわからない"], "single", 0, "「カ（Y ＞ V）」が加わると、(V=800, W=1000, Y=1000, Z=900)\nという一通りの組み合わせに確定します。\n\n「キ」や「ク」を加えた場合は複数のパターンが残り一意に定まりません。\n\nしたがって、A（カだけ） が正解です。", 4, "NV_SET_6111", 1, 2, [null, null, null, null, null, null, null, "不特定パターンが残るため不適切です。\n\n【外部情報使用：なし】\n\n---"], "213"),
NV(6112, "その他", "つぎの説明を読んで，各問いに答えなさい。\n\nあるマンションに居住する120世帯を対象に，懸案事項について賛否を問うアンケートを実施した。表はその結果の一部を示したものである。\n\n  -----------------------------------------------------------------------\n  懸案事項  賛成\n  --------------------------------------- -------------------------------\n  積立金値上げ  63世帯\n\n  管理費値上げ  47世帯\n\n  駐輪代値上げ  72世帯\n  -----------------------------------------------------------------------\n\n積立金値上げに賛成したが管理費値上げに賛成しなかったのは45世帯だった。管理費値上げに賛成したが積立金値上げに賛成しなかったのは何世帯か。", ["8世帯", "18世帯", "19世帯", "28世帯", "29世帯", "35世帯", "39世帯", "45世帯", "47世帯", "AからIのいずれでもない"], "single", 4, "1. 積立金賛成（63世帯）のうち「管理費反対」が45世帯なので、両方賛成は：\n\n63 － 45 ＝ 18世帯\n\n2. 管理費賛成（47世帯）のうち「積立金反対（賛成しなかった）」世帯は：\n\n47 － 18 ＝ 29世帯 と求まります。", 5, "NV_SET_6111", 2, 2, [null, null, null, null, null, null, null, null, null, "引き算ミスによる過小・過大値です。\n\n【外部情報使用：なし】\n\n---"], "215"),
NV(6113, "その他", "つぎの説明を読んで，各問いに答えなさい。\n\nあるマンションに居住する120世帯を対象に，懸案事項について賛否を問うアンケートを実施した。表はその結果の一部を示したものである。\n\n（※問題119と同表）\n\n  -----------------------------------------------------------------------\n  懸案事項  賛成\n  --------------------------------------- -------------------------------\n  積立金値上げ  63世帯\n\n  管理費値上げ  47世帯\n\n  駐輪代値上げ  72世帯\n  -----------------------------------------------------------------------\n\n管理費値上げと駐輪代値上げの両方に賛成したのは26世帯だった。管理費値上げにも駐輪代値上げにも賛成しなかったのは何世帯か。", ["21世帯", "26世帯", "27世帯", "30世帯", "31世帯", "37世帯", "40世帯", "46世帯", "48世帯", "AからIのいずれでもない"], "single", 2, "1. 管理費または駐輪代の少なくとも一方に賛成した世帯数：\n\n47 ＋ 72 － 26 ＝ 93世帯\n\n2. どちらにも賛成しなかった世帯数：\n\n120 － 93 ＝ 27世帯 となります。", 6, "NV_SET_6113", 1, 3, [null, null, null, null, null, null, null, null, null, "和集合の計算漏れによる誤りです。\n\n【外部情報使用：なし】\n\n---"], "217"),
NV(6114, "その他", "つぎの説明を読んで，各問いに答えなさい。\n\nあるマンションに居住する120世帯を対象に，懸案事項について賛否を問うアンケートを実施した。表はその結果の一部を示したものである。\n\n（※問題119と同表）\n\n  -----------------------------------------------------------------------\n  懸案事項  賛成\n  --------------------------------------- -------------------------------\n  積立金値上げ  63世帯\n\n  管理費値上げ  47世帯\n\n  駐輪代値上げ  72世帯\n  -----------------------------------------------------------------------\n\n管理費値上げと駐輪代値上げの両方に賛成したのは26世帯だった。積立金値上げと駐輪代値上げの両方に賛成したのは43世帯で，そのうち8世帯は管理費値上げにも賛成していた。駐輪代値上げにだけ賛成したのは何世帯か。", ["1世帯", "3世帯", "6世帯", "9世帯", "11世帯", "14世帯", "17世帯", "19世帯", "21世帯", "AからIのいずれでもない"], "single", 4, "駐輪代賛成（72世帯）のベン図の領域を整理します：\n\n- 駐輪代・管理費・積立金の3つ賛成 ＝ 8世帯\n\n- 駐輪代・管理費の2つ賛成（積立金反対） ＝ 26 － 8 ＝ 18世帯\n\n- 駐輪代・積立金の2つ賛成（管理費反対） ＝ 43 － 8 ＝ 35世帯\n\n- 「駐輪代のみ」賛成 ＝ 72 － (8 ＋ 18 ＋ 35) ＝ 11世帯\nと定まります。", 6, "NV_SET_6113", 2, 3, [null, null, null, null, null, null, null, null, "重複引算のミスによる過小・過大値です。\n\n【外部情報使用：なし】\n\n---", null], "219"),
NV(6115, "その他", "つぎの説明を読んで，各問いに答えなさい。\n\n高校のスピーチ大会に，1年生からはP，Q，R，Sが出場することになった。学年に関係なく，くじを引いてスピーチの順番を決めたところ，つぎのようになった。\n\nI）Pの3人あとはQである\n\nII）Rの4人あとはSである\n\nIII）全出場者の中でPが最初に，Sが最後にスピーチをする\n\nこの大会の出場者は全部で何人だと考えられるか。あてはまるものをすべて選びなさい。", ["4人", "5人", "6人", "7人", "8人", "9人", "10人以上"], "multi", [3, 4, 5, 6], "!テキスト AI\nによって生成されたコンテンツは間違っている可能性があります。](media/image18.png){width=\"5.905555555555556in\"\nheight=\"2.691666666666667in\"}", 6, "NV_SET_6113", 3, 3, null, "221"),
NV(6116, "その他", "つぎの説明を読んで，各問いに答えなさい。\n\nある5地域で，穀類と果実のそれぞれについて，生産量の多い順に順位をつけた。ただし，生産量が等しい地域はなかった。この順位について，つぎのことがわかっている。\n\nI）穀類，果実とも4位の地域がある\n\nII）穀類が5位，果実が2位の地域がある\n\nIII）穀類の順位より果実の順位が低い地域は2つある\n\n穀類が3位である地域の果実の順位として，考えられるものをすべてあげているのはどれか。", ["1位だけ", "3位だけ", "5位だけ", "1位か3位", "1位か5位", "3位か5位", "1位か3位か5位", "AからGのいずれでもない"], "single", 4, "1. 既定地域：(穀類4位, 果実4位)、(穀類5位, 果実2位)。\n\n2. 残る3地域の穀類順位は {1位, 2位, 3位}、果実順位は {1位, 3位, 5位}\nです。\n\n3.\n条件III（果実の順位数値のほうが大きい地域が2つ）を満たす順位ペアの組み合わせを全列挙すると、穀類3位の地域の果実順位は\n1位 または 5位 のいずれかになります。\n\nしたがって、E（1位か5位） が正解です。", 4, "NV_SET_6116", 1, 2, [null, null, null, null, null, null, "3位が可能だと誤認するなどの選択肢誤りです。\n\n【外部情報使用：なし】\n\n---", null], "227"),
NV(6117, "その他", "つぎの説明を読んで，各問いに答えなさい。\n\nある5地域で，穀類と果実のそれぞれについて，生産量の多い順に順位をつけた。ただし，生産量が等しい地域はなかった。この順位について，つぎのことがわかっている。\n\nI）穀類，果実とも4位の地域がある\n\nII）穀類が5位，果実が2位の地域がある\n\nIII）穀類の順位より果実の順位が低い地域は2つある\n\n最も少ない情報で5地域の穀類と果実それぞれの生産量の多い順がすべてわかるためには，I）からIII）までの情報のほかに，つぎのア，イ，ウのうちどれが加わればよいか。AからHまでの中から1つ選びなさい。\n\nア 穀類が1位の地域は果実が3位である\n\nイ 穀類が2位の地域は果実が1位である\n\nウ 穀類が3位の地域は果実が5位である", ["アだけ", "イだけ", "ウだけ", "アとイの両方", "アとウの両方", "イとウの両方", "アとイとウのすべて", "ア，イ，ウのすべてが加わってもわからない"], "single", 1, "「イ（穀類2位の地域は果実1位）」が加わると、(穀類1位,果実3位)、(穀類2位,果実1位)、(穀類3位,果実5位)\nの一通りの順位配置に確定します。\n\n「ア」や「ウ」では依然として複数のパターンが残ります。\n\nしたがって、B（イだけ） が正解です。", 4, "NV_SET_6116", 2, 2, [null, null, null, null, null, null, null, "一意特定できないため不適切です。\n\n【外部情報使用：なし】\n\n---"], "229"),

NV(6123, "割合", "つぎに示した表や資料を使って，各問いに答えなさい。\n\n表1は，3つの地区におけるある番組の世帯視聴率を，3週にわたり調べたものである。また，各地区の総世帯数は表2のとおりである。つぎの式から，この番組を視聴していた世帯数が推定される。\n\n（※問題129と同表）\n\n  ------------------------------------------------------------------------\n  地区  第1週  第2週  第3週  3週平均\n  ------------------- ------------ ------------ ------------ -------------\n  第1地区  7.6%  11.2%  13.6%  10.8%\n\n  第2地区  15.6%  15.6%  20.7%  17.3%\n\n  第3地区  10.3%  18.2%  12.7%\n\n  \n\n  第1地区  1730万世帯  \n\n  第2地区  \n\n  第3地区  360万世帯  \n  ------------------------------------------------------------------------\n\n第1週の視聴世帯数について，第1地区は第3地区の何倍か(必要なときは，最後に小数点以下第3位を四捨五入すること)。", ["0.24倍", "0.28倍", "0.74倍", "1.36倍", "1.79倍", "2.01倍", "2.96倍", "3.55倍", "4.08倍", "5.22倍"], "single", 7, "1. 第1地区の第1週視聴世帯数：1730万 × 0.076 ＝ 131.48万世帯\n\n2. 第3地区の第1週視聴世帯数：360万 × 0.103 ＝ 37.08万世帯\n\n3. 倍率計算：\n\n131.48 ÷ 37.08 ≒ 3.5458...倍\n\n4. 小数点以下第3位を四捨五入すると 3.55倍 となります。", 6, "NV_SET_6120", 4, 4, [null, null, null, null, null, null, null, null, null, "総世帯数の比率を掛け忘れなどの誤りです。\n\n【外部情報使用：なし】\n\n---"], "241"),
NV(6124, "推論", "つぎの説明を読んで，各問いに答えなさい。\n\nP，Qの2人がゲームをした。それぞれが（1）（2）（3）（4）（5）の5枚のカードを持ち，同時に1枚ずつ出して数字の大きいほうを勝ちとし，同じ数字なら引き分けとする対戦を，カードがなくなるまで5回行った。2人の対戦について，つぎのことがわかっている。\n\nI）Pは4勝1敗だった\n\nII）Pは1回目に（5）を出した\n\nIII）Qは4回目に（1）を出した\n\nIV）3回目の対戦はQが勝った\n\nI）からIV）までの情報から判断して，つぎの推論ア，イについて，必ず正しいか，必ず誤りか，あるいはどちらともいえないかを考え，AからIまでの中から正しいものを1つ選びなさい。\n\nア Pは3回目に（3）を出した\n\nイ Qは3回目に（5）を出した", ["アもイも正しい", "アは正しいが，イはどちらともいえない", "アは正しいが，イは誤り", "アはどちらともいえないが，イは正しい", "アもイもどちらともいえない", "アはどちらともいえないが，イは誤り", "アは誤りだが，イは正しい", "アは誤りだが，イはどちらともいえない", "アもイも誤り"], "single", 6, "1. Pは4勝1敗で、Qが唯一勝ったのは「3回目」です。\n\n2.\n3回目でQが勝つには、Qが出した最強カード（5）に対しPはカード（1）を出すしかありません。\n\nしたがって、Qは3回目に（5）、Pは3回目に（1） を出しています。\n\n3. 推論の真偽：\n\n-\nア「Pは3回目に（3）を出した」：Pは3回目に（1）を出しているため\n必ず誤り。\n\n-\nイ「Qは3回目に（5）を出した」：Qは3回目に（5）を出しているため\n必ず正しい。\n\n以上より、G（アは誤りだが，イは正しい） が正解です。", 4, "NV_SET_6124", 1, 2, [null, null, null, null, null, null, null, null, "3回目の対戦カードの決定ロジックを見落とした誤りです。\n\n【外部情報使用：なし】\n\n---"], "243"),
NV(6125, "推論", "つぎの説明を読んで，各問いに答えなさい。\n\nP，Qの2人がゲームをした。それぞれが（1）（2）（3）（4）（5）の5枚のカードを持ち，同時に1枚ずつ出して数字の大きいほうを勝ちとし，同じ数字なら引き分けとする対戦を，カードがなくなるまで5回行った。2人の対戦について，つぎのことがわかっている。\n\nI）Pは4勝1敗だった\n\nII）Pは1回目に（5）を出した\n\nIII）Qは4回目に（1）を出した\n\nIV）3回目の対戦はQが勝った\n\nI）からIV）までの情報から判断して，つぎの推論カ，キについて，必ず正しいか，必ず誤りか，あるいはどちらともいえないかを考え，AからIまでの中から正しいものを1つ選びなさい。\n\nカ Pは4回目に（2）を出した\n\nキ Qは5回目に（2）を出した", ["カもキも正しい", "カは正しいが，キはどちらともいえない", "カは正しいが，キは誤り", "カはどちらともいえないが，キは正しい", "カもキもどちらともいえない", "カはどちらともいえないが，キは誤り", "カは誤りだが，キは正しい", "カは誤りだが，キはどちらともいえない", "カもキも誤り"], "single", 1, "1. Pが出したカードの確定：1回目(5)、3回目(1)。残り{2, 3, 4}。\n\n4回目にQは(1)を出し、Pは勝利する必要があります。Pが持つ残りのうち最小の(2)を4回目に出すことで、残りの回でPがすべてQに勝利可能です。したがって\nPは4回目に（2） を出します（推論カは必ず正しい）。\n\n2.\nキについて：Qが5回目に(2)を出すケースと(3)を出すケースの両方が成立します（推論キはどちらともいえない）。\n\n以上より、B（カは正しいが，キはどちらともいえない） が正解です。", 4, "NV_SET_6124", 2, 2, [null, null, null, null, null, null, null, null, "カード配列の組み合わせ絞り込みミスによる誤りです。\n\n【外部情報使用：なし】\n\n---"], "245"),

NV(6129, "その他", "つぎの説明を読んで，各問いに答えなさい。\n\nP，Q，R，S，Tの5人が1つずつプレゼントを用意し，抽選で交換をした。5人がもらったプレゼントについて，つぎのことがわかっている。\n\nI）自分の用意したプレゼントをもらった人はいなかった\n\nII）PがもらったのはQ，Rの用意したプレゼントではなかった\n\nIII）SがもらったのはP，Rの用意したプレゼントではなかった\n\n仮にRはQの用意したプレゼントをもらったとすると，Tのだれの用意したプレゼントをもらったと考えられるか。あてはまるものをすべて選びなさい。", ["P", "Q", "R", "S", "T"], "multi", [0, 2], "R＝Q（Qのプレゼント）のとき、適合するプレゼント受け取りパターンは以下の2通りです：\n\n- パターン1：P←S, Q←T, R←Q, S←P, T←R\n\n- パターン2：P←T, Q←S, R←Q, S←T, T←P\n\nしたがって、Tがもらったプレゼントとして考えられるのは P と\nR です。", 5, "NV_SET_6129", 1, 2, null, "253"),
NV(6130, "その他", "つぎの説明を読んで，各問いに答えなさい。\n\nP，Q，R，S，Tの5人が1つずつプレゼントを用意し，抽選で交換をした。5人がもらったプレゼントについて，つぎのことがわかっている。\n\nI）自分の用意したプレゼントをもらった人はいなかった\n\nII）PがもらったのはQ，Rの用意したプレゼントではなかった\n\nIII）SがもらったのはP，Rの用意したプレゼントではなかった\n\n仮にRがもらったのはP，Qの用意したプレゼントではなかったとすると，だれの用意したプレゼントをもらったか確実にわかる人は誰か。あてはまるものをすべて選びなさい。", ["P", "Q", "R", "S", "T", "確実にわかる人はいない"], "multi", [3], "仮定より R も P, Q 以外のプレゼント（S または T）を受け取ります。\n\n条件を満たす全パターンを網羅すると、どのような組み合わせであっても S\nは必ず Q のプレゼントをもらっている ことが判明します。\n\n他の人物（P, Q, R, T）の受け取ったプレゼントには複数の可能性が残ります。\n\nしたがって、確実にわかる人は S です。", 5, "NV_SET_6129", 2, 2, null, "255"),
NV(6131, "確率", "つぎの説明を読んで，各問いに答えなさい。\n\n過去の統計によれば，Pの誕生日に雨が降る確率は30%，Qの誕生日に雨が降る確率は40%である。いま，この数値に基づいて今年の誕生日の天気を考える。\n\nP，Qどちらの誕生日にも雨が降らない確率は何%か。", ["12%", "18%", "28%", "35%", "42%", "60%", "65%", "70%", "88%", "AからIのいずれでもない"], "single", 4, "1. Pの誕生日に雨が降らない確率：100% － 30% ＝ 70%（0.70）\n\n2. Qの誕生日に雨が降らない確率：100% － 40% ＝ 60%（0.60）\n\n3. 両日とも雨が降らない確率：\n\n0.70 × 0.60 ＝ 0.42 ＝ 42% となります。", 4, "NV_SET_6131", 1, 2, [null, null, null, null, null, null, null, null, null, "降雨確率の余事象の掛け合わせ計算ミスです。\n\n【外部情報使用：なし】\n\n---"], "257"),
NV(6132, "確率", "つぎの説明を読んで，各問いに答えなさい。\n\n過去の統計によれば，\n\nPの誕生日に雨が降る確率は30%，\n\nQの誕生日に雨が降る確率は40%である。\n\nいま，この数値に基づいて今年の誕生日の天気を考える。\n\nPかQのどちらか一方の誕生日にだけ雨が降る確率は何%か。", ["30%", "35%", "40%", "46%", "54%", "58%", "65%", "70%", "88%", "AからIのいずれでもない"], "single", 3, "1. 「Pのみ雨（Qは晴れ）」の確率：0.30 × 0.60 ＝ 0.18（18%）\n\n2. 「Qのみ雨（Pは晴れ）」の確率：0.70 × 0.40 ＝ 0.28（28%）\n\n3. 一方のみ雨の確率：18% ＋ 28% ＝ 46% と算出されます。", 4, "NV_SET_6131", 2, 2, [null, null, null, null, null, null, null, null, null, "確率の和・積の適用ミスによる不適切選択肢です。\n\n【外部情報使用：なし】\n\n---"], "3"),
NV(6133, "推論", "つぎの説明を読んで，各問いに答えなさい。\n\nP，Q，R，S，Tは夏休みにそれぞれ別の地域に旅行した。5人のうち男性は3人，女性は2人で，行先は北海道，沖縄，アメリカ，イギリス，フランスだった。5人の性別と行先について，つぎのことがわかっている。\n\nI）男性のうち2人が海外旅行だった\n\nII）ヨーロッパには男性と女性のそれぞれ1人が行った\n\nIII）QとSは国内旅行だった\n\nIV）Rはアメリカに行った\n\nI）からIV）までの情報から判断して，つぎの推論ア，イについて，必ず正しいか，必ず誤りか，あるいはどちらともいえないかを考え，AからIまでの中から正しいものを1つ選びなさい。\n\nア Qは女性である\n\nイ Rは男性である", ["アもイも正しい", "アは正しいが，イはどちらともいえない", "アは正しいが，イは誤り", "アはどちらともいえないが，イは正しい", "アもイもどちらともいえない", "アはどちらともいえないが，イは誤り", "アは誤りだが，イは正しい", "アは誤りだが，イはどちらともいえない", "アもイも誤り"], "single", 3, "1. 海外組は {P, R, T}\nの3人で、ヨーロッパ（イギリス・フランス）に行ったのは P と T\nです（条件IIより 1男1女）。\n\n2. 海外男性は2人（条件I）なので、{P, R, T}\nのうち2人が男性です。PとTで男性1人・女性1人のため、Rは必ず男性\nと決定します（推論イは必ず正しい）。\n\n3. 国内組 {Q, S} は 1男1女\nですが、Qが男性か女性かは一意に決まりません（推論アはどちらともいえない）。\n\n以上より、D（アはどちらともいえないが，イは正しい） が正解です。", 4, "NV_SET_6133", 1, 2, [null, null, null, null, null, null, null, null, "推論ア・イの性別特定ロジックの誤りです。\n\n【外部情報使用：なし】\n\n---"], "4"),
NV(6134, "推論", "つぎの説明を読んで，各問いに答えなさい。\n\nP，Q，R，S，Tは夏休みにそれぞれ別の地域に旅行した。5人のうち男性は3人，女性は2人で，行先は北海道，沖縄，アメリカ，イギリス，フランスだった。5人の性別と行先について，つぎのことがわかっている。\n\nI）男性のうち2人が海外旅行だった\n\nII）ヨーロッパには男性と女性のそれぞれ1人が行った\n\nIII）QとSは国内旅行だった\n\nIV）Rはアメリカに行った\n\nI）からIV）までの情報のほかに，PはSと同性で，北海道には女性が行ったことがわかった。このとき，つぎの推論カ，キについて，必ず正しいか，必ず誤りか，あるいはどちらともいえないかを考え，AからIまでの中から正しいものを1つ選びなさい。\n\nカ PがRと同性なら，Sは沖縄に行った\n\nキ Qが沖縄に行ったなら，Tは女性である", ["カもキも正しい", "カは正しいが，キはどちらともいえない", "カは正しいが，キは誤り", "カはどちらともいえないが，キは正しい", "カもキもどちらともいえない", "カはどちらともいえないが，キは誤り", "カは誤りだが，キは正しい", "カは誤りだが，キはどちらともいえない", "カもキも誤り"], "single", 2, "追加条件をあてはめて検証します：\n\n- 推論カ「PがRと同性（男性）なら，Sは沖縄に行った」：\n\nPが男性ならSも男性（P＝S＝男）。国内組{Q,S}は1男1女なのでQが女性となり、北海道＝女性より\nQが北海道、Sが沖縄 と決定します（必ず正しい）。\n\n- 推論キ「Qが沖縄に行ったなら，Tは女性である」：\n\nQが沖縄の場合、Qは男性、Sは女性（北海道＝女性）です。このとき P＝S＝女性\nとなり、海外女子枠がPで埋まるため Tは男性\nに確定します。したがって「Tは女性」は矛盾であり 必ず誤り です。\n\n以上より、C（カは正しいが，キは誤り） が正解です。", 4, "NV_SET_6133", 2, 2, [null, null, null, null, null, null, null, null, "推論キが確定的に誤りであることを見落とした不適切選択肢です。\n\n【外部情報使用：なし】\n\n---"], "5"),
NV(6135, "損益算", "つぎの説明を読んで，各問いに答えなさい。\n\nある店では商品P，Qをそれぞれ80個仕入れた。\n\n商品Pの定価を120円として売ったところ，80個すべて売り切れ，総額で1600円の利益を得た。商品Pの1個あたりの仕入れ値はいくらか。", ["20円", "30円", "40円", "50円", "60円", "70円", "80円", "90円", "100円", "AからIのいずれでもない"], "single", 8, "1. 総売上：80個 × 120円 ＝ 9600円\n\n2. 総仕入れ値：9600円 － 1600円（利益）＝ 8000円\n\n3. 1個あたりの仕入れ値：8000円 ÷ 80個 ＝ 100円 となります。", 4, "NV_SET_6135", 1, 2, [null, null, null, null, null, null, null, null, null, "1個あたりの利益（20円 → A）などを答えてしまった計算ミスです。\n\n【外部情報使用：なし】\n\n---"], "6"),
NV(6136, "損益算", "つぎの説明を読んで，各問いに答えなさい。\n\nある店では商品P，Qをそれぞれ80個仕入れた。\n\n商品Qを1個あたり300円で仕入れ，定価を420円として売ることにした。定価では56個売れ，残りは仕入れ値の8割の価格にしてすべて売った。このとき，商品Qの利益は総額でいくらか。", ["864円", "1440円", "2980円", "4200円", "5280円", "6720円", "7584円", "7760円", "9600円", "AからIのいずれでもない"], "single", 4, "1. 仕入れ総額：80個 × 300円 ＝ 24,000円\n\n2. 値引き後の売価（仕入れ値の8割）：300円 × 0.8 ＝ 240円\n\n3. 売上総額：\n\n- 定価販売（56個）：56 × 420 ＝ 23,520円\n\n- 値引き販売（24個）：24 × 240 ＝ 5,760円\n\n- 合計売上：23,520 ＋ 5,760 ＝ 29,280円\n\n4. 利益総額：29,280 － 24,000 ＝ 5,280円 と定まります。", 4, "NV_SET_6135", 2, 2, [null, null, null, null, null, null, null, null, null, "値引き数量（24個）や原価割れ損失の引算ミスです。\n\n【外部情報使用：なし】\n\n---\n\n【音問題146】\n\n【PDFページ：8】\n\n問題\n\nつぎの説明を読んで，各問いに答えなさい。\n\nこの問題は2問組です\n\nX，Y，Zの3人は，月曜日から日曜日までの7日間開かれる展示会で受付をすることになり，毎日3人のうち1人が受付の責任者になった。何曜日にだれが責任者になったかについて，つぎのことがわかっている。\n\nI）2日続けて責任者になった人はいない\n\nII）Xは月曜日とそのほかに2日責任者になった\n\nIII）Yは2日責任者になった\n\nIV）水曜日はZが責任者になった\n\nZが金曜日も責任者になったとすると，月曜日以外でXが責任者になったと確実にわかる曜日はいつか。あてはまるものをすべて選びなさい。\n\n選択肢： 火曜日 水曜日 木曜日 金曜日 土曜日 日曜日\n確実にわかる曜日はない"], "7"),
NV(6137, "推論（曜日）", "つぎの説明を読んで，各問いに答えなさい。\n\nX，Y，Zの3人は，月曜日から日曜日までの7日間開かれる展示会で受付をすることになり，毎日3人のうち1人が受付の責任者になった。何曜日にだれが責任者になったかについて，つぎのことがわかっている。\n\nI）2日続けて責任者になった人はいない\n\nII）Xは月曜日とそのほかに2日責任者になった\n\nIII）Yは2日責任者になった\n\nIV）水曜日はZが責任者になった\n\nZが金曜日も責任者になったとすると，月曜日以外でXが責任者になったと確実にわかる曜日はいつか。あてはまるものをすべて選びなさい。", ["火曜日", "水曜日", "木曜日", "金曜日", "土曜日", "日曜日", "確実にわかる曜日はない"], "multi", [4, 5], "Yが「中2日おいて責任者（例：火曜日と金曜日）」になる条件を満たすスケジュールを全検証します：\n\n- パターン1：月:X, 火:Y, 水:Z, 木:X, 金:Y, 土:X, 日:Z\n\n- パターン2：月:X, 火:Y, 水:Z, 木:X, 金:Y, 土:Z, 日:X\n\n水曜日以外のZの担当日として考えられるのは 土曜日 と\n日曜日 です。", 5, "NV_SET_6137", 1, 2, null, "8"),
NV(6138, "推論（曜日）", "つぎの説明を読んで，各問いに答えなさい。\n\nX，Y，Zの3人は，月曜日から日曜日までの7日間開かれる展示会で受付をすることになり，毎日3人のうち1人が受付の責任者になった。何曜日にだれが責任者になったかについて，つぎのことがわかっている。\n\nI）2日続けて責任者になった人はいない\n\nII）Xは月曜日とそのほかに2日責任者になった\n\nIII）Yは2日責任者になった\n\nIV）水曜日はZが責任者になった\n\nYが中2日おいて責任者になったとすると，水曜日以外でZが責任者になったと考えられる曜日はいつか。あてはまるものをすべて選びなさい。", ["月曜日", "火曜日", "木曜日", "金曜日", "土曜日", "日曜日", "考えられる曜日はない"], "multi", [4, 5], "Yが「中2日おいて責任者（例：火曜日と金曜日）」になる条件を満たすスケジュールを全検証します：\n\n- パターン1：月:X, 火:Y, 水:Z, 木:X, 金:Y, 土:X, 日:Z\n\n- パターン2：月:X, 火:Y, 水:Z, 木:X, 金:Y, 土:Z, 日:X\n\n水曜日以外のZの担当日として考えられるのは 土曜日 と\n日曜日 です。", 5, "NV_SET_6137", 2, 2, null, "9"),
NV(6139, "推論", "つぎの説明を読んで，各問いに答えなさい。\n\nP，Q，R，Sの4人の先週の読書時間について，つぎのことがわかっている。\n\nI）同じ時間の人はいない\n\nII）PはRのつぎに長い\n\nIII）最も長いのはRではない\n\nI）からIII）までの情報から判断して，つぎの推論ア，イ，ウのうち，必ずしも誤りとはいえないものはどれか。AからHまでの中から1つ選びなさい。\n\nア Qが最も長い\n\nイ Rが2番目に長い\n\nウ Sが3番目に長い", ["アだけ", "イだけ", "ウだけ", "アとイの両方", "アとウの両方", "イとウの両方", "アとイとウのすべて", "ア，イ，ウのいずれも誤り"], "single", 3, "条件IIより Rの直後にP（R ＞\nP）が並びます。Rは1位ではない（条件III）ため、Rの順位は2位または3位です。\n\n成り立つ順位パターンを全列挙すると：\n\n1. (Q, R, P, S)\n\n2. (Q, S, R, P)\n\n3. (S, Q, R, P)\n\n4. (S, R, P, Q)\n\n各推論の真偽を評価します：\n\n- 推論ア「Qが最も長い（1位）」：パターン1,\n2で成り立ちます（可能）。\n\n- 推論イ「Rが2番目に長い（2位）」：パターン1,\n4で成り立ちます（可能）。\n\n-\n推論ウ「Sが3番目に長い（3位）」：どのパターンにおいてもSが3位になることはありません（必ず誤り）。\n\nしたがって、必ずしも誤りとはいえないのは アとイの両方（D）\nです。", 3, null, null, null, [null, null, "単独選択のため不十分です。\n\nE, F,", null, null, null, "必ず誤りである「ウ」を含んでいるため不適切です。", null], "12")

<script>
(function(){
"use strict";

// ---------- 言語・非言語データの統合 ----------
// data.js が QUESTIONS（言語, subject:"language"）を、
// nonverbal_data.js が NONVERBAL_QUESTIONS（非言語, subject:"nonverbal"）を定義済み。
// ここで1つの配列に統合し、以降は QUESTIONS を「全科目共通の問題プール」として扱う。
if(typeof NONVERBAL_QUESTIONS !== "undefined"){
  Array.prototype.push.apply(QUESTIONS, NONVERBAL_QUESTIONS);
}

// ---------- 非言語「推論」系カテゴリーの難易度を引き上げ ----------
// 「推論」「推論（曜日）」など、カテゴリー名に「推論」を含む非言語問題の難易度を+2する
// （出題ロジック上の難易度値のみの調整。問題内容・カテゴリー分類・その他仕様は変更しない）
(function boostNonverbalReasoningDifficulty(){
  QUESTIONS.forEach(function(q){
    if(q.subject === "nonverbal" && q.category && q.category.indexOf("推論") !== -1){
      q.difficulty = Math.min(7, q.difficulty + 2);
    }
  });
  // 組問題の代表難易度(setDifficulty)を、引き上げ後の値で再計算する
  QUESTIONS.forEach(function(q){
    if(q.subject !== "nonverbal") return;
    if(q.questionSetId){
      var first = null;
      for(var i=0;i<QUESTIONS.length;i++){
        if(QUESTIONS[i].questionSetId===q.questionSetId && QUESTIONS[i].questionSetPosition===1){ first = QUESTIONS[i]; break; }
      }
      q.setDifficulty = first ? first.difficulty : q.difficulty;
    } else {
      q.setDifficulty = q.difficulty;
    }
  });
})();

// ---------- ブロック情報の再計算（科目×カテゴリー単位、20問区切り、組問題は分断しない） ----------
(function(){
  var BLOCK_SIZE = 20;
  var byKey = {};
  var order = [];
  QUESTIONS.forEach(function(q){
    var key = q.subject + "::" + q.category;
    if(!byKey[key]){ byKey[key] = []; order.push(key); }
    byKey[key].push(q);
  });
  order.forEach(function(key){
    var list = byKey[key];
    var cat = list[0].category;

    var chunks = [];
    var seen = {};
    list.forEach(function(q){
      if(seen[q.id]) return;
      if(q.questionSetId){
        var members = list.filter(function(x){ return x.questionSetId === q.questionSetId; })
          .sort(function(a,b){ return a.questionSetPosition - b.questionSetPosition; });
        members.forEach(function(m){ seen[m.id] = true; });
        chunks.push(members);
      } else {
        seen[q.id] = true;
        chunks.push([q]);
      }
    });

    var blocks = [];
    var current = [];
    chunks.forEach(function(chunk){
      if(current.length > 0 && current.length + chunk.length > BLOCK_SIZE){
        blocks.push(current);
        current = [];
      }
      current = current.concat(chunk);
    });
    if(current.length > 0) blocks.push(current);

    blocks.forEach(function(blockQs, bIdx){
      var blockNum = bIdx + 1;
      var blockNumStr = blockNum < 10 ? ("0" + blockNum) : String(blockNum);
      var blockId = cat + "-block-" + blockNumStr;
      blockQs.forEach(function(q, pIdx){
        q.section = "全体";
        q.blockNumber = blockNum;
        q.blockPosition = pIdx + 1;
        q.blockId = blockId;
      });
    });
  });
})();

function syncFlashcardsOnLogin(onDone){
  if(!SUPABASE_ENABLED || !isLoggedIn()){ onDone(); return; }
  Promise.all([
    sbClient.from("flashcard_folders").select("*").eq("user_id", currentUserId()),
    sbClient.from("flashcards").select("*").eq("user_id", currentUserId())
  ]).then(function(results){
    var foldersRes = results[0], cardsRes = results[1];
    if((foldersRes && foldersRes.error) || (cardsRes && cardsRes.error)){
      reportSyncError("フラッシュカード取得", (foldersRes&&foldersRes.error) || (cardsRes&&cardsRes.error));
      onDone(); return;
    }
    var serverFolders = (foldersRes && foldersRes.data) || [];
    var serverCards = (cardsRes && cardsRes.data) || [];
    var serverFolderIds = {}; serverFolders.forEach(function(f){ serverFolderIds[f.id] = true; });
    var serverCardIds = {}; serverCards.forEach(function(c){ serverCardIds[c.id] = true; });

    var mergedFolders = serverFolders.map(function(f){ return {id:f.id, name:f.name, createdAt:f.created_at}; });
    flashcardFolders.forEach(function(f){ if(!serverFolderIds[f.id]) mergedFolders.push(f); });
    flashcardFolders = mergedFolders;
    saveFlashcardFoldersLS(flashcardFolders);

    var mergedCards = serverCards.map(function(c){ return {
      id:c.id, folderId:c.folder_id, front:c.front, back:c.back, memo:c.memo||"",
      sourceType:c.source_type, sourceProblemSource:c.source_problem_source, sourceQuestionId:c.source_question_id,
      knownCount:c.known_count||0, unknownCount:c.unknown_count||0, lastReviewedAt:c.last_reviewed_at, createdAt:c.created_at
    }; });
    var localOnlyCards = flashcards.filter(function(c){ return !serverCardIds[c.id]; });
    flashcards = mergedCards.concat(localOnlyCards);
    saveFlashcardsLS(flashcards);

    var localOnlyFolders = flashcardFolders.filter(function(f){ return !serverFolderIds[f.id]; });
    var uploads = [];
    localOnlyFolders.forEach(function(f){ uploads.push(sbClient.from("flashcard_folders").upsert({id:f.id, user_id:currentUserId(), name:f.name, created_at:f.createdAt})); });
    localOnlyCards.forEach(function(c){ uploads.push(sbClient.from("flashcards").upsert({
      id:c.id, user_id:currentUserId(), folder_id:c.folderId, front:c.front, back:c.back, memo:c.memo,
      source_type:c.sourceType, source_problem_source:c.sourceProblemSource, source_question_id:c.sourceQuestionId,
      known_count:c.knownCount, unknown_count:c.unknownCount, last_reviewed_at:c.lastReviewedAt, created_at:c.createdAt
    })); });
    Promise.all(uploads.map(function(p){ return p.catch(function(){ return null; }); })).then(function(){ onDone(); }).catch(function(){ onDone(); });
  }).catch(function(err){ reportSyncError("通信エラー", err); onDone(); });
}

// ---- 問題からのカード作成（元データに存在する関係のみを使用し、新たに創作しない） ----
// 対応パターン：
//   ①「REF1：REF2\nTERM：（　　）」形式（対義語・類推、および参考問題の二語関係9カテゴリー）
//   ②「語句」カテゴリーの意味を問うタイプ（資料欄が単語の定義文そのもののもの）
function extractResourcePair(resource){
  if(!resource) return null;
  var lines = resource.split("\n");
  if(lines.length < 2) return null;
  var refParts = lines[0].split("：");
  var termParts = lines[1].split("：");
  if(refParts.length < 2 || termParts.length < 2) return null;
  return { ref1: refParts[0].trim(), ref2: refParts[1].trim(), term: termParts[0].trim() };
}
function isFlashcardEligible(q){
  if(q.answerType !== "single" || !q.resource) return false;
  if(q.category === "語句" && q.problemSource === "official" && !q.resourceParts) return true; // 意味クイズ型
  if(extractResourcePair(q.resource)) return true; // 二語関係型
  return false;
}
function createFlashcardFromQuestion(q, folderId){
  if(!isFlashcardEligible(q)) return null;
  var front, back;
  if(q.category === "語句" && q.problemSource === "official" && !q.resourceParts){
    front = q.options[q.answer];
    back = q.resource;
  } else {
    var pair = extractResourcePair(q.resource);
    if(!pair) return null;
    front = pair.term;
    back = q.options[q.answer];
  }
  var sourceType = q.problemSource === "reference" ? "reference_question" : "official_question";
  return addFlashcard(front, back, "", sourceType, q.problemSource, q.id, folderId || null);
}

// YouTubeの各種URL形式から動画IDを抽出する（watch?v=, youtu.be/, embed/, shorts/ に対応）
function extractYoutubeId(url){

// お知らせ本文中の [img]URL[/img] と [table]行|列...[/table] マーカーを実際の
// 画像・表として描画する。それ以外の部分は通常のテキストとしてエスケープ表示する。
function renderAnnouncementBody(text){
  var html = "";
  var re = /\[img\]([\s\S]*?)\[\/img\]|\[table\]([\s\S]*?)\[\/table\]/g;
  var lastIndex = 0, m;
  function pushText(t){
    if(t === "") return;
    html += '<div style="white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.7;">' + escapeHtml(t) + '</div>';
  }
  while((m = re.exec(text))){
    pushText(text.slice(lastIndex, m.index));
    if(m[1] !== undefined){
      var url = m[1].trim();
      if(/^https:\/\//.test(url)){
        html += '<img src="' + escapeHtml(url) + '" alt="" style="max-width:100%;border-radius:10px;margin:8px 0;display:block;" loading="lazy">';
      }
    } else if(m[2] !== undefined){
      var rows = m[2].replace(/^\n+|\n+$/g, "").split("\n").filter(function(r){ return r.length; }).map(function(r){ return r.split("|"); });
      if(rows.length){
        html += '<div style="overflow-x:auto;margin:8px 0;"><table class="material-table">';
        rows.forEach(function(cells, ri){
          html += "<tr>";
          cells.forEach(function(c){
            var tag = ri === 0 ? "th" : "td";
            html += "<" + tag + ">" + escapeHtml(c.trim()) + "</" + tag + ">";
          });
          html += "</tr>";
        });
        html += "</table></div>";
      }
    }
    lastIndex = re.lastIndex;
  }
  pushText(text.slice(lastIndex));
  return html || '<div style="font-size:14px;">' + escapeHtml(text) + '</div>';
}

function translateSupabaseError(err){
  var msg = (err && err.message) || String(err || "");
  return msg || "エラーが発生しました。";
}

function translateAuthError(err){
  var msg = (err && err.message) || String(err || "");
  if(/already registered|already exists|User already registered/i.test(msg)) return "このメールアドレスは既に登録されています。";
  if(/invalid login credentials/i.test(msg)) return "メールアドレスまたはパスワードが正しくありません。";
  if(/password.*(least|short|6 character)/i.test(msg)) return "パスワードは6文字以上で入力してください。";
  if(/invalid email|unable to validate email/i.test(msg)) return "メールアドレスの形式が正しくありません。";
  if(/rate limit/i.test(msg)) return "リクエストが多すぎます。しばらくしてから再度お試しください。";
  if(/network|fetch/i.test(msg)) return "ネットワークエラーが発生しました。接続を確認してください。";
  return msg || "エラーが発生しました。";
}

// ---- データ同期（fire-and-forgetでSupabaseへミラー保存。失敗してもローカルの学習は継続できる）----
function syncQuestionProgress(questionId, patch){
  if(!SUPABASE_ENABLED || !isLoggedIn()) return;
  var q = byId(questionId);
  var bumpField = null;
  if(patch.bump === "correct") bumpField = "correct_count";
  else if(patch.bump === "incorrect") bumpField = "wrong_count";
  sbClient.from("question_progress").select("attempt_count,wrong_count,correct_count")
    .eq("user_id", currentUserId()).eq("question_id", questionId).maybeSingle()
    .then(function(res){
      var existing = (res && res.data) || {attempt_count:0, wrong_count:0, correct_count:0};
      var row = {
        user_id: currentUserId(), question_id: questionId,
        subject: q ? q.subject : null, section: q ? q.section : null, block_id: q ? q.blockId : null,
        question_set_id: q ? q.questionSetId : null, difficulty: q ? q.difficulty : null,
        question_type: q ? q.answerType : null,
        attempt_count: existing.attempt_count + (bumpField ? 1 : 0),
        wrong_count: existing.wrong_count + (bumpField === "wrong_count" ? 1 : 0),
        correct_count: existing.correct_count + (bumpField === "correct_count" ? 1 : 0),
        last_answered_at: bumpField ? new Date().toISOString() : undefined
      };
      if(patch.is_weak !== undefined) row.is_weak = patch.is_weak;
      if(patch.last_status !== undefined) row.last_status = patch.last_status;
      return sbClient.from("question_progress").upsert(row, {onConflict:"user_id,question_id"});
    }).then(function(res){
      if(res && res.error) reportSyncError("間違えた問題", res.error);
      else console.log("[Supabase] question_progress 保存成功:", questionId);
    }).catch(function(err0){ reportSyncError("通信エラー", err0); });
}

// ---- ログイン時：ゲストデータ(localStorage)をユーザーのSupabaseデータへ統合する ----
// 既存のSupabaseデータが無い項目だけをアップロードし、二重加算を避ける。
function migrateGuestDataToSupabase(onDone){
  if(!SUPABASE_ENABLED || !isLoggedIn()){ onDone(); return; }
  var tasks = [];

  Object.keys(weakMap).forEach(function(qid){
    tasks.push(sbClient.from("question_progress").upsert({
      user_id: currentUserId(), question_id: parseInt(qid,10), is_weak: true
    }, {onConflict:"user_id,question_id", ignoreDuplicates:false}));
  });
  Object.keys(statusMap).forEach(function(qid){
    tasks.push(
      sbClient.from("question_progress").select("question_id").eq("user_id", currentUserId()).eq("question_id", parseInt(qid,10)).maybeSingle()
        .then(function(res){
          if(res && res.data) return null; // 既にSupabase側にデータがあれば二重登録しない
          return sbClient.from("question_progress").upsert({
            user_id: currentUserId(), question_id: parseInt(qid,10), last_status: statusMap[qid],
            attempt_count: 1, correct_count: statusMap[qid]==="correct"?1:0, wrong_count: statusMap[qid]==="incorrect"?1:0
          }, {onConflict:"user_id,question_id"});
        })
    );
  });

  var migrateErrors = [];
  Promise.all(tasks.map(function(p){
    return p.then(function(res){
      if(res && res.error) migrateErrors.push(res.error);
      return res;
    }).catch(function(err){ migrateErrors.push(err); return null; });
  })).then(function(){
    if(migrateErrors.length){
      console.error("[Supabase] ゲストデータの移行に失敗した項目があります:", migrateErrors);
      showSyncToast("一部のデータの移行に失敗しました（詳細はコンソールを確認）。", true);
    }
    onDone();
  }).catch(function(err){ console.error("[Supabase] ゲストデータ移行処理全体でエラー:", err); onDone(); });
}

// ---- ログイン直後：Supabase側のデータをローカルの表示用マップへ反映する（簡易プル）----

// ---------- ユーティリティ ----------
function byId(id){ return QUESTIONS.find(function(q){ return q.id === id; }); }
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

// ---------- 選択肢シャッフル設定 ----------
// 正解データ(q.answer)は一切書き換えず、表示順だけを入れ替える。
// 1問の開始時に確定した順序を、その問題を解き終わるまで保持する。
var LS_SHUFFLE_ENABLED = "jq_shuffle_enabled_v1";
function isShuffleEnabled(){
  try{ return localStorage.getItem(LS_SHUFFLE_ENABLED) === "1"; }catch(e){ return false; }
}
function setShuffleEnabled(v){
  try{ localStorage.setItem(LS_SHUFFLE_ENABLED, v ? "1" : "0"); }catch(e){}
}
function computeDisplayOrder(q, enabled){
  var idxs = q.options.map(function(_,i){ return i; });
  return enabled ? shuffle(idxs) : idxs;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
