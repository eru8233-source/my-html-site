// 「傍線部：」マーカーがdata.js側でtext/underlineパーツに変換済みの場合はそれを使い、
// 実際の下線(CSSのtext-decoration)として表示する。パーツが無い場合は通常のエスケープ表示。
function renderRichText(text, parts){
  if(!parts) return escapeHtml(text);
  return parts.map(function(p){
    if(p.type === "underline") return '<span class="underline-part">' + escapeHtml(p.value) + '</span>';
    return escapeHtml(p.value);
  }).join("");
}
function renderResource(q){ return renderRichText(q.resource, q.resourceParts); }
function renderOption(q, i){ return renderRichText(q.options[i], q.optionParts ? q.optionParts[i] : null); }

// ---------- 非言語問題の資料（表）を専用コンポーネントとして表示 ----------
// 元データはテキストブロックの中に表がそのまま含まれているため、実行時に
// 「短い行が複数連続し、各行が2マス以上の空白で区切られた複数列を持つ」
// パターンを検出して表として整形する。表以外の部分は通常の問題文として表示する。
function splitRowFields(line){
  return line.split(/\s{2,}/).map(function(s){ return s.trim(); }).filter(function(s){ return s !== ""; });
}
function looksNumericCell(s){
  var t = s.trim();
  return /^[\-−]?[\d,]+(\.\d+)?[%点人本円ｇg分秒℃]*$/.test(t) || /^[〔(][^〕)]*[〕)]$/.test(t) || t === "---" || t === "( )";
}
function parseNonverbalContent(text){
  var lines = (text || "").split("\n");
  var out = [];
  var textBuf = [];
  function flushText(){
    if(textBuf.length){
      var val = textBuf.join("\n").trim();
      if(val) out.push({type:"text", value:val});
      textBuf = [];
    }
  }
  var i = 0;
  while(i < lines.length){
    var trimmed = lines[i].trim();
    if(/^-{4,}$/.test(trimmed.replace(/\s/g,""))){ i++; continue; } // 罫線行は除去
    if(trimmed === ""){ textBuf.push(""); i++; continue; }
    var fields = splitRowFields(trimmed);
    if(fields.length >= 2){
      var rows = [fields];
      var j = i + 1;
      while(j < lines.length){
        var lj = lines[j].trim();
        if(/^-{4,}$/.test(lj.replace(/\s/g,"")) || lj === ""){ j++; continue; } // 罫線・空行はスキップして表の継続を判定
        var fj = splitRowFields(lj);
        if(fj.length < 2) break;
        rows.push(fj);
        j++;
      }
      if(rows.length >= 2){
        flushText();
        var title = null;
        if(out.length && out[out.length-1].type === "text"){
          var prevLines = out[out.length-1].value.split("\n");
          var prevLast = prevLines[prevLines.length-1].trim();
          if(prevLast.length < 40 && (prevLast.indexOf("表") !== -1 || prevLast.indexOf("〈") !== -1 || prevLast.indexOf("資料") !== -1 || prevLast.indexOf("＜") !== -1)){
            title = prevLast;
            prevLines.pop();
            var remainVal = prevLines.join("\n").trim();
            if(remainVal) out[out.length-1].value = remainVal; else out.pop();
          }
        }
        out.push({type:"table", title:title, rows:rows});
        i = j;
        continue;
      }
    }
    textBuf.push(lines[i]);
    i++;
  }
  flushText();
  return out;
}
function renderNonverbalContentHtml(q){
  if(!q._parsedContent){ q._parsedContent = parseNonverbalContent(q.question); }
  var html = "";
  q._parsedContent.forEach(function(p){
    if(p.type === "table"){
      html += '<div class="question-material">';
      if(p.title) html += '<div class="material-title">' + escapeHtml(p.title) + '</div>';
      html += '<div style="overflow-x:auto;"><table class="material-table">';
      p.rows.forEach(function(row, ri){
        html += "<tr>";
        row.forEach(function(cell){
          var tag = ri === 0 ? "th" : "td";
          var numeric = ri > 0 && looksNumericCell(cell);
          html += "<" + tag + (numeric ? ' style="text-align:right;"' : "") + ">" + escapeHtml(cell) + "</" + tag + ">";
        });
        html += "</tr>";
      });
      html += "</table></div></div>";
    } else {
      html += '<div class="qtext" style="margin-bottom:8px;">' + escapeHtml(p.value) + '</div>';
    }
  });
  return html;
}
// 問題文本体の描画。非言語は表を専用コンポーネントとして整形し、言語は既存どおり
// プレーンテキストとして表示する（言語側の表示仕様は変更しない）。
function renderQuestionBody(q){
  if(q.subject === "nonverbal") return renderNonverbalContentHtml(q);
  return '<div class="qtext">' + escapeHtml(q.question) + '</div>';
}

// 選択肢ごとの詳細解説アコーディオン（プルダウン形式）。
// ctx = { idPrefix, isOpen(i), isCorrect(i), isUserPick(i), onToggle(i), onOpenAll(), onCloseAll() }
function renderChoiceAccordion(q, ctx){
  var html = '<div class="choice-accordion" style="margin-top:4px;">';
  html += '<div style="font-weight:600;font-size:14px;margin-bottom:8px;">選択肢ごとの詳細解説</div>';
  html += '<div class="row" style="margin-bottom:10px;">' +
    '<span class="chip small" id="' + ctx.idPrefix + '-open-all">すべて開く</span>' +
    '<span class="chip small" id="' + ctx.idPrefix + '-close-all">すべて閉じる</span>' +
    '</div>';
  var order = ctx.order || q.options.map(function(_,i){ return i; });
  order.forEach(function(i, pos){
    var open = ctx.isOpen(i);
    var correct = ctx.isCorrect(i);
    var userPick = ctx.isUserPick(i);
    var badge = correct
      ? '<span style="color:var(--ok);font-weight:700;white-space:nowrap;">✓ 正解</span>'
      : '<span style="color:var(--ng);font-weight:700;white-space:nowrap;">✕ 不正解</span>';
    html += '<div style="border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden;">';
    html += '<button class="acc-toggle-btn" data-acc-prefix="' + ctx.idPrefix + '" data-acc-i="' + i + '" style="width:100%;text-align:left;background:' + (open?"var(--chip)":"#fff") + ';border:none;padding:12px 14px;font-size:14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;">' +
      '<span>' + (open?"▼":"▶") + ' ' + letters(pos) + '. ' + renderOption(q,i) + (userPick ? '　<span style="color:var(--accent);font-weight:600;">（あなたの回答）</span>' : '') + '</span>' +
      badge +
      '</button>';
    if(open){
      var detail = (q.choiceDetails && q.choiceDetails[i]) ? q.choiceDetails[i] : "詳細解説は未登録です。";
      html += '<div style="padding:12px 14px;border-top:1px solid var(--line);font-size:14px;background:#fff;white-space:pre-wrap;">' + escapeHtml(detail) + '</div>';
    }
    html += '</div>';
  });
  html += '</div>';
  return html;
}
function bindChoiceAccordionEvents(q, ctx){
  var selector = '.acc-toggle-btn[data-acc-prefix="' + ctx.idPrefix + '"]';
  Array.prototype.forEach.call(document.querySelectorAll(selector), function(btn){
    btn.onclick = function(){ ctx.onToggle(parseInt(btn.getAttribute("data-acc-i"),10)); };
  });
  var openAllBtn = document.getElementById(ctx.idPrefix + "-open-all");
  var closeAllBtn = document.getElementById(ctx.idPrefix + "-close-all");
  if(openAllBtn) openAllBtn.onclick = function(){ ctx.onOpenAll(); };
  if(closeAllBtn) closeAllBtn.onclick = function(){ ctx.onCloseAll(); };
}

// ---------- 組問題（questionSet）対応 ----------
// idの配列を「チャンク」の配列に変換する。組問題に属するidは、そのidが配列に
// 含まれていなくても組問題の全メンバーが揃っている場合はまとめて1チャンクとして扱う
// （組問題を途中で分断しない）。揃っていない場合は安全のため単独チャンクとして扱う。
function chunkIds(ids){
  var present = {};
  ids.forEach(function(id){ present[id] = true; });
  var seen = {};
  var chunks = [];
  ids.forEach(function(id){
    if(seen[id]) return;
    var q = byId(id);
    if(q && q.questionSetId){
      var members = QUESTIONS.filter(function(x){ return x.questionSetId === q.questionSetId; })
        .sort(function(a,b){ return a.questionSetPosition - b.questionSetPosition; })
        .map(function(x){ return x.id; });
      var allPresent = members.every(function(m){ return present[m]; });
      if(allPresent){
        members.forEach(function(m){ seen[m] = true; });
        chunks.push(members);
      } else {
        seen[id] = true;
        chunks.push([id]);
      }
    } else {
      seen[id] = true;
      chunks.push([id]);
    }
  });
  return chunks;
}
// チャンクの配列を、要求数(count)以上になるまで（組問題を割らずに）連結してフラットなid配列にする
function flattenChunksToCount(chunks, count){
  var out = [];
  for(var i=0;i<chunks.length;i++){
    if(out.length >= count) break;
    out = out.concat(chunks[i]);
  }
  return out;
}

function getCategoriesForSubject(subject){
  var seen = {}; // key: category+"__"+problemSource
  var order = [];
  QUESTIONS.forEach(function(q){
    if(q.subject !== subject) return;
    var ps = q.problemSource || "official";
    if(ps !== "official" && ps !== "reference") return; // flashcard_only等は系統別の対象外
    var key = q.category + "__" + ps;
    if(!seen[key]){ seen[key] = {name:q.category, problemSource:ps, count:0}; order.push(key); }
    seen[key].count++;
  });
  return order.map(function(k){ return seen[k]; });
}

// ---------- ブロック機能（20問単位） ----------
var BLOCK_SIZE = 20;
var BLOCKS = (function(){
  var map = {};
  var order = [];
  QUESTIONS.forEach(function(q){
    if(!q.blockId) return;
    if(!map[q.blockId]){
      map[q.blockId] = {blockId:q.blockId, subject:q.subject, category:q.category, blockNumber:q.blockNumber, ids:[]};
      order.push(q.blockId);
    }
    map[q.blockId].ids.push(q.id);
  });
  return order.map(function(bid){ return map[bid]; });
})();
function getBlocksForCategory(subject, cat){ return BLOCKS.filter(function(b){ return b.subject===subject && b.category===cat; }); }
function getBlock(blockId){ return BLOCKS.find(function(b){ return b.blockId===blockId; }); }

var LS_BLOCK_HISTORY = "jq_block_history_v1";
function loadBlockHistory(){ try{ return JSON.parse(localStorage.getItem(LS_BLOCK_HISTORY) || "{}"); }catch(e){ return {}; } }
function saveBlockHistoryMap(m){ try{ localStorage.setItem(LS_BLOCK_HISTORY, JSON.stringify(m)); }catch(e){} }
var blockHistoryMap = loadBlockHistory(); // blockId -> [attempt, ...]（最新5件まで）
function addBlockAttempt(blockId, attempt){
  if(!blockHistoryMap[blockId]) blockHistoryMap[blockId] = [];
  attempt.attemptNumber = blockHistoryMap[blockId].length + 1;
  blockHistoryMap[blockId].push(attempt);
  if(blockHistoryMap[blockId].length > 5) blockHistoryMap[blockId] = blockHistoryMap[blockId].slice(-5);
  saveBlockHistoryMap(blockHistoryMap);
  syncBlockAttempt(blockId, attempt);
}
function getBlockHistory(blockId){ return blockHistoryMap[blockId] || []; }
function getBlockLastAttempt(blockId){ var h = getBlockHistory(blockId); return h.length ? h[h.length-1] : null; }

// ブロック学習を開始（順番どおり or ランダム）。既存のbeginQuiz()をそのまま利用する。
function startBlockPractice(block, order){
  state.targetIds = block.ids.slice();
  state.scopeLabel = block.category + " 第" + block.blockNumber + "ブロック";
  state.count = block.ids.length;
  state.order = order; // "sequential" | "random"
  state.blockContext = {blockId: block.blockId, category: block.category, blockNumber: block.blockNumber, mode: "learn"};
  beginQuiz();
}

// ---------- ブロック：カテゴリー選択画面 ----------
function renderBlockCategory(){
  var cats = getCategoriesForSubject(state.subject);
  var officialCats = cats.filter(function(c){ return c.problemSource === "official"; });
  var referenceCats = cats.filter(function(c){ return c.problemSource === "reference"; });
  var showHeaders = officialCats.length > 0 && referenceCats.length > 0;

  var html = '<div class="backlink" id="back">← トップへ戻る</div><h2>ブロック学習（20問ずつ）</h2>';
  html += '<div class="sub">各カテゴリーの問題を20問ずつのブロックに分けて、繰り返し学習できます。</div>';
  function renderGroup(title, list){
    if(!list.length) return "";
    var h = showHeaders ? '<div style="font-weight:600;margin:14px 0 8px;color:var(--sub);font-size:14px;">' + escapeHtml(title) + '</div>' : "";
    list.forEach(function(c){
      var blocks = getBlocksForCategory(state.subject, c.name);
      h += '<button class="btn" data-cat="' + escapeHtml(c.name) + '">' + escapeHtml(c.name) +
        '<span class="cat-count">（' + c.count + '問／' + blocks.length + 'ブロック）</span></button>';
    });
    return h;
  }
  html += renderGroup("旧問題", officialCats);
  html += renderGroup("参考問題", referenceCats);
  app.innerHTML = html;
  document.getElementById("back").onclick = function(){ go("top"); };
  Array.prototype.forEach.call(app.querySelectorAll("[data-cat]"), function(btn){
    btn.onclick = function(){ go("blockList", {blockListCategory: btn.getAttribute("data-cat")}); };
  });
}

function renderBlockList(){
  var cat = state.blockListCategory;

  var html = '<div class="backlink" id="back">← カテゴリー選択へ</div><h2>' + escapeHtml(cat) + '</h2>';

    html += '<div style="font-size:13px;color:var(--sub);margin-bottom:8px;">' + b.ids.length + '問';

      html += '　／　完了　／　直近正答率：' + last.accuracy + '%　（挑戦' + hist.length + '回）';
    } else {
      html += '　／　未着手';
    }
    html += '</div>';
    html += '<button class="btn primary small" data-seq="' + escapeHtml(b.blockId) + '">順番どおりに解く</button>';
    html += '<button class="btn small" data-rand="' + escapeHtml(b.blockId) + '">ランダムで解く</button>';
    html += '</div>';
  });
  app.innerHTML = html;
  document.getElementById("back").onclick = function(){ go("blockCategory"); };

    btn.onclick = function(){ startBlockPractice(getBlock(btn.getAttribute("data-seq")), "sequential"); };
  });
  Array.prototype.forEach.call(app.querySelectorAll("[data-rand]"), function(btn){
    btn.onclick = function(){ startBlockPractice(getBlock(btn.getAttribute("data-rand")), "random"); };
  });
}

// ---------- 系統別選択 ----------
function renderCategory(){
  var cats = getCategoriesForSubject(state.subject);
  var officialCats = cats.filter(function(c){ return c.problemSource === "official"; });
  var referenceCats = cats.filter(function(c){ return c.problemSource === "reference"; });

  var html = '<div class="backlink" id="back">← トップへ戻る</div><h2>系統別に解く</h2>';
  function renderGroup(title, list, showHeader){
    if(!list.length) return "";
    var h = showHeader ? '<div style="font-weight:600;margin:14px 0 8px;color:var(--sub);font-size:14px;">' + escapeHtml(title) + '</div>' : "";
    list.forEach(function(c){
      h += '<button class="btn" data-cat="' + escapeHtml(c.name) + '" data-ps="' + c.problemSource + '">' + escapeHtml(c.name) +
        '<span class="cat-count">（' + c.count + '問）</span></button>';
    });
    return h;
  }
  var showHeaders = officialCats.length > 0 && referenceCats.length > 0;
  html += renderGroup("旧問題", officialCats, showHeaders);
  html += renderGroup("参考問題", referenceCats, showHeaders);

  app.innerHTML = html;
  document.getElementById("back").onclick = function(){ go("top"); };
  Array.prototype.forEach.call(app.querySelectorAll("[data-cat]"), function(btn){
    btn.onclick = function(){
      var cat = btn.getAttribute("data-cat");
      var ps = btn.getAttribute("data-ps");
      var ids = subjectQuestions(state.subject, ps).filter(function(q){ return q.category===cat; }).map(function(q){return q.id;});
      var srcLabel = ps === "reference" ? "（参考問題）" : "（旧問題）";
      startScopeSelection(ids, "系統別：" + cat + srcLabel);
    };
  });
}

// ---------- 出題数・順序選択 ----------
function startScopeSelection(ids, label){
  state.targetIds = ids;
  state.scopeLabel = label;
  state.count = null;
  state.order = null;
  state.blockContext = null;
  go("setup");
}

function renderSetup(){
  var n = state.targetIds.length;
  if(n === 0){
    app.innerHTML =
      '<div class="backlink" id="back">← トップへ戻る</div>' +
      '<h2>' + escapeHtml(state.scopeLabel) + '</h2>' +
      '<div class="empty">対象となる問題がまだありません。</div>';
    document.getElementById("back").onclick = function(){ go("top"); };
    return;
  }
  var options = COUNT_BASE.filter(function(v){ return v < n; })
    .map(function(v){ return {v:v, l:v+"問"}; });
  options.push({v:n, l:"全問（" + n + "問）"});

  var html =
    '<div class="backlink" id="back">← 戻る</div>' +
    '<h2>' + escapeHtml(state.scopeLabel) + '</h2>' +
    '<div class="card"><div style="margin-bottom:10px;font-weight:600;">何問解きますか？（対象：' + n + '問）</div>' +
    '<div class="row" id="count-row">' +
    options.map(function(o){
      return '<span class="chip ' + (state.count===o.v?"active":"") + '" data-count="' + o.v + '">' + o.l + '</span>';
    }).join("") +
    '</div></div>' +
    '<div class="card"><div style="margin-bottom:10px;font-weight:600;">出題順</div>' +
    '<div class="row" id="order-row">' +
    '<span class="chip ' + (state.order==="random"?"active":"") + '" data-order="random">ランダム</span>' +
    '<span class="chip ' + (state.order==="sequential"?"active":"") + '" data-order="sequential">順番どおり</span>' +
    '</div></div>' +
    '<div class="card"><div style="margin-bottom:10px;font-weight:600;">選択肢の順番</div>' +
    '<div class="row" id="shuffle-row">' +
    '<span class="chip ' + (!isShuffleEnabled()?"active":"") + '" data-shuffle="0">そのまま</span>' +
    '<span class="chip ' + (isShuffleEnabled()?"active":"") + '" data-shuffle="1">シャッフルする</span>' +
    '</div><div class="note" style="margin-top:8px;">正解の位置は変わりません。選択肢の表示順だけをランダムにします（暗記対策）。</div></div>' +
    '<div id="summary-area"></div>' +
    '<button class="btn primary" id="b-start" disabled>この設定で開始</button>';
  app.innerHTML = html;
  document.getElementById("back").onclick = function(){ go("top"); };
  Array.prototype.forEach.call(document.querySelectorAll("#shuffle-row .chip"), function(chip){
    chip.onclick = function(){
      setShuffleEnabled(chip.getAttribute("data-shuffle") === "1");
      renderSetup();
    };
  });

  function updateSummary(){
    var sum = document.getElementById("summary-area");
    var startBtn = document.getElementById("b-start");
    if(state.count && state.order){
      sum.innerHTML = '<div class="config-summary">' +
        '<div><b>【出題設定】</b></div>' +
        '<div>対象：' + escapeHtml(state.scopeLabel) + '</div>' +
        '<div>問題数：' + state.count + '問' + (state.count===n ? '（対象は' + n + '問のため、' + n + '問すべてを出題します）' : '') + '</div>' +
        '<div>出題順：' + (state.order==="random" ? "ランダム" : "順番どおり") + '</div>' +

      state.count = parseInt(chip.getAttribute("data-count"),10);

function beginQuiz(){
  var pool = state.targetIds.slice();
  var chunks = chunkIds(pool);
  if(state.order === "random"){
    chunks = shuffle(chunks);
  } // 順番どおりの場合はchunkIds内で既にid昇順（組問題は内部順序を維持）
  state.sessionIds = flattenChunksToCount(chunks, state.count);
  state.idx = 0;
  state.answers = {};
  state.showQuizAbortMenu = false;
  go("quiz");
}

// ---------- 出題画面 ----------
function renderQuiz(){
  var total = state.sessionIds.length;
  var qid = state.sessionIds[state.idx];
  var q = byId(qid);
  var ans = state.answers[state.idx];
  if(!ans){
    ans = {selectedIndex:null, selectedSet:{}, textValue:"", submitted:false, judged:null,
      displayOrder: computeDisplayOrder(q, isShuffleEnabled())};
    state.answers[state.idx] = ans;
  }
  if(!ans.displayOrder) ans.displayOrder = computeDisplayOrder(q, isShuffleEnabled());
  var atype = q.answerType || "single";

  var pct = Math.round(((state.idx) / total) * 100);
  var html = '<div class="backlink" id="back-top">← 中断してトップへ</div>';
  if(state.idx > 0){
    html += '<div class="backlink" id="b-prev-q">← 前の問題へ</div>';
  }
  html += '<div class="progress-label"><span>' + (state.idx+1) + ' / ' + total + '問</span><span>' + escapeHtml(state.scopeLabel) + '</span></div>';
  html += '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>';
  html += '<div class="card">';
  html += '<span class="qtype">' + escapeHtml(q.category) + (q.note ? ' ／ ' + escapeHtml(q.note) : '') + '</span>';
  if(q.questionSetId){
    html += '<div class="qtype" style="background:#eef0f7;color:#3a4a8a;margin-left:6px;">【組問題】小問 ' + q.questionSetPosition + ' / ' + q.questionSetSize + '</div>';
  }
  html += renderQuestionBody(q);
  if(q.resource){
    html += '<div class="resource">' + renderResource(q) + '</div>';
  }

  if(atype === "text" || q.options.length === 0){
    html += '<textarea id="answer-textarea" rows="3" placeholder="回答を入力してください" ' + (ans.submitted?"disabled":"") +
      ' style="width:100%;padding:12px;border-radius:10px;border:2px solid var(--line);font-size:15px;font-family:inherit;resize:vertical;">' + escapeHtml(ans.textValue||"") + '</textarea>';
    html += '<button class="btn primary" id="b-submit" ' + (normalizeAnswerText(ans.textValue||"")===""?"disabled":"") + ' style="margin-top:12px;">答えを確認</button>';
  } else if(atype === "multi"){
    html += '<div class="note">あてはまるものをすべて選んでください（複数選択可）。</div>';
    ans.displayOrder.forEach(function(i, pos){
      var cls = "opt";
      if(ans.selectedSet[i]) cls += " selected";
      html += '<button class="' + cls + '" data-i="' + i + '" ' + (ans.submitted ? "disabled" : "") + '>' +
        '<span class="label">' + letters(pos) + '.</span> ' + renderOption(q, i) + '</button>';
    });
    var anySelected = Object.keys(ans.selectedSet).some(function(k){ return ans.selectedSet[k]; });
    html += '<button class="btn primary" id="b-submit" ' + (anySelected ? "" : "disabled") + ' style="margin-top:6px;">回答する</button>';
  } else {
    ans.displayOrder.forEach(function(i, pos){
      var cls = "opt";
      if(ans.selectedIndex === i) cls += " selected";
      html += '<button class="' + cls + '" data-i="' + i + '" ' + (ans.submitted ? "disabled" : "") + '>' +
        '<span class="label">' + letters(pos) + '.</span> ' + renderOption(q, i) + '</button>';
    });
    html += '<button class="btn primary" id="b-submit" ' + (ans.selectedIndex===null ? "disabled" : "") + ' style="margin-top:6px;">回答する</button>';
  }
  html += '</div>';

  if(ans.submitted){
    html += renderAnswerBlock(q, ans, atype);
  }

  if(state.showQuizAbortMenu){
    html += renderModalOverlay(
      '<div style="font-weight:600;margin-bottom:8px;font-size:16px;">出題を中断してトップへ戻りますか？</div>' +
      '<div style="font-size:13px;color:var(--sub);margin-bottom:16px;">ここまでの解答結果は保存されます。</div>' +
      '<button class="btn primary" id="b-quiz-abort-yes">はい、トップへ戻る</button>' +
      '<button class="btn ghost" id="b-quiz-abort-cancel">キャンセル</button>'
    );
  }

  app.innerHTML = html;

  document.getElementById("back-top").onclick = function(){
    state.showQuizAbortMenu = true;
    renderQuiz();
  };
  var prevBtn = document.getElementById("b-prev-q");
  if(prevBtn){
    prevBtn.onclick = function(){
      state.idx--;
      renderQuiz();
    };
  }
  var abortYesBtn = document.getElementById("b-quiz-abort-yes");
  if(abortYesBtn) abortYesBtn.onclick = function(){ state.showQuizAbortMenu = false; go("top"); };
  var abortCancelBtn = document.getElementById("b-quiz-abort-cancel");
  if(abortCancelBtn) abortCancelBtn.onclick = function(){ state.showQuizAbortMenu = false; renderQuiz(); };

  if(!ans.submitted){
    if(atype === "text" || q.options.length === 0){
      var ta = document.getElementById("answer-textarea");
      if(ta) ta.oninput = function(){
        ans.textValue = ta.value;
        var subBtn2 = document.getElementById("b-submit");
        if(subBtn2){
          if(normalizeAnswerText(ans.textValue)==="") subBtn2.setAttribute("disabled","disabled");
          else subBtn2.removeAttribute("disabled");
        }
      };
    } else if(atype === "multi"){
      Array.prototype.forEach.call(app.querySelectorAll(".opt"), function(btn){
        btn.onclick = function(){
          var i = parseInt(btn.getAttribute("data-i"),10);
          ans.selectedSet[i] = !ans.selectedSet[i];
          renderQuiz();
        };
      });
    } else if(q.options.length>0){
      Array.prototype.forEach.call(app.querySelectorAll(".opt"), function(btn){
        btn.onclick = function(){
          ans.selectedIndex = parseInt(btn.getAttribute("data-i"),10);
          renderQuiz();
        };
      });
    }
    var subBtn = document.getElementById("b-submit");
    if(subBtn) subBtn.onclick = function(){ submitAnswer(q, ans, atype); };
  } else {
    bindAnswerBlockEvents(q, ans);
  }
}

function arraysEqualAsSets(a, b){
  if(a.length !== b.length) return false;
  var sa = a.slice().sort();
  var sb = b.slice().sort();
  for(var i=0;i<sa.length;i++){ if(sa[i]!==sb[i]) return false; }
  return true;
}

function submitAnswer(q, ans, atype){
  ans.submitted = true;
  ans.accExpanded = {};
  if(atype === "text"){
    ans.judged = gradeDescriptive(q, ans.textValue||"") ? "correct" : "incorrect";
    setStatus(q.id, ans.judged);
  } else if(atype === "multi"){
    var selected = Object.keys(ans.selectedSet).filter(function(k){ return ans.selectedSet[k]; }).map(function(k){ return parseInt(k,10); });
    ans.judged = arraysEqualAsSets(selected, q.answer) ? "correct" : "incorrect";
    setStatus(q.id, ans.judged);
    if(ans.judged === "incorrect"){
      q.answer.forEach(function(i){ ans.accExpanded[i] = true; });
      selected.forEach(function(i){ ans.accExpanded[i] = true; });
    }
  } else {
    ans.judged = (ans.selectedIndex === q.answer) ? "correct" : "incorrect";
    setStatus(q.id, ans.judged);
    if(ans.judged === "incorrect"){
      ans.accExpanded[q.answer] = true;
      ans.accExpanded[ans.selectedIndex] = true;
    }
  }
  renderQuiz();
}

function renderAnswerBlock(q, ans, atype){
  var html = "";
  if(atype === "text"){
    var isOKt = ans.judged === "correct";
    html += '<div class="result-banner ' + (isOKt?"ok":"ng") + '">' + (isOKt?"正解":"不正解") + '</div>';
    html += '<div class="answer-line">あなたの回答：<b>' + escapeHtml(ans.textValue||"") + '</b></div>';
    html += '<div class="answer-line">正解：<b>' + escapeHtml(q.answer) + '</b></div>';
  } else if(atype === "multi"){
    var isOK = ans.judged === "correct";
    html += '<div class="result-banner ' + (isOK?"ok":"ng") + '">' + (isOK?"正解":"不正解") + '</div>';
    var correctLabels = q.answer.map(function(i){ return letters(i) + '. ' + renderOption(q, i); });
    html += '<div class="answer-line">正解：<b>' + correctLabels.join(" ／ ") + '</b></div>';
  } else {
    var isOK2 = ans.judged === "correct";
    html += '<div class="result-banner ' + (isOK2?"ok":"ng") + '">' + (isOK2?"正解":"不正解") + '</div>';
    html += '<div class="answer-line">正解：<b>' + letters(q.answer) + '. ' + renderOption(q, q.answer) + '</b></div>';
  }
  if(q.explanation){
    html += '<div class="explain"><b>解説</b><br>' + escapeHtml(q.explanation) + '</div>';
  } else {
    html += '<div class="explain">解説データは現在登録されていません。</div>';
  }
  if(atype === "single" || atype === "multi"){
    var accCtxLearn = {
      idPrefix: "learn-acc",
      order: ans.displayOrder,
      isOpen: function(i){ return !!ans.accExpanded[i]; },
      isCorrect: function(i){ return atype==="multi" ? q.answer.indexOf(i)!==-1 : i===q.answer; },
      isUserPick: function(i){ return atype==="multi" ? !!ans.selectedSet[i] : i===ans.selectedIndex; }
    };
    html += renderChoiceAccordion(q, accCtxLearn);
  }
  var weakActive = isWeak(q.id);
  html += '<button class="fav-btn ' + (weakActive?"active":"") + '" id="b-fav">' +
    (weakActive ? "★ 苦手問題から削除" : "★ 苦手問題に登録") + '</button>';
  if(isFlashcardEligible(q)){
    html += '<button class="btn ghost" id="b-fc-add-from-q" style="border-color:#d9a441;">🗂 フラッシュカードに追加</button>';
  }
  html += '<button class="btn primary" id="b-next">' +
    (state.idx+1 < state.sessionIds.length ? "次の問題" : "結果を見る") + '</button>';
  return html;
}

function bindAnswerBlockEvents(q, ans){
  var selOk = document.getElementById("self-ok");
  var selNg = document.getElementById("self-ng");
  if(selOk) selOk.onclick = function(){ ans.judged="correct"; setStatus(q.id,"correct"); renderQuiz(); };
  if(selNg) selNg.onclick = function(){ ans.judged="incorrect"; setStatus(q.id,"incorrect"); renderQuiz(); };
  document.getElementById("b-fav").onclick = function(){
    toggleWeak(q.id);
    renderQuiz();
  };
  var fcAddBtn = document.getElementById("b-fc-add-from-q");
  if(fcAddBtn){
    fcAddBtn.onclick = function(){
      var card = createFlashcardFromQuestion(q);
      if(card){ showSyncToast("フラッシュカードに追加しました：" + card.front + " → " + card.back); }
      renderQuiz();
    };
  }
  document.getElementById("b-next").onclick = function(){
    if(state.idx+1 < state.sessionIds.length){
      state.idx++;
      renderQuiz();
    } else {
      finishLearningSession();
    }
  };
  if(ans.accExpanded){
    bindChoiceAccordionEvents(q, {
      idPrefix: "learn-acc",
      onToggle: function(i){ ans.accExpanded[i] = !ans.accExpanded[i]; renderQuiz(); },
      onOpenAll: function(){ q.options.forEach(function(o,i){ ans.accExpanded[i]=true; }); renderQuiz(); },
      onCloseAll: function(){ ans.accExpanded = {}; renderQuiz(); }
    });
  }
}

// 学習セッション終了処理（ブロック学習の場合は履歴を記録してから結果画面へ）
function finishLearningSession(){
  if(state.blockContext){
    var total = state.sessionIds.length;
    var correctC=0, incorrectC=0, answeredCount=0;
    for(var i=0;i<total;i++){
      var a = state.answers[i];
      if(!a || !a.submitted) continue;
      answeredCount++;
      if(a.judged==="correct") correctC++;
      else if(a.judged==="incorrect") incorrectC++;
    }
    addBlockAttempt(state.blockContext.blockId, {
      mode: "learn",
      total: total,
      answered: answeredCount,
      correct: correctC,
      incorrect: incorrectC,
      unanswered: total - answeredCount,
      accuracy: answeredCount>0 ? Math.round((correctC/answeredCount)*1000)/10 : 0,
      completedAt: new Date().toISOString()
    });
  }
  go("result");
}

// ---------- 結果画面 ----------
function renderResult(){
  var total = state.sessionIds.length;
  var correct=0, incorrect=0, ungraded=0;
  for(var i=0;i<total;i++){
    var a = state.answers[i];
    if(!a || !a.submitted){ ungraded++; continue; }
    if(a.judged==="correct") correct++;
    else if(a.judged==="incorrect") incorrect++;
    else ungraded++;
  }
  var judged = correct+incorrect;
  var rate = judged>0 ? Math.round((correct/judged)*100) : null;

  var html = '<h2>学習結果</h2>';
  html += '<div class="card">';
  html += '<div class="stat-grid">';
  html += '<div class="stat-box"><div class="num">' + total + '</div><div class="lbl">回答数</div></div>';
  html += '<div class="stat-box"><div class="num">' + (rate===null?"—":rate+"%") + '</div><div class="lbl">正答率</div></div>';
  html += '<div class="stat-box"><div class="num">' + correct + '</div><div class="lbl">正解</div></div>';
  html += '<div class="stat-box"><div class="num">' + incorrect + '</div><div class="lbl">不正解</div></div>';
  html += '</div>';
  if(ungraded>0){
    html += '<div class="note">正解データ未登録・未判定のため採点対象外：' + ungraded + '問</div>';
  }
  html += '</div>';

  if(state.blockContext){
    var bh = getBlockHistory(state.blockContext.blockId);
    var curAtt = bh[bh.length-1];
    var prevAtt = bh.length>1 ? bh[bh.length-2] : null;
    html += '<div class="card"><div style="font-weight:600;margin-bottom:8px;">' +
      escapeHtml(state.blockContext.category) + ' 第' + state.blockContext.blockNumber + 'ブロック' +
      (curAtt ? '（第' + curAtt.attemptNumber + '回目）' : '') + '</div>';
    if(prevAtt && curAtt){
      html += '<div style="font-size:14px;">前回：正解 ' + prevAtt.correct + '/' + prevAtt.answered + '（' + prevAtt.accuracy + '%）</div>';
      html += '<div style="font-size:14px;">今回：正解 ' + curAtt.correct + '/' + curAtt.answered + '（' + curAtt.accuracy + '%）</div>';
      var diff = Math.round((curAtt.accuracy - prevAtt.accuracy)*10)/10;
      html += '<div style="font-size:14px;margin-top:6px;font-weight:600;">改善：' + (diff>=0?"+":"") + diff + 'ポイント</div>';
    } else {
      html += '<div style="font-size:14px;">このブロックの初回記録です。</div>';
    }
    html += '<button class="btn primary" id="b-block-retry" style="margin-top:10px;">この' + state.sessionIds.length + '問をもう一度解く</button>';
    html += '<button class="btn" id="b-block-list">ブロック一覧へ</button>';
    html += '</div>';
  }

  html += '<button class="btn primary" id="b-retry">もう一度解く（同じ設定）</button>';
  html += '<button class="btn" id="b-wrong">間違えた問題を解く</button>';
  html += '<button class="btn" id="b-weak">苦手問題を解く</button>';
  html += '<button class="btn ghost" id="b-top">トップへ戻る</button>';
  app.innerHTML = html;

  document.getElementById("b-retry").onclick = function(){ beginQuiz(); };
  document.getElementById("b-wrong").onclick = function(){
    var ids = QUESTIONS.filter(function(q){ return statusMap[q.id]==="incorrect"; }).map(function(q){return q.id;});
    startScopeSelection(ids, "間違えた問題");
  };
  document.getElementById("b-weak").onclick = function(){
    var ids = QUESTIONS.filter(function(q){ return isWeak(q.id); }).map(function(q){return q.id;});
    startScopeSelection(ids, "苦手問題");
  };
  document.getElementById("b-top").onclick = function(){ go("top"); };

  var blockRetryBtn = document.getElementById("b-block-retry");
  if(blockRetryBtn){
    blockRetryBtn.onclick = function(){ beginQuiz(); }; // state.blockContext・targetIds・order等は維持されたまま同じブロックを再出題
  }
  var blockListBtn = document.getElementById("b-block-list");
  if(blockListBtn){
    blockListBtn.onclick = function(){ go("blockList", {blockListCategory: state.blockContext.category}); };
  }
}

    var created = 0;
    lines.forEach(function(line){
      var parts = line.indexOf(",") !== -1 ? line.split(",") : line.split("：");
      if(parts.length >= 2){
        var front = parts[0].trim();
        var back = parts.slice(1).join(parts.indexOf(",")!==-1?",":"：").trim();

      }
    });
    showSyncToast(created + "枚のカードを作成しました。");
    go("flashcardHome");
  };
}

// 科目・問題数・難易度に応じたテストセッション（testConfig/test）を構築する共通処理。
// startDifficulty を渡すことで、非言語開始時に言語の最終難易度を引き継げる。
function buildTestSession(subjectName, count, method, order, startDifficulty, preferFourTab){
  var pool = subjectQuestions(subjectName);
  var poolIds = pool.map(function(q){ return q.id; });
  var actualCount = Math.min(count, poolIds.length);
  var sequence = [];
  if(method === "normal"){
    var chunks = chunkIds(poolIds);
    if(order === "random"){ chunks = shuffle(chunks); }
    else { chunks = shuffle(chunks).sort(function(a,b){ return byId(a[0]).setDifficulty - byId(b[0]).setDifficulty; }); }
    sequence = flattenChunksToCount(chunks, actualCount);
    actualCount = sequence.length;
  }
  var cfg = {
    subject: subjectName, scope: "all", category: null, blockId: null,
    count: actualCount, timeSec: state.combined ? state.combined.timeSec : null,
    method: method, order: order, poolIds: poolIds, startDifficulty: startDifficulty
  };
  var t = {
    sequence: sequence, currentIndex: 0, currentQuestionId: null, usedIds: [],
    pendingQueue: [], answerHistory: [], pairBuffer: 0, currentDifficulty: startDifficulty,
    questionRecords: [], testStartTime: Date.now(), testEndTime: null, questionStartTime: null,
    warned5min: false, warned1min: false, finished: false, endReason: null,
    pendingSelection: null, pendingMultiSet: {}, pendingText: ""
  };
  state.testConfig = cfg;
  state.test = t;
  state.subject = subjectName;

  var firstQid;
  if(method === "normal"){
    firstQid = t.sequence[0];
  } else if(preferFourTab){
    firstQid = pickFourTabAwareFirstQuestion(cfg, t);
  } else {
    firstQid = pickNextTestQuestion();
  }
  return firstQid;
}

// 「4タブ」参考ロジック：言語の結果が高かった場合、4小問セットを非言語の
// 開始候補として優先する。存在しない場合は通常の適応型選択にフォールバックする。
function pickFourTabAwareFirstQuestion(cfg, t){
  var unused = cfg.poolIds.filter(function(id){ return t.usedIds.indexOf(id) === -1; });
  var chunks = chunkIds(unused);
  var fourTabChunks = chunks.filter(function(c){ return c.length === 4; })
    .filter(function(c){ return Math.abs(byId(c[0]).setDifficulty - t.currentDifficulty) <= 1; });
  if(fourTabChunks.length > 0){
    var chosen = shuffle(fourTabChunks)[0];
    if(chosen.length > 1) t.pendingQueue = chosen.slice(1);
    return chosen[0];
  }
  return pickNextTestQuestion();
}

function startCombinedTest(){
  var timeSec = combinedSetupDraft.timeSec;
  state.combined = {
    startTime: Date.now(),
    timeSec: timeSec,
    phase: "language",
    languageResult: null, nonverbalResult: null,
    languageConfig: null, nonverbalConfig: null,
    languageTest: null, nonverbalTest: null,
    draft: {languageCount: combinedSetupDraft.languageCount, nonverbalCount: combinedSetupDraft.nonverbalCount,

  };
  var firstQid = buildTestSession("language", combinedSetupDraft.languageCount, combinedSetupDraft.method, combinedSetupDraft.order, 4, false);

}

// =====================================================================
// ==================== テストモード（SPIテストセンター風） ====================
// =====================================================================
// 注：本テストモードは実際のSPIテストセンターの内部アルゴリズムを再現した
// ものではなく、学習用の簡易適応型テストシステムです。
// 難易度(difficulty)は出典データに無いため、カテゴリーや語彙の希少性などから
// 本アプリが推定した参考値であり、正式な難易度データではありません。

// テスト対象は全問題形式（単一選択・複数選択・記述式）とする
var TEST_QUESTIONS = QUESTIONS.slice();
function getTestCategoriesForSubject(subject){
  var seen = {};
  var order = [];
  TEST_QUESTIONS.forEach(function(q){
    if(q.subject !== subject) return;
    if(!seen[q.category]){ seen[q.category]=0; order.push(q.category); }
    seen[q.category]++;
  });
  return order.map(function(c){ return {name:c, count:seen[c]}; });
}
function byIdTest(id){ return TEST_QUESTIONS.find(function(q){ return q.id === id; }); }

// 記述式の正規化・正誤判定（完全一致のみ正解。前後空白の削除・連続空白の整理・改行統一のみ行う）
function normalizeAnswerText(s){
  if(typeof s !== "string") return "";
  return s.replace(/\r\n|\r/g, "\n").trim().replace(/[ \t]+/g, " ");
}
function gradeDescriptive(q, userText){
  var norm = normalizeAnswerText(userText);
  if(norm === "") return false;
  var candidates = [q.answer].concat(q.acceptedAnswers || []);
  return candidates.some(function(c){ return normalizeAnswerText(c) === norm; });
}

var TEST_COUNT_OPTIONS = [10,20,30,40,50];
var TEST_TIME_OPTIONS = [
  {label:"5分", sec:300}, {label:"10分", sec:600}, {label:"15分", sec:900},
  {label:"20分", sec:1200}, {label:"30分", sec:1800}, {label:"45分", sec:2700},
  {label:"60分", sec:3600}, {label:"制限時間なし", sec:null}
];

var LS_TEST_STATE = "jq_test_state_v1";
var testDetailExpanded = {}; // recordOrder -> {optionIndex: bool} 「問題ごとの結果」画面のアコーディオン開閉状態
function saveTestState(){
  if(state.combined){
    state.combined[state.combined.phase + "Config"] = state.testConfig;
    state.combined[state.combined.phase + "Test"] = state.test;
    saveCombinedState();
    return;
  }
  if(!state.test) return;
  try{ localStorage.setItem(LS_TEST_STATE, JSON.stringify({config: state.testConfig, test: state.test})); }catch(e){}
}
function loadTestState(){
  try{
    var raw = localStorage.getItem(LS_TEST_STATE);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function clearTestState(){ try{ localStorage.removeItem(LS_TEST_STATE); }catch(e){} }

var testTimerInterval = null;
function stopTestTimer(){ if(testTimerInterval){ clearInterval(testTimerInterval); testTimerInterval=null; } }
function startTestTimer(){ stopTestTimer(); testTimerInterval = setInterval(tickTestTimer, 1000); tickTestTimer(); }

function getEffectiveTimeSec(cfg){
  if(state.combined) return state.combined.timeSec;
  return cfg ? cfg.timeSec : null;
}

function getRemainingSec(){
  if(state.combined && state.combined.timeSec !== null && state.combined.startTime){
    var elapsedC = (Date.now() - state.combined.startTime) / 1000;
    return state.combined.timeSec - elapsedC;
  }
  if(state.combined && state.combined.timeSec === null) return null;
  var t = state.test, cfg = state.testConfig;
  if(!t || !cfg || cfg.timeSec === null) return null;
  var elapsed = (Date.now() - t.testStartTime) / 1000;
  return cfg.timeSec - elapsed;
}
function formatRemaining(sec){
  if(sec === null) return "制限時間なし";
  sec = Math.max(0, Math.ceil(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return (m<10?"0"+m:m) + ":" + (s<10?"0"+s:s);
}
function formatDuration(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return m + "分" + (s<10?"0"+s:s) + "秒";
}
// 問題ごとの解答時間表示用：60秒未満は「18秒」、60秒以上は「1分12秒」のように表示する
function formatAnswerTime(sec){
  sec = Math.max(0, Math.round(sec));
  if(sec < 60) return sec + "秒";
  var m = Math.floor(sec/60), s = sec%60;
  return m + "分" + (s<10?"0"+s:s) + "秒";
}
var PER_Q_TIME_LIMIT = 150;

function renderTimerRings(remaining, timeSec, currentIndex, qNum, displayTotal){
  var R_OUT = 52, R_IN = 38, CX = 60, CY = 60, SW = 8;
  var C_OUT = 2 * Math.PI * R_OUT;
  var C_IN = 2 * Math.PI * R_IN;
  var timeFrac = (timeSec === null) ? 1 : Math.max(0, Math.min(1, remaining / timeSec));
  var qFrac = displayTotal > 0 ? Math.max(0, Math.min(1, currentIndex / displayTotal)) : 0;
  var outOffset = C_OUT * (1 - timeFrac);
  var inOffset = C_IN * (1 - qFrac);
  var outColor = (timeSec!==null && remaining<=60) ? "var(--ng)" : (timeSec!==null && remaining<=300) ? "var(--warn)" : "var(--accent)";
  var centerLine2 = (timeSec === null) ? "制限時間なし" : formatRemaining(remaining);
  return '<svg id="ring-timer-svg" viewBox="0 0 120 120" style="width:140px;height:140px;display:block;margin:0 auto 6px;">' +
    '<circle cx="'+CX+'" cy="'+CY+'" r="'+R_OUT+'" fill="none" stroke="var(--line)" stroke-width="'+SW+'"/>' +
    '<circle id="ring-outer" cx="'+CX+'" cy="'+CY+'" r="'+R_OUT+'" fill="none" stroke="'+outColor+'" stroke-width="'+SW+'" stroke-linecap="round" ' +
      'stroke-dasharray="'+C_OUT.toFixed(2)+'" stroke-dashoffset="'+outOffset.toFixed(2)+'" transform="rotate(-90 '+CX+' '+CY+')"/>' +
    '<circle cx="'+CX+'" cy="'+CY+'" r="'+R_IN+'" fill="none" stroke="var(--line)" stroke-width="'+SW+'"/>' +
    '<circle id="ring-inner" cx="'+CX+'" cy="'+CY+'" r="'+R_IN+'" fill="none" stroke="#d9a441" stroke-width="'+SW+'" stroke-linecap="round" ' +
      'stroke-dasharray="'+C_IN.toFixed(2)+'" stroke-dashoffset="'+inOffset.toFixed(2)+'" transform="rotate(-90 '+CX+' '+CY+')"/>' +
    '<text id="ring-center-1" x="60" y="56" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink)">' + qNum + ' / ' + displayTotal + '</text>' +
    '<text id="ring-center-2" x="60" y="75" text-anchor="middle" font-size="11" fill="var(--sub)">' + escapeHtml(centerLine2) + '</text>' +
    '</svg>' +
    '<div id="test-timer-text" style="text-align:center;font-size:12px;color:var(--sub);margin-bottom:10px;">残り時間 ' + escapeHtml(centerLine2) + '　／　問題 ' + qNum + ' / ' + displayTotal + '</div>';
}

function renderPerQuestionBar(elapsedSec){
  var frac = Math.min(1, elapsedSec / PER_Q_TIME_LIMIT);
  var exceeded = elapsedSec > PER_Q_TIME_LIMIT;
  var pct = Math.round(frac * 100);
  var m = Math.floor(elapsedSec/60), s = Math.floor(elapsedSec%60);
  var text = (m<10?"0"+m:m) + ":" + (s<10?"0"+s:s) + " / 2:30";
  var html = '<div style="margin:4px 0 14px;">';
  html += '<div style="font-size:11px;color:var(--sub);margin-bottom:4px;">1問の目安時間' +
    (exceeded ? '　<span id="per-q-warn" style="color:var(--ng);">⚠ 目安時間を超えています</span>' : '<span id="per-q-warn"></span>') + '</div>';
  html += '<div style="background:var(--line);border-radius:6px;height:10px;overflow:hidden;">' +
    '<div id="per-q-bar-fill" style="height:100%;width:' + pct + '%;background:' + (exceeded?"var(--ng)":"var(--accent)") + ';"></div></div>';
  html += '<div id="per-q-bar-text" style="font-size:12px;color:' + (exceeded?"var(--ng)":"var(--sub)") + ';margin-top:3px;text-align:right;">' + text + '</div>';
  html += '</div>';
  return html;
}

function tickTestTimer(){
  if(!state.test || state.test.finished){ stopTestTimer(); return; }
  var remaining = getRemainingSec();
  if(remaining !== null && remaining <= 0){
    stopTestTimer();
    finishTest("timeout");
    return;
  }
  var cfg = state.testConfig, t = state.test;

  // 円形タイマー（外側=試験全体の残り時間、内側=回答済み問題進捗）の更新
  var outerCircle = document.getElementById("ring-outer");
  if(outerCircle && cfg){
    var R_OUT = 52, C_OUT = 2*Math.PI*R_OUT;
    var effTimeSec = getEffectiveTimeSec(cfg);
    var timeFrac = (effTimeSec === null) ? 1 : Math.max(0, Math.min(1, remaining / effTimeSec));
    outerCircle.setAttribute("stroke-dashoffset", (C_OUT * (1 - timeFrac)).toFixed(2));
    outerCircle.setAttribute("stroke", (effTimeSec!==null && remaining<=60) ? "var(--ng)" : (effTimeSec!==null && remaining<=300) ? "var(--warn)" : "var(--accent)");
  }
  var centerLine2El = document.getElementById("ring-center-2");
  if(centerLine2El) centerLine2El.textContent = (getEffectiveTimeSec(cfg) === null) ? "制限時間なし" : formatRemaining(remaining);
  var timerTextEl = document.getElementById("test-timer-text");
  if(timerTextEl && cfg){
    var qNumNow = t.currentIndex + 1;
    var displayTotalNow = Math.max(cfg.count, qNumNow);
    timerTextEl.textContent = "残り時間 " + (getEffectiveTimeSec(cfg)===null?"制限時間なし":formatRemaining(remaining)) + "　／　問題 " + qNumNow + " / " + displayTotalNow;
  }

  // 1問ごとの目安タイマー（150秒）の更新
  if(t.questionStartTime){
    var elapsed = (Date.now() - t.questionStartTime) / 1000;
    var fillEl = document.getElementById("per-q-bar-fill");
    var textEl = document.getElementById("per-q-bar-text");
    var warnEl = document.getElementById("per-q-warn");
    var exceeded = elapsed > PER_Q_TIME_LIMIT;
    if(fillEl){
      fillEl.style.width = Math.min(100, Math.round((elapsed/PER_Q_TIME_LIMIT)*100)) + "%";
      fillEl.style.background = exceeded ? "var(--ng)" : "var(--accent)";
    }
    if(textEl){
      var m2 = Math.floor(elapsed/60), s2 = Math.floor(elapsed%60);
      textEl.textContent = (m2<10?"0"+m2:m2) + ":" + (s2<10?"0"+s2:s2) + " / 2:30";
      textEl.style.color = exceeded ? "var(--ng)" : "var(--sub)";
    }
    if(warnEl) warnEl.textContent = exceeded ? "⚠ 目安時間を超えています" : "";
  }

  var warnBanner = document.getElementById("test-warn-banner");
  if(warnBanner){
    if(remaining!==null && remaining<=60){ warnBanner.textContent = "残り1分です"; warnBanner.style.display = "block"; }
    else if(remaining!==null && remaining<=300){ warnBanner.textContent = "残り5分です"; warnBanner.style.display = "block"; }
    else { warnBanner.style.display = "none"; }
  }
}

// ---------- テスト設定画面 ----------
var testSetupDraft = {
  scope: "all", category: null, block: null,
  count: 20, customCount: null,
  timeSec: 900, customTimeMin: null,
  method: "normal", order: "random",
  problemSource: "official" // "official" | "reference" | "all"（言語のみ有効。カテゴリー指定時は無視される）
};

function currentTestPool(){
  var base = TEST_QUESTIONS.filter(function(q){ return q.subject === state.subject; });
  if(testSetupDraft.scope === "category" && testSetupDraft.category){
    if(testSetupDraft.block){
      var b = getBlock(testSetupDraft.block);
      if(b) return base.filter(function(q){ return b.ids.indexOf(q.id) !== -1; });
    }
    return base.filter(function(q){ return q.category===testSetupDraft.category; });
  }
  // scope==="all"：問題群（旧問題/参考問題/すべて）で絞り込む
  var ps = testSetupDraft.problemSource || "official";
  base = base.filter(function(q){
    var qps = q.problemSource || "official";
    if(ps === "all") return qps === "official" || qps === "reference";
    return qps === ps;
  });
  return base;
}
function resolveTestCount(poolSize){
  var c = testSetupDraft.count;
  if(c === "custom") c = testSetupDraft.customCount;
  if(!c || c<1) return null;
  return Math.min(c, poolSize);
}
function resolveTestTimeSec(){
  var t = testSetupDraft.timeSec;
  if(t === "custom"){
    if(!testSetupDraft.customTimeMin || testSetupDraft.customTimeMin<1) return undefined;
    return testSetupDraft.customTimeMin*60;
  }
  return t;
}

  });
  html += '<span class="chip ' + (testSetupDraft.count==="custom"?"active":"") + '" data-count="custom">カスタム</span>';
  html += '</div>';
  if(testSetupDraft.count === "custom"){
    html += '<div style="margin-top:10px;"><input type="number" id="custom-count" min="1" max="' + poolSize + '" value="' + (testSetupDraft.customCount||"") + '" placeholder="問題数を入力" style="padding:10px;border-radius:8px;border:1px solid var(--line);width:140px;font-size:15px;"></div>';
  }

  html += '<div class="card"><div style="font-weight:600;margin-bottom:10px;">制限時間</div><div class="row" id="time-row">';
  TEST_TIME_OPTIONS.forEach(function(t){

    html += '<span class="chip ' + (testSetupDraft.timeSec===t.sec?"active":"") + '" data-time="' + val + '">' + t.label + '</span>';

  html += '<span class="chip ' + (testSetupDraft.timeSec==="custom"?"active":"") + '" data-time="custom">カスタム</span>';

    html += '<div style="margin-top:10px;"><input type="number" id="custom-time" min="1" value="' + (testSetupDraft.customTimeMin||"") + '" placeholder="分数を入力" style="padding:10px;border-radius:8px;border:1px solid var(--line);width:140px;font-size:15px;"> 分</div>';

  html += '<div class="card"><div style="font-weight:600;margin-bottom:10px;">出題方式</div><div class="row" id="method-row">';

      renderTestSetup();

    chip.onclick = function(){ testSetupDraft.method = chip.getAttribute("data-method"); renderTestSetup(); };
  });
  var orderRow = document.getElementById("order-row");
  if(orderRow){
    Array.prototype.forEach.call(orderRow.querySelectorAll(".chip"), function(chip){
      chip.onclick = function(){ testSetupDraft.order = chip.getAttribute("data-order"); renderTestSetup(); };
    });

  document.getElementById("b-test-start").onclick = function(){ startTest(); };

function updateTestSummary(){
  var el = document.getElementById("test-summary");
  if(!el) return;
  var pool = currentTestPool();
  var count = resolveTestCount(pool.length);
  var timeSec = resolveTestTimeSec();
  var startBtn = document.getElementById("b-test-start");
  if(!count || timeSec===undefined || (testSetupDraft.scope==="category" && !testSetupDraft.category)){
    el.innerHTML = "";
    if(startBtn) startBtn.setAttribute("disabled","disabled");
    return;
  }
  if(startBtn) startBtn.removeAttribute("disabled");
  var targetLabel = testSetupDraft.scope==="all" ? "全問題" : escapeHtml(testSetupDraft.category||"");
  if(testSetupDraft.scope==="category" && testSetupDraft.block){
    var bInfo = getBlock(testSetupDraft.block);
    if(bInfo) targetLabel += " 第" + bInfo.blockNumber + "ブロック";
  }
  el.innerHTML = '<div class="config-summary">' +
    '<div><b>【テスト設定】</b></div>' +
    '<div>対象：' + targetLabel + '（' + pool.length + '問）</div>' +
    '<div>問題数：' + count + '問</div>' +
    '<div>制限時間：' + (timeSec===null ? "制限時間なし" : Math.round(timeSec/60)+"分") + '</div>' +
    '<div>出題方式：' + (testSetupDraft.method==="adaptive"?"適応型":"通常") + '</div>' +
    (testSetupDraft.method==="normal" ? '<div>出題順：' + (testSetupDraft.order==="random"?"ランダム":"難易度順") + '</div>' : '') +
    '</div>';
}

// ---------- テスト実行 ----------
function getCurrentTestQuestion(){ return byIdTest(state.test.currentQuestionId); }

function beginTestQuestion(qid){
  var t = state.test;
  t.currentQuestionId = qid;
  t.usedIds.push(qid);
  t.questionStartTime = Date.now();
  t.pendingSelection = null;
  t.pendingMultiSet = {};
  t.pendingText = "";
  t.currentDisplayOrder = computeDisplayOrder(byId(qid), isShuffleEnabled());
  state.showAbortMenu = false;
}

// 組問題のチャンク（difficultyは setDifficulty を使用）を目標difficultyに近い順に並べる
// 言語のみ：開始直後(難易度が低いあたり)は語彙・二語関係・空欄補充などを優先し、
// 難易度が上がるほど読解（長文）を優先しやすくする参考バイアス。非言語には適用しない。
var LANG_STANDARD_CATEGORIES = {"対義語・類推":1,"語句":1,"穴埋め":1};
function languageCategoryBias(category, target){
  if(category === "読解"){
    if(target <= 4) return 1.5;   // 低難度帯では読解を少し遠ざける
    if(target === 5) return 0;
    return -1.5;                  // 高難度帯では読解を優先しやすくする
  }
  if(category === "文整序"){
    if(target <= 4) return 1.0;   // 長文ほどではないが、開始直後はやや出にくくする
    return 0;
  }
  if(LANG_STANDARD_CATEGORIES[category]){
    if(target <= 4) return -0.5;  // 低難度帯では語彙・二語関係系をわずかに優先
  }
  return 0;
}

function nearestChunkByDifficulty(chunks, target){
  var biasOn = (state.subject === "language");
  var best = null, bestScore = Infinity;
  chunks.forEach(function(chunk){
    var q0 = byId(chunk[0]);
    var score = Math.abs(q0.setDifficulty - target);
    if(biasOn) score += languageCategoryBias(q0.category, target);
    score += Math.random() * 0.01; // 同点内のランダムなタイブレーク
    if(score < bestScore){ bestScore = score; best = chunk; }
  });
  return best;
}

function pickNextTestQuestion(){
  var cfg = state.testConfig, t = state.test;
  // 組問題の残り小問がキューにあれば、必ずそれを先に出題する（組問題を分断しない）
  if(t.pendingQueue && t.pendingQueue.length){
    return t.pendingQueue.shift();
  }
  if(cfg.method === "normal"){
    return (t.currentIndex < t.sequence.length) ? t.sequence[t.currentIndex] : null;
  }
  var unused = cfg.poolIds.filter(function(id){ return t.usedIds.indexOf(id) === -1; });
  if(unused.length === 0) return null;
  var chunks = chunkIds(unused);
  var chosenChunk = nearestChunkByDifficulty(chunks, t.currentDifficulty);
  if(!chosenChunk) return null;
  if(chosenChunk.length > 1){ t.pendingQueue = chosenChunk.slice(1); }
  return chosenChunk[0];
}

function startTest(){
  var pool = currentTestPool();
  var count = resolveTestCount(pool.length);
  var timeSec = resolveTestTimeSec();
  if(!count || timeSec===undefined) return;

  var sequence = [];
  if(testSetupDraft.method === "normal"){
    var poolIds = pool.map(function(q){ return q.id; });
    var chunks = chunkIds(poolIds);
    if(testSetupDraft.order === "random"){
      chunks = shuffle(chunks);
    } else {
      chunks = shuffle(chunks).sort(function(a,b){ return byId(a[0]).setDifficulty - byId(b[0]).setDifficulty; });
    }
    sequence = flattenChunksToCount(chunks, count);
    count = sequence.length; // 組問題を分断しないため、実際の出題数で確定する
  }

  state.testConfig = {
    subject: state.subject,
    scope: testSetupDraft.scope,
    category: testSetupDraft.category,
    blockId: (testSetupDraft.scope==="category") ? testSetupDraft.block : null,
    count: count,
    timeSec: timeSec,
    method: testSetupDraft.method,
    order: testSetupDraft.order,
    poolIds: pool.map(function(q){ return q.id; })
  };
  state.test = {
    sequence: sequence,
    currentIndex: 0,
    currentQuestionId: null,
    usedIds: [],
    pendingQueue: [],
    answerHistory: [],
    pairBuffer: 0,
    currentDifficulty: 4,
    questionRecords: [],
    testStartTime: Date.now(),
    testEndTime: null,
    questionStartTime: null,
    warned5min: false,
    warned1min: false,
    finished: false,
    endReason: null,
    pendingSelection: null,
    pendingMultiSet: {},
    pendingText: ""
  };

  var firstQid = (state.testConfig.method === "normal") ? state.test.sequence[0] : pickNextTestQuestion();
  if(firstQid === undefined || firstQid === null){
    alert("出題できる問題がありません。設定を見直してください。");
    return;
  }
  beginTestQuestion(firstQid);
  saveTestState();
  go("testRunning");
  startTestTimer();
}

function submitTestAnswer(){
  var t = state.test, cfg = state.testConfig;
  var q = getCurrentTestQuestion();
  var atype = q.answerType || "single";
  var answered = false, correct = false, userAnswer = null;

  if(atype === "text" || q.options.length === 0){
    var txt = t.pendingText || "";
    if(normalizeAnswerText(txt) !== ""){
      answered = true;
      correct = gradeDescriptive(q, txt);
      userAnswer = txt;
    }
  } else if(atype === "multi"){
    var selected = Object.keys(t.pendingMultiSet).filter(function(k){ return t.pendingMultiSet[k]; }).map(function(k){ return parseInt(k,10); });
    if(selected.length > 0){
      answered = true;
      correct = arraysEqualAsSets(selected, q.answer);
      userAnswer = selected;
    }
  } else {
    if(t.pendingSelection !== null){
      answered = true;
      correct = (t.pendingSelection === q.answer);
      userAnswer = t.pendingSelection;
    }
  }

  var timeSec = (Date.now() - t.questionStartTime) / 1000;
  var PER_Q_LIMIT = 150;
  if(answered){
    t.questionRecords.push({
      questionId: q.id, questionType: atype, difficulty: q.difficulty,
      userAnswer: userAnswer, correct: correct, answered: true,
      answerTime: timeSec, order: t.questionRecords.length+1,
      timeLimitPerQuestion: PER_Q_LIMIT, exceededTimeLimit: timeSec > PER_Q_LIMIT,
      isLongReading: !!q.isLongReading, questionSetId: q.questionSetId
    });
  }
  // 適応型の難易度判定は「未回答=不正解扱い」として2問ルールに組み込む
  t.answerHistory.push(answered && correct);
  t.pairBuffer++;
  if(t.pairBuffer === 2){
    var last2 = t.answerHistory.slice(-2);
    if(last2[0] && last2[1]) t.currentDifficulty = Math.min(7, t.currentDifficulty+1);
    else if(!last2[0] && !last2[1]) t.currentDifficulty = Math.max(1, t.currentDifficulty-1);
    t.pairBuffer = 0;
  }
  t.currentIndex++;

  if(t.currentIndex >= cfg.count && (!t.pendingQueue || t.pendingQueue.length===0)){
    finishTest("completed");
    return;
  }
  var nextQid = (cfg.method === "normal") ? t.sequence[t.currentIndex] : pickNextTestQuestion();
  if(nextQid === undefined || nextQid === null){
    finishTest("exhausted");
    return;
  }
  beginTestQuestion(nextQid);
  saveTestState();
  renderTestRunning();
}

function finishTest(reason){
  stopTestTimer();
  var t = state.test, cfg = state.testConfig;
  if(!t || t.finished) return;
  t.finished = true;
  t.endReason = reason;
  t.status = (reason === "timeout") ? "timeout" : "completed";
  t.testEndTime = Date.now();
  clearTestState();
  if(cfg.blockId){
    var totalDelivered = t.usedIds.length;
    var answeredCount = t.questionRecords.length;
    var correctCount = t.questionRecords.filter(function(r){ return r.correct; }).length;
    addBlockAttempt(cfg.blockId, {
      mode: "test",
      total: totalDelivered,
      answered: answeredCount,
      correct: correctCount,
      incorrect: answeredCount - correctCount,
      unanswered: totalDelivered - answeredCount,
      accuracy: answeredCount>0 ? Math.round((correctCount/answeredCount)*1000)/10 : 0,
      totalTime: Math.round((t.testEndTime - t.testStartTime)/1000),
      startDifficulty: 4,
      finalDifficulty: t.currentDifficulty,
      completedAt: new Date().toISOString()
    });
  }

  // 言語分野 7段階評価（アプリ独自の推定指標）。言語のテストの場合のみ算出する。
  if(cfg.subject === "language"){
    var evAnswered = t.questionRecords.length;
    var evCorrect = t.questionRecords.filter(function(r){ return r.correct; }).length;
    var evAccuracy = evAnswered>0 ? Math.round((evCorrect/evAnswered)*1000)/10 : 0;
    var fmtStats = computeTestFormatStats(t.questionRecords);
    t.languageEvaluation = computeLanguageEvaluation(evAccuracy, fmtStats);
    t.languageEvalStats = fmtStats;
    t.languageEvalAccuracy = evAccuracy;
    addLangEvalRecord({
      languageEvaluation: t.languageEvaluation,
      accuracy: evAccuracy,
      longReadingCount: fmtStats.longReadingCount,
      checkboxCount: fmtStats.checkboxCount,
      extractionCount: fmtStats.extractionCount,
      extractionWithLimitCount: fmtStats.extractionWithLimitCount,
      extractionWithoutLimitCount: fmtStats.extractionWithoutLimitCount,
      completedAt: new Date().toISOString()
    });
  }

  // 非言語 推定評価（アプリ独自の指標）。非言語のテストの場合のみ算出する。
  if(cfg.subject === "nonverbal"){
    var nvAnswered = t.questionRecords.length;
    var nvCorrect = t.questionRecords.filter(function(r){ return r.correct; }).length;
    var nvAccuracy = nvAnswered>0 ? Math.round((nvCorrect/nvAnswered)*1000)/10 : 0;
    var nvFmt = computeNonverbalFormatStats(t.questionRecords);
    var nvStart = cfg.startDifficulty !== undefined ? cfg.startDifficulty : 4;
    t.nonverbalEvaluation = computeNonverbalEvaluation(nvAccuracy, nvStart, t.currentDifficulty, nvFmt);
    t.nonverbalEvalStats = nvFmt;
    t.nonverbalEvalAccuracy = nvAccuracy;
    addNonverbalEvalRecord({
      nonverbalEvaluation: t.nonverbalEvaluation,
      accuracy: nvAccuracy,
      answeredCount: nvAnswered,
      startDifficulty: nvStart,
      finalDifficulty: t.currentDifficulty,
      highDifficultyCorrect: nvFmt.highDifficultyCorrect, highDifficultyAnswered: nvFmt.highDifficultyAnswered,
      multiCorrect: nvFmt.multiCorrect, multiAnswered: nvFmt.multiAnswered,
      fourTabCorrect: nvFmt.fourTabCorrect, fourTabAnswered: nvFmt.fourTabAnswered,
      completedAt: new Date().toISOString()
    });
  }

  // ---- Supabaseへテスト結果・回答履歴を同期（ログイン時のみ） ----
  syncTestSession(cfg.subject, cfg.method, cfg, t);

  // ---- 総合テスト（言語＋非言語）の場合は分岐する ----
  if(state.combined){
    var summary = summarizeTestSession(t, cfg);
    if(state.combined.phase === "language"){
      state.combined.languageResult = summary;
      state.combined.languageConfig = cfg;
      state.combined.languageTest = t;
      if(reason === "timeout" || reason === "manual"){
        // 総合の制限時間切れ、またはユーザーが途中終了した場合は非言語を開始せず総合結果へ
        state.combined.nonverbalResult = null;
        state.combined.finished = true;
        saveCombinedState();
        go("combinedResult");
        return;
      }
      saveCombinedState();
      go("combinedTransition");
      return;
    } else if(state.combined.phase === "nonverbal"){
      state.combined.nonverbalResult = summary;
      state.combined.nonverbalConfig = cfg;
      state.combined.nonverbalTest = t;
      state.combined.finished = true;
      saveCombinedState();
      go("combinedResult");
      return;
    }
  }

  go("testResult");
}

function summarizeTestSession(t, cfg){
  var total = t.usedIds.length;
  var answered = t.questionRecords.length;
  var correct = t.questionRecords.filter(function(r){ return r.correct; }).length;
  var incorrect = answered - correct;
  var unanswered = total - answered;
  var accuracy = answered>0 ? Math.round((correct/answered)*1000)/10 : 0;
  var totalTimeSec = Math.round((t.testEndTime - t.testStartTime)/1000);
  return {
    questionCount: total, answered: answered, correct: correct, incorrect: incorrect,
    unanswered: unanswered, accuracy: accuracy,
    startDifficulty: cfg.startDifficulty !== undefined ? cfg.startDifficulty : 4,
    finalDifficulty: t.currentDifficulty, totalTime: totalTimeSec,
    endReason: t.endReason,
    languageEvaluation: t.languageEvaluation || null,
    nonverbalEvaluation: t.nonverbalEvaluation || null
  };
}

// ---------- テスト中断（aborted）処理 ----------
// 中断ボタン押下時点の現在の問題の回答を確定して保存する（未回答ならそのまま未回答）。
function commitPendingAsFinal(){
  var t = state.test;
  var q = getCurrentTestQuestion();
  if(!q || !t.questionStartTime) return false;
  var atype = q.answerType || "single";
  var answered = false, correct = false, userAnswer = null;
  if(atype === "text" || q.options.length === 0){
    var txt = t.pendingText || "";
    if(normalizeAnswerText(txt) !== ""){ answered = true; correct = gradeDescriptive(q, txt); userAnswer = txt; }
  } else if(atype === "multi"){
    var selected = Object.keys(t.pendingMultiSet).filter(function(k){ return t.pendingMultiSet[k]; }).map(function(k){ return parseInt(k,10); });
    if(selected.length > 0){ answered = true; correct = arraysEqualAsSets(selected, q.answer); userAnswer = selected; }
  } else {
    if(t.pendingSelection !== null){ answered = true; correct = (t.pendingSelection === q.answer); userAnswer = t.pendingSelection; }
  }
  var now = Date.now();
  var timeSec = (now - t.questionStartTime) / 1000;
  if(answered){
    t.questionRecords.push({
      questionId: q.id, questionType: atype, difficulty: q.difficulty,
      userAnswer: userAnswer, correct: correct, answered: true,
      answerTime: timeSec, order: t.questionRecords.length+1,
      timeLimitPerQuestion: PER_Q_TIME_LIMIT, exceededTimeLimit: timeSec > PER_Q_TIME_LIMIT,
      isLongReading: !!q.isLongReading, questionSetId: q.questionSetId
    });
  }
  return answered;
}

// action: "save"（回答を保存して中断） | "view"（現段階の結果を見る）
function abortTest(action){
  var t = state.test, cfg = state.testConfig;
  if(!t || t.finished) return;
  var now = Date.now();
  commitPendingAsFinal();
  stopTestTimer();
  t.status = "aborted";
  t.finished = true;
  t.endReason = "aborted";
  t.testEndTime = now;
  state.showAbortMenu = false;
  clearTestState();
  syncTestSession(cfg.subject, cfg.method, cfg, t);

  if(state.combined){
    var summary = summarizeTestSession(t, cfg);
    summary.status = "aborted";
    if(state.combined.phase === "language"){
      state.combined.languageResult = summary;
      state.combined.languageConfig = cfg;
      state.combined.languageTest = t;
      state.combined.nonverbalResult = null;
    } else {
      state.combined.nonverbalResult = summary;
      state.combined.nonverbalConfig = cfg;
      state.combined.nonverbalTest = t;
    }
    state.combined.finished = true;
    state.combined.status = "aborted";
    clearCombinedState();
  }

  if(action === "save"){
    if(state.combined){ state.combined = null; go("home"); }
    else { go("top"); }
    return;
  }
  // "view"：中断時点の暫定結果を表示（status は aborted のまま。completedにはしない）
  go("testAbortedResult");
}

function renderTestAbortedResult(){
  var t = state.test, cfg = state.testConfig;
  var total = t.usedIds.length;
  var answered = t.questionRecords.length;
  var correct = t.questionRecords.filter(function(r){ return r.correct; }).length;
  var incorrect = answered - correct;
  var unanswered = total - answered;
  var accuracy = answered>0 ? Math.round((correct/answered)*1000)/10 : 0;
  var elapsedSec = (t.testEndTime - t.testStartTime) / 1000;
  var avgTime = answered>0 ? (t.questionRecords.reduce(function(s,r){return s+r.answerTime;},0)/answered) : 0;

  var html = '<div class="note" style="background:#fff3cd;padding:10px 12px;border-radius:8px;margin-bottom:14px;">' +
    'この結果はテストを中断した時点での暫定結果です。テスト完了時の結果とは異なります。</div>';
  html += '<h2>中断時点の暫定結果</h2>';
  html += '<div class="card"><div class="stat-grid">';
  html += statBox(answered, "回答済み");
  html += statBox(correct, "正解");
  html += statBox(incorrect, "不正解");
  html += statBox(unanswered, "未回答");
  html += statBox(accuracy+"%", "現在の正答率");
  html += statBox(t.currentDifficulty, "現在の難易度");
  html += '</div>';
  html += '<div style="margin-top:10px;font-size:14px;color:var(--sub);">経過時間：' + formatDuration(elapsedSec) +
    ' ／ 平均回答時間：' + formatAnswerTime(avgTime) + ' ／ 開始難易度：' + (cfg.startDifficulty!==undefined?cfg.startDifficulty:4) + '</div>';
  html += '</div>';

  if(t.questionRecords.length){
    html += '<div class="card"><div style="font-weight:600;margin-bottom:8px;">現在までの問題別結果</div>';
    t.questionRecords.forEach(function(r){
      html += '<div style="font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);">問題' + r.order +
        '　難易度' + r.difficulty + '　' + (r.correct?'<span style="color:var(--ok);">正解</span>':'<span style="color:var(--ng);">不正解</span>') +
        '　' + formatAnswerTime(r.answerTime) + '</div>';
    });
    html += '</div>';
  }

  html += '<button class="btn primary" id="b-abortres-home">ホームへ戻る</button>';
  html += '<button class="btn ghost" id="b-abortres-select">テスト選択へ戻る</button>';

function computeTestFormatStats(questionRecords){
  var longReadingSetIds = {};
  var checkboxCount = 0, extractionCount = 0, extractionWithLimitCount = 0, extractionWithoutLimitCount = 0;
  questionRecords.forEach(function(r){
    if(r.isLongReading && r.questionSetId) longReadingSetIds[r.questionSetId] = true;
    if(r.questionType === "multi") checkboxCount++;
    if(r.questionType === "text"){
      extractionCount++;
      var q = byIdTest(r.questionId);
      if(q && q.extractionType === "with_limit") extractionWithLimitCount++;
      else extractionWithoutLimitCount++;
    }
  });
  return {
    longReadingCount: Object.keys(longReadingSetIds).length,
    checkboxCount: checkboxCount,
    extractionCount: extractionCount,
    extractionWithLimitCount: extractionWithLimitCount,
    extractionWithoutLimitCount: extractionWithoutLimitCount
  };
}

// 正答率(%)・長文問題数・設問形式から、アプリ独自の言語到達度(1-7)を算出する。
// 実際のSPIの公式レベル1-7とは異なる、本アプリ独自の推定指標。
function computeLanguageEvaluation(accuracyPct, fmt){
  var high = accuracyPct >= 80;
  var midhigh = accuracyPct >= 70;
  var mid = accuracyPct >= 60;
  var longCount = fmt.longReadingCount;

  if(longCount >= 2){
    if(high) return 7;
    if(mid) return 6; // 長文2題＋正答率60〜79%
    return 4; // 長文が出現する水準は基本4以上
  }
  if(longCount === 1){
    if(fmt.extractionWithoutLimitCount > 0 && high) return 7; // 抜き出し(字数指定なし)＋高正答率
    if(fmt.extractionWithLimitCount > 0 && high) return 6;    // 抜き出し(字数指定あり)＋高正答率
    if(fmt.checkboxCount > 0 && high) return 6;                // チェックボックス＋高正答率
    if(midhigh) return 5; // 長文1題＋正答率70%以上
    if(mid) return 4;     // 長文1題＋正答率60〜69%
    return 4;              // 長文が出現しただけで基本4以上
  }
  // 長文なし
  if(high) return 4;
  if(midhigh) return 3;
  if(mid) return 2;
  return 1;
}

function accuracyBand(pct){
  if(pct >= 80) return "高い";
  if(pct >= 70) return "〇";
  if(pct >= 60) return "△";
  return "低い";
}

// ---------- 非言語 7段階評価（アプリ独自の推定指標） ----------
// 問題難易度(1-7)とは別に管理する。正答率だけでなく「どの難易度で正解できたか」
// 「組問題・4タブ型のような複雑な出題形式に対応できたか」を反映する。
function computeNonverbalFormatStats(questionRecords){
  var high = {answered:0, correct:0};       // 難易度6以上
  var multi = {answered:0, correct:0};      // 組問題（2問以上のセット）
  var fourTab = {answered:0, correct:0};    // 4問セット（4タブ）
  questionRecords.forEach(function(r){
    if(r.difficulty >= 6){ high.answered++; if(r.correct) high.correct++; }
    if(r.questionSetId){
      multi.answered++; if(r.correct) multi.correct++;
      var q = byId(r.questionId);
      if(q && q.questionSetSize === 4){ fourTab.answered++; if(r.correct) fourTab.correct++; }
    }
  });
  function pct(o){ return o.answered>0 ? Math.round((o.correct/o.answered)*1000)/10 : null; }
  return {
    highDifficultyAnswered: high.answered, highDifficultyCorrect: high.correct, highDifficultyAccuracy: pct(high),
    multiAnswered: multi.answered, multiCorrect: multi.correct, multiAccuracy: pct(multi),
    fourTabAnswered: fourTab.answered, fourTabCorrect: fourTab.correct, fourTabAccuracy: pct(fourTab)
  };
}

function computeNonverbalEvaluation(accuracyPct, startDifficulty, finalDifficulty, fmt){
  var fd = finalDifficulty;
  var highOk = (fmt.highDifficultyAnswered === 0) || (fmt.highDifficultyAccuracy >= 70);
  var highAttempted = fmt.highDifficultyAnswered > 0;
  var complexOk = (fmt.multiAnswered === 0 || fmt.multiAccuracy >= 60) &&
                  (fmt.fourTabAnswered === 0 || fmt.fourTabAccuracy >= 60);

  if(fd >= 6 && accuracyPct >= 80 && highAttempted && highOk && complexOk) return 7;
  if(fd >= 5 && accuracyPct >= 70 && highOk) return 6;
  if(fd >= 4 && accuracyPct >= 60) return 5;
  if(fd >= 3 && accuracyPct >= 50) return 4;
  if(accuracyPct >= 40) return 3;
  if(accuracyPct >= 25) return 2;
  return 1;
}

function renderTestResult(){

  var correct = t.questionRecords.filter(function(r){ return r.correct; }).length;
  var incorrect = answered - correct;
  var unanswered = total - answered;
  var accuracy = answered>0 ? Math.round((correct/answered)*1000)/10 : 0;
  var totalTimeSec = (t.testEndTime - t.testStartTime) / 1000;
  var avgTime = answered>0 ? (t.questionRecords.reduce(function(s,r){return s+r.answerTime;},0)/answered) : 0;
  var difficulties = t.questionRecords.map(function(r){return r.difficulty;});
  var maxDiff = difficulties.length ? Math.max.apply(null,difficulties) : null;
  var minDiff = difficulties.length ? Math.min.apply(null,difficulties) : null;
  var levelLabelMap = {1:"基礎",2:"基礎～標準",3:"標準よりやや易しい",4:"標準",5:"標準よりやや難しい",6:"難しい",7:"非常に難しい"};
  var endReasonLabel = {completed:"すべての問題に回答", timeout:"時間切れ", manual:"途中終了", exhausted:"出題可能な問題がなくなったため終了"}[t.endReason] || "";

  var html = '<h2>テスト結果</h2>';
  html += '<div class="card"><div style="font-weight:600;margin-bottom:8px;">結果：' + escapeHtml(endReasonLabel) + '</div>';
  html += '<div class="stat-grid">';
  html += statBox(total, "総問題数");
  html += statBox(answered, "回答数");
  html += statBox(correct, "正解数");
  html += statBox(incorrect, "不正解数");
  html += statBox(unanswered, "未回答");
  html += statBox(accuracy+"%", "正答率（回答数ベース）");
  html += '</div>';
  html += '<div style="margin-top:10px;font-size:14px;color:var(--sub);">所要時間：' + formatDuration(totalTimeSec) + ' ／ 平均回答時間：' + formatAnswerTime(avgTime) + '</div>';

    html += '<div class="card"><div style="font-weight:600;margin-bottom:8px;">難易度情報</div><div class="stat-grid">';
    html += statBox(4, "開始difficulty");
    html += statBox(t.currentDifficulty, "最終目標difficulty");
    html += statBox(maxDiff===null?"—":maxDiff, "到達した最高difficulty");
    html += statBox(minDiff===null?"—":minDiff, "到達した最低difficulty");
    html += '</div>';
    html += '<div style="margin-top:10px;">推定レベル：<b>' + (levelLabelMap[t.currentDifficulty]||"—") + '</b></div>';
    html += '<div class="note" style="margin-top:6px;">※推定レベルは本アプリ独自の学習指標です。実際のSPIの得点・偏差値・能力値を示すものではありません。難易度自体もアプリが推定した参考値です。</div>';
    html += '</div>';
  }

  // ---- 言語 推定到達度（1〜7、アプリ独自指標） ----

    if(fmt.checkboxCount>0) formatsReached.push('チェックボックス');
    if(fmt.extractionWithLimitCount>0) formatsReached.push('抜き出し（字数指定あり）');
    if(fmt.extractionWithoutLimitCount>0) formatsReached.push('抜き出し（字数指定なし）');
    if(formatsReached.length===0) formatsReached.push('通常選択形式');
