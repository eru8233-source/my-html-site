  Array.prototype.forEach.call(app.querySelectorAll(".test-time-row"), function(row){
    row.onclick = function(){
      var qid = row.getAttribute("data-qid");
      testDetailExpanded = {};
      go("testDetail");
      setTimeout(function(){
        var target = document.getElementById("test-detail-q-" + qid);
        if(target) target.scrollIntoView({behavior:"smooth", block:"start"});
      }, 30);
    };
  });
  var blockRetryBtn = document.getElementById("b-test-block-retry");
  if(blockRetryBtn){
    blockRetryBtn.onclick = function(){ startTest(); }; // testSetupDraftは維持されたまま同じ条件で新規テストを開始（タイマー・履歴は新規）
  }
}

function renderTestDetail(){
  var t = state.test, cfg = state.testConfig;
  var html = '<div class="backlink" id="back">← 結果へ戻る</div><h2>問題ごとの結果</h2>';
  var lastSetId = null;
  t.questionRecords.forEach(function(r){
    var q = byIdTest(r.questionId);
    var qtype = r.questionType || q.answerType || "single";
    html += '<div class="card" id="test-detail-q-' + q.id + '">';
    if(q.questionSetId){
      html += '<div class="qtype" style="background:#eef0f7;color:#3a4a8a;margin-bottom:6px;display:inline-block;">【組問題】小問 ' + q.questionSetPosition + ' / ' + q.questionSetSize + '</div>';
    }
    lastSetId = q.questionSetId;
    html += '<div style="font-size:13px;color:var(--sub);margin-bottom:6px;">問題' + r.order + '　難易度：' + r.difficulty + '　回答時間：' + formatAnswerTime(r.answerTime) + '</div>';
    html += renderQuestionBody(q);
    if(q.resource){ html += '<div class="resource">' + renderResource(q) + '</div>'; }

    if(qtype === "text" || q.options.length===0){
      html += '<div class="answer-line">あなたの回答：<b>' + escapeHtml(r.userAnswer||"") + '</b></div>';
      html += '<div class="answer-line">正解：<b>' + escapeHtml(q.answer) + '</b></div>';
    } else if(qtype === "multi"){
      q.options.forEach(function(opt,idx){
        var cls = "opt";
        var isCorrectOpt = q.answer.indexOf(idx) !== -1;
        var isSelectedOpt = (r.userAnswer||[]).indexOf(idx) !== -1;
        if(isCorrectOpt) cls += " correct";
        else if(isSelectedOpt && !isCorrectOpt) cls += " incorrect";
        html += '<div class="' + cls + '" style="pointer-events:none;"><span class="label">' + letters(idx) + '.</span> ' + renderOption(q, idx) + (isSelectedOpt? '　（あなたの回答）':'') + '</div>';
      });
    } else {
      q.options.forEach(function(opt,idx){
        var cls = "opt";
        if(idx===q.answer) cls += " correct";
        else if(idx===r.userAnswer && !r.correct) cls += " incorrect";
        html += '<div class="' + cls + '" style="pointer-events:none;"><span class="label">' + letters(idx) + '.</span> ' + renderOption(q, idx) + (idx===r.userAnswer? '　（あなたの回答）':'') + '</div>';
      });
    }
    html += '<div class="answer-line" style="margin-top:8px;">結果：<b>' + (r.correct?"正解":"不正解") + '</b></div>';
    if(q.explanation){ html += '<div class="explain"><b>解説</b><br>' + escapeHtml(q.explanation) + '</div>'; }
    if(qtype === "single" || qtype === "multi"){
      if(testDetailExpanded[r.order] === undefined){
        testDetailExpanded[r.order] = {};
        if(!r.correct){
          if(qtype === "multi"){
            q.answer.forEach(function(i){ testDetailExpanded[r.order][i] = true; });
            (r.userAnswer||[]).forEach(function(i){ testDetailExpanded[r.order][i] = true; });
          } else {
            testDetailExpanded[r.order][q.answer] = true;
            testDetailExpanded[r.order][r.userAnswer] = true;
          }
        }
      }
      var expMap = testDetailExpanded[r.order];
      html += renderChoiceAccordion(q, {
        idPrefix: "test-acc-" + r.order,
        isOpen: function(i){ return !!expMap[i]; },
        isCorrect: function(i){ return qtype==="multi" ? q.answer.indexOf(i)!==-1 : i===q.answer; },
        isUserPick: function(i){ return qtype==="multi" ? (r.userAnswer||[]).indexOf(i)!==-1 : i===r.userAnswer; }
      });
    }
    html += '</div>';
  });
  var unansweredCount = t.usedIds.length - t.questionRecords.length;
  if(unansweredCount>0){
    html += '<div class="card"><div class="empty">未回答：' + unansweredCount + '問（未選択のまま進行・時間切れ・途中終了のいずれか）</div></div>';
  }
  html += '<button class="btn primary" id="b-back-result">結果画面に戻る</button>';
  app.innerHTML = html;
  document.getElementById("back").onclick = function(){ go("testResult"); };
  document.getElementById("b-back-result").onclick = function(){ go("testResult"); };

  t.questionRecords.forEach(function(r){
    var q = byIdTest(r.questionId);
    var qtype = r.questionType || q.answerType || "single";
    if(qtype !== "single" && qtype !== "multi") return;
    var expMap = testDetailExpanded[r.order] || {};
    bindChoiceAccordionEvents(q, {
      idPrefix: "test-acc-" + r.order,
      onToggle: function(i){ expMap[i] = !expMap[i]; testDetailExpanded[r.order] = expMap; renderTestDetail(); },
      onOpenAll: function(){ q.options.forEach(function(o,i){ expMap[i]=true; }); testDetailExpanded[r.order] = expMap; renderTestDetail(); },
      onCloseAll: function(){ testDetailExpanded[r.order] = {}; renderTestDetail(); }
    });
  });
}

// ---------- ルーター ----------
function render(){
  switch(state.screen){
    case "home": renderHome(); break;
    case "login": renderLogin(); break;
    case "signup": renderSignup(); break;
    case "forgotPassword": renderForgotPassword(); break;
    case "top": renderTop(); break;
    case "problemSourceChoice": renderProblemSourceChoice(); break;
    case "flashcardHome": renderFlashcardHome(); break;
    case "flashcardList": renderFlashcardList(); break;
    case "flashcardCreate": renderFlashcardCreate(); break;
    case "flashcardBulkImport": renderFlashcardBulkImport(); break;
    case "flashcardStudy": renderFlashcardStudy(); break;
    case "adminHome": renderAdminHome(); break;
    case "adminAnnouncementEdit": renderAdminAnnouncementEdit(); break;
    case "adminVideoEdit": renderAdminVideoEdit(); break;
    case "category": renderCategory(); break;
    case "setup": renderSetup(); break;
    case "quiz": renderQuiz(); break;
    case "result": renderResult(); break;
    case "stats": renderStats(); break;
    case "testSetup": renderTestSetup(); break;
    case "testRunning": renderTestRunning(); break;
    case "testResult": renderTestResult(); break;
    case "testAbortedResult": renderTestAbortedResult(); break;
    case "testDetail": renderTestDetail(); break;
    case "blockCategory": renderBlockCategory(); break;
    case "blockList": renderBlockList(); break;
    case "combinedSetup": renderCombinedSetup(); break;
    case "combinedTransition": renderCombinedTransition(); break;
    case "combinedResult": renderCombinedResult(); break;
    default: renderHome();
  }
}

// ---------- 起動処理：Supabaseのセッション復元 ----------
function boot(){
  function afterBaseData(cb){
    fetchAnnouncements(function(){ fetchFeaturedVideo(function(){ cb(); }); });
  }
  if(SUPABASE_ENABLED){
    sbClient.auth.onAuthStateChange(function(event, session){
      var newUser = session ? session.user : null;
      if(event === "SIGNED_OUT"){
        currentUser = null;
        currentUserIsAdmin = false;
        return;
      }
      if(event === "SIGNED_IN" && (!currentUser || (newUser && currentUser.id !== newUser.id))){
        currentUser = newUser;
        // Googleログインのリダイレクト帰りなど、まだアプリ側で処理していないログインを検知した場合に反映する
        if(state.screen === "login" || state.screen === "home"){
          migrateGuestDataToSupabase(function(){
            pullUserDataFromSupabase(function(){
              syncFlashcardsOnLogin(function(){
                checkAdminStatus(function(){ go("home"); });
              });
            });
          });
        }
        return;
      }
      currentUser = newUser;
    });
    sbClient.auth.getSession().then(function(res){
      var session = res && res.data ? res.data.session : null;
      currentUser = session ? session.user : null;
      if(currentUser){
        pullUserDataFromSupabase(function(){
          syncFlashcardsOnLogin(function(){
            checkAdminStatus(function(){ afterBaseData(render); });
          });
        });
      } else {
        afterBaseData(render);
      }
    }).catch(function(){ afterBaseData(render); });
  } else {
    render();
  }
}
boot();
})();

</script>
